eport, flags high/low values, and explains general ways to help manage abnormal results.<\/p><\/section>\n\n  <section class=\"card\">\n    <h2>📄 Upload your health report<\/h2>\n    <p class=\"subtitle\">PDFs are processed automatically in your browser. TrustBeat reads normal PDFs directly and automatically runs built-in OCR on scanned/image-only pages when needed.<\/p>\n    <label class=\"upload-box\" id=\"uploadBox\" for=\"fileInput\"><div class=\"upload-icon\">📋<\/div><h3>Drop your PDF here<\/h3><p>Or choose a PDF / TXT / CSV file<\/p><button type=\"button\" class=\"upload-btn\" id=\"chooseFileButton\">Choose file<\/button><div class=\"file-name\" id=\"fileName\"><\/div><div class=\"status-line\" id=\"statusLine\"><\/div><div class=\"progress hidden\" id=\"progress\"><div id=\"progressBar\"><\/div><\/div><\/label>\n    <input id=\"fileInput\" type=\"file\" accept=\".pdf,.txt,.csv,application/pdf,text/plain,text/csv\">\n    <div class=\"divider\">MANUAL TEXT<\/div>\n    <textarea id=\"reportText\" placeholder=\"Paste report text here if needed...&#10;&#10;Example:&#10;Hemoglobin 10.2 g/dL Reference Range: 12 - 15&#10;Glucose 92 mg/dL Reference Range: 70 - 100\"><\/textarea>\n    <button class=\"analyze-btn\" id=\"analyzeBtn\">🔍 Analyze Report<\/button>\n  <\/section>\n\n  <section id=\"resultsSection\" class=\"hidden\">\n    <section class=\"card\"><h2>📊 Report overview<\/h2><p class=\"subtitle\">Only values for which the report provides a usable numerical reference range are compared.<\/p><div class=\"summary-grid\"><div class=\"summary\"><strong id=\"totalCount\">0<\/strong><span>Tests detected<\/span><\/div><div class=\"summary normal\"><strong id=\"normalCount\">0<\/strong><span>Within reference range<\/span><\/div><div class=\"summary high\"><strong id=\"highCount\">0<\/strong><span>High<\/span><\/div><\/div><\/section>\n    <section class=\"card\"><h2>🧪 Detected parameters<\/h2><p class=\"subtitle\">High parameters are highlighted clearly. The comparison uses the reference range printed in your report.<\/p><div class=\"table-wrap\"><table><thead><tr><th>TEST<\/th><th>YOUR VALUE<\/th><th>REFERENCE<\/th><th>STATUS<\/th><\/tr><\/thead><tbody id=\"resultsTable\"><\/tbody><\/table><\/div><\/section>\n    <section class=\"card\"><h2>💡 How to keep abnormal values in control<\/h2><p class=\"subtitle\">These are general, non-diagnostic suggestions. They do not replace medical advice.<\/p><div id=\"suggestions\"><\/div><\/section>\n    <section class=\"card\"><h2>📄 What the PDF actually contained<\/h2><p class=\"subtitle\">This is the extracted report text used for analysis. High and low findings are highlighted.<\/p><div class=\"source-box\" id=\"sourceText\"><\/div><\/section>\n    <section class=\"card\"><div class=\"notice\">⚠️ A value outside a laboratory reference range does not automatically mean disease. Reference ranges vary by laboratory and patient context. Seek professional medical advice for persistent, markedly abnormal, or symptomatic results. Do not start/stop medicines or high-dose supplements based only on this analyser.<\/div><\/section>\n  <\/section>\n<\/div>\n\n<script type=\"module\">\nconst TEST_INFO={\n  hemoglobin:{names:['hemoglobin','haemoglobin','hb'],suggestion:'If low, discuss the cause with a clinician. Iron-rich foods such as lentils, beans and leafy greens may help when iron deficiency is the reason, but do not start iron supplements without appropriate advice.'},\n  glucose:{names:['fasting glucose','blood glucose','glucose','fasting blood sugar','blood sugar'],suggestion:'For persistently high glucose, regular physical activity, balanced meals, adequate sleep and limiting excess added sugar/refined carbohydrates can help. If you use diabetes medication, do not change it without your clinician.'},\n  hba1c:{names:['hba1c','hb a1c','glycated hemoglobin','glycosylated hemoglobin'],suggestion:'For a high HbA1c, focus on regular activity, balanced portions, higher-fiber foods and limiting excess refined carbohydrates. Discuss the result with your clinician because treatment targets are individualized.'},\n  'vitamin d':{names:['vitamin d','25-oh vitamin d','25 hydroxy vitamin d'],suggestion:'Discuss the result with your clinician. Safe sunlight exposure, dietary sources and supplementation may be appropriate depending on the level and your situation; avoid high-dose supplementation without advice.'},\n  'vitamin b12':{names:['vitamin b12','b12','cobalamin'],suggestion:'Discuss an abnormal B12 result with your clinician. If low, foods such as dairy, eggs, fish, meat and fortified foods can provide B12, while the cause of deficiency may need evaluation.'},\n  tsh:{names:['tsh','thyroid stimulating hormone'],suggestion:'TSH should be interpreted together with other thyroid tests and symptoms. Do not try to correct an abnormal TSH through diet alone; discuss it with a clinician.'},\n  cholesterol:{names:['total cholesterol','cholesterol'],suggestion:'For high total cholesterol, regular activity, vegetables, whole grains, nuts and soluble fiber can support heart health, while limiting excess saturated/trans fats may help. Overall cardiovascular risk matters.'},\n  ldl:{names:['ldl cholesterol','ldl-c','ldl'],suggestion:'For high LDL, emphasize vegetables, whole grains and soluble fiber and limit excess saturated/trans fats. Regular physical activity can also help. Your clinician can set an appropriate LDL target.'},\n  hdl:{names:['hdl cholesterol','hdl-c','hdl'],suggestion:'Regular physical activity, not smoking and a balanced diet support cardiovascular health. HDL is best interpreted together with LDL, triglycerides and overall risk.'},\n  triglycerides:{names:['triglycerides','triglyceride'],suggestion:'For high triglycerides, reducing excess added sugar, refined carbohydrates and alcohol, along with regular activity and weight management when appropriate, can help. Discuss markedly high levels with a clinician.'},\n  uric_acid:{names:['uric acid','serum uric  class=\"sub\">These paragraphs are generated only from information available to this page. No unsupported diagnosis or cause is inferred.<\/p>\n<div id=\"insights\"><\/div>\n<\/div>\n<div class=\"card\">\n<h2>Data connected<\/h2>\n<p class=\"sub\">Each source can be connected independently. This keeps Insights ready for the final TrustBeat integration.<\/p>\n<div class=\"sources\" id=\"sources\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" style=\"margin-top:18px\">\n<h2>Current inputs<\/h2>\n<p class=\"sub\">Use these while developing the individual pages. During final integration, the same fields can be supplied automatically by the Sleep, Mood and Activity modules.<\/p>\n<div class=\"formgrid\">\n<div class=\"field\"><label for=\"sleepHours\">Recent sleep (hours)<\/label><input id=\"sleepHours\" type=\"number\" min=\"0\" max=\"24\" step=\"0.1\" placeholder=\"e.g. 7.2\"><\/div>\n<div class=\"field\"><label for=\"moodScore\">Recent mood (1–5)<\/label><input id=\"moodScore\" type=\"number\" min=\"1\" max=\"5\" step=\"1\" placeholder=\"e.g. 3\"><\/div>\n<div class=\"field\"><label for=\"activityMinutes\">Recent activity (minutes)<\/label><input id=\"activityMinutes\" type=\"number\" min=\"0\" max=\"1000\" step=\"1\" placeholder=\"e.g. 35\"><\/div>\n<\/div>\n<div class=\"actions\"><button class=\"action primary\" id=\"generate\">Update insights<\/button><button class=\"action\" id=\"clearInputs\">Clear temporary inputs<\/button><\/div>\n<p class=\"footer-note\">The temporary inputs are stored locally under the Insights contract and can later be replaced by the corresponding module data without changing this page's presentation.<\/p>\n<\/section>\n<\/main>\n<script>\nconst CONTRACT={\n  profile:'trustbeat_user_data',\n  reminders:'trustbeat_reminders',\n  diary:'trustBeatDiaryPages',\n  periods:'luma-cycle-v1',\n  insightsInputs:'trustbeat_insights_inputs',\n  sleep:'trustbeat_sleep_data',\n  mood:'trustbeat_mood_data',\n  activity:'trustbeat_activity_data',\n  diet:'trustbeat_diet_data'\n};\nlet range='7';\nconst $=id=>document.getElementById(id);\nfunction read(key,fallback=null){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch{return fallback}}\nfunction has(key){return localStorage.getItem(key)!==null}\nfunction entriesFromDiary(){const raw=read(CONTRACT.diary,{});if(!raw||typeof raw!=='object')return[];return Object.entries(raw).map(([date,text])=>({date,text:String(text||'').trim()})).filter(x=>x.text)}\nfunction periodData(){return read(CONTRACT.periods,null)}\nfunction getSleep(){const x=read(CONTRACT.sleep,null);if(x)return x;const h=parseFloat($('sleepHours').value);return Number.isFinite(h)?{recentHours:h}:null}\nfunction getMood(){const x=read(CONTRACT.mood,null);if(x)return x;const m=parseFloat($('moodScore').value);return Number.isFinite(m)?{recentScore:m}:null}\nfunction getActivity(){const x=read(CONTRACT.activity,null);if(x)return x;const a=parseFloat($('activityMinutes').value);return Number.isFinite(a)?{recentMinutes:a}:null}\nfunction number(obj,keys){if(!obj)return null;for(const k of keys){const n=Number(obj?.[k]);if(Number.isFinite(n))return n}return null}\nfunction dateText(s){const d=new Date(s);return Number.isNaN(d.getTime())?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}\nfunction diaryInsight(){const e=entriesFromDiary();if(!e.length)return null;const text=e.map(x=>x.text).join(' ').toLowerCase();const positive=['good','happy','calm','grateful','better','great','energised','energized','relaxed','proud'];const difficult=['sad','tired','stress','stressed','anxious','anxiety','angry','overwhelmed','lonely','bad','difficult','low'];const p=positive.reduce((n,w)=>n+(text.match(new RegExp('\\\\b'+w+'\\\\b','g'))||[]).length,0);const d=difficult.reduce((n,w)=>n+(text.match(new RegExp('\\\\b'+w+'\\\\b','g'))||[]).length,0);const latest=e.sort((a,b)=>b.date.localeCompare(a.date))[0];return {count:e.length,p,d,latest}}\nfunction build(){\n ce-top\"><b>${n}<\/b><span class=\"status ${on?'ready':''}\">${on?'Connected':'Waiting'}<\/span><\/div><small>${k}<\/small><\/div>`).join('');\n}\n\ndocument.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-range]').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;render()});\n$('generate').onclick=()=>{localStorage.setItem(CONTRACT.insightsInputs,JSON.stringify({sleepHours:$('sleepHours').value,moodScore:$('moodScore').value,activityMinutes:$('activityMinutes').value,updatedAt:new Date().toISOString()}));render()};\n$('clearInputs').onclick=()=>{$('sleepHours').value='';$('moodScore').value='';$('activityMinutes').value='';localStorage.removeItem(CONTRACT.insightsInputs);render()};\n(function init(){const x=read(CONTRACT.insightsInputs,{});if(x){$('sleepHours').value=x.sleepHours||'';$('moodScore').value=x.moodScore||'';$('activityMinutes').value=x.activityMinutes||''}render()})();\n<\/script>\n<script>(function(){function P(){try{return JSON.parse(localStorage.getItem(\"trustbeat_user_data\")||\"null\")}catch(e){return null}}\nwindow.__tbName=function(){var p=P();return p&&p.name?p.name:\"\"};\ndocument.addEventListener(\"DOMContentLoaded\",function(){var n=window.__tbName();if(!n)return;var h=document.querySelector(\"h1\");if(!h||document.getElementById(\"tbHi\"))return;\nvar s=document.createElement(\"div\");s.id=\"tbHi\";s.textContent=\"Hi, \"+n+\" 💜\";s.style.cssText=\"display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:99px;background:#251a33;color:#b1a2ce;font:700 13px Arial,sans-serif\";h.parentNode.insertBefore(s,h);});})();<\/script><script>(function(){var RX=/\\b(suicid\\w*|kill(?:ing)? myself|end(?:ing)? my (?:own )?life|take my own life|want(?:ed)? to die|wanna die|don['\\u2019]?t want to (?:live|be here)|self[- ]?harm\\w*|hurt(?:ing)? myself|cut(?:ting)? myself|hopeless\\w*|no reason to live|better off dead|end it all)\\b/i;\nfunction reg(){var z=\"\";tr ground:rgba(43,43,43,.86);border:1px solid #261b35;\n    border-radius:28px;padding:30px;box-shadow:0 12px 35px rgba(70,50,100,.08)\n  }\n  .brand{display:flex;align-items:center;gap:14px}\n  .logo{\n    width:54px;height:54px;border-radius:18px;\n    display:grid;place-items:center;background:#3f2d58;color:#c7bad9;\n    font-weight:800;font-size:22px;\n  }\n  h1{margin:0;font-size:30px}.sub{margin:6px 0 0;color:#afaeb7}\n  .privacy{\n    margin-top:18px;padding:12px 15px;border-radius:14px;\n    background:#1f172c;color:#c0bac9;font-size:13px;\n  }\n  .layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:18px}\n  .card{\n    background:rgba(43,43,43,.9);border:1px solid #261b35;\n    border-radius:22px;padding:20px;box-shadow:0 8px 25px rgba(70,50,100,.06)\n  }\n  .card h3{margin-top:0}\n  button{\n    width:100%;border:0;border-radius:13px;padding:12px;margin:6px 0;\n    background:#21182e;color:#cbc0d5;text-align:left;cursor:pointer;\n    font-size:14px;\n  }\n  button:hover{background:#312243}\n  .chat{\n    min-height:480px;display:flex;flex-direction:column;\n  }\n  #messages{flex:1;overflow:auto;padding:4px}\n  .msg{max-width:82%;padding:13px 15px;border-radius:17px;margin:10px 0;line-height:1.5;font-size:14px}\n  .ai{background:#231a2d;border-top-left-radius:5px}\n  .user{background:#254038;margin-left:auto;border-top-right-radius:5px}\n  .composer{display:flex;gap:10px;margin-top:15px}\n  textarea{\n    flex:1;resize:none;border:1px solid #3f344d;border-radius:15px;\n    padding:13px;font:inherit;min-height:52px;outline:none;\n  }\n  .send{width:90px;text-align:center;background:#ab9cbf;color:#2a2539;font-weight:600}\n  .send:hover{background:#b8abc8}\n  .status{font-size:12px;color:#a7a5ad;margin-top:8px}\n  .data-box{\n    margin-top:18px;background:#1c1623;border-radius:15px;padding:13px;\n    font-size:12px;color:#bab8be;\n  }\n  .tag{display:inline-block;padding:5px 8px;border-radius:10px;background:#271d35;margin:3px}\n  .pii-status{\n    margin-top:8px;padding:9px 11px;border-radius:12px;\n    background:#2d2717;color:#e5d9b9;font-size:12px;display:none;\n  }\n  .pii-status.active{display:block}\n  @media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:22px}}\n<\/style>\n<style id=\"tb-dark\">:root{color-scheme:dark}html,body{background-color:#17141f}::selection{background:#c9b6f2;color:#17141f}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3450;border-radius:9px}input,select,textarea{color-scheme:dark}<\/style><\/head>\n<body>\n<div class=\"app\">\n  <section class=\"hero\">\n    <div class=\"brand\">\n      <div class=\"logo\">TB<\/div>\n      <div>\n        <h1>Ask TrustBeat<\/h1>\n        <div class=\"sub\">Your unified wellness AI<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"privacy\">\n      🔒 <b>Privacy-first:<\/b> TrustBeat sends only the data relevant to your question.\n      This standalone demo currently uses sample context until your main website is connected.\n    <\/div>\n\n    <div class=\"layout\">\n      <aside class=\"card\">\n        <h3>Try a question<\/h3>\n        <button onclick=\"usePrompt('Why has my sleep score changed?')\">🌙 Why has my sleep score changed?<\/button>\n        <button onclick=\"usePrompt('What can I improve this week?')\">📈 What can I improve this week?<\/button>\n        <button onclick=\"usePrompt('Explain my blood report.')\">🧪 Explain my blood report.<\/button>\n        <button onclick=\"usePrompt('How can I manage exam stress?')\">📚 How can I manage exam stress?<\/button>\n        <button onclick=\"usePrompt('What patterns do you notice?')\">🔎 What patterns do you notice?<\/button>\n\n        <div class=\"data-box\">\n          <b>Demo context<\/b><br><br>\n          <span class=\"tag\">Sleep<\/span>\n          <span class=\"tag\">Activity<\/span>\n          <span class=\"tag\">Diary<\/span>\n          <span class=\"tag\">Diet<\/span>\n          <span class=\"tag\">Profile<\/span>\n          <br><br>\n          Replace the sample values in <code>getTrustBeatContext()<\/code> when connecting your real website.\n        <\/div>\n      <\/aside>\n\n      <main class=\"card chat\">\n        <div id=\"messages\">\n          <div class=\"msg ai\">\n            Hi! I'm <b>Ask TrustBeat<\/b> 💜<br>\n            I combine your TrustBeat Buddy, SafeTalk AI and Diary AI Consultant into one assistant.\n            Ask me something to begin.\n          <\/div>\n        <\/div>\n\n        <div class=\"composer\">\n          <textarea id=\"message\" placeholder=\"Ask TrustBeat something...\"><\/textarea>\n          <button class=\"send\" onclick=\"sendMessage()\">Send<\/button>\n        <\/div>\n        <div id=\"piiStatus\" class=\"pii-status\" aria-live=\"polite\"><\/div>\n        <div id=\"status\" class=\"status\">Backend: checking...<\/div>\n      <\/main>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst API_URL = \"http://127.0.0.1:8000/ask-trustbeat\";\n\nfunction usePrompt(text){\n  document.getElementById(\"message\").value = text;\n  document.getElementById(\"message\").focus();\n}\n\nfunction addMessage(text, type){\n  const box = document.getElementById(\"messages\");\n  const div = document.createElement(\"div\");\n  div.className = \"msg \" + type;\n  div.textContent = text;\n  box.appendChild(div);\n  box.scrollTop = box.scrollHeight;\n}\n\nfunction getTrustBeatContext(){\n  // DEMO DATA ONLY.\n  // Phase 3 will replace this with the actual TrustBeat website data.\n  return {\n    profile: {\n      name: (window.__tbName&&window.__tbName())||\"there\",\n      age: (JSON.parse(localStorage.getItem(\"trustbeat_user_data\")||\"{}\").age)||18,\n      gender: \"not specified\",\n      goals: [\"wellness\"]\n    },\n    sleep: {\n      sleep_score: 78,\n      sleep_duration: \"7h 10m\",\n      sleep_quality: \"Good\",\n      bedtime: \"11:20 PM\",\n      wake_time: \"6:30 AM\",\n      sleep_history: [\n        {\"date\":\"2026-09-27\",\"score\":84,\"duration\":\"7h 50m\"},\n        {\"date\":\"2026-09-28\",\"score\":81,\"duration\":\"7h 35m\"},\n        {\"date\":\"2026-09-29\",\"score\":78,\"duration\":\"7h 10m\"}\n      ]\n    },\n    activity: {\n      steps_today: 6200,\n      workouts: []\n    },\n    diet: {\n      diet_preferences: [],\n      food_log: []\n    },\n    diary: {\n      diary_entries: [],\n      mood_history: []\n    },\n    blood_report: {\n      blood_report: {},\n      lab_results: []\n    },\n    exam: {\n      exam_schedule: [],\n      study_hours: 0,\n      study_history: []\n    }\n  };\n}\n\nasync function sendMessage(){\n  const input = document.getElementById(\"message\");\n  const message = input.value.trim();\n  if(!message) return;\n\n  addMessage(message, \"user\");\n  input.value = \"\";\n  document.getElementById(\"status\").textContent = \"TrustBeat AI is thinking...\";\n\n  try{\n    const response = await fetch(API_URL, {\n      method:\"POST\",\n      headers:{\"Content-Type\":\"application/json\"},\n      body:JSON.stringify({\n        message: message,\n        user_context: getTrustBeatContext()\n      })\n    });\n\n    if(!response.ok) throw new Error(\"Backend returned \" + response.status);\n\n    const data = await response.json();\n    addMessage(data.answer || \"I couldn't generate a response.\", \"ai\");\n\n    const used = (data.data_used || []).join(\", \") || \"none\";\n    document.getElementById(\"status\").textContent =\n      \"Intent: \" + (data.intent || \"general\") + \" • Data used: \" + used;\n  }catch(error){\n    addMessage(\n      \"I couldn't reach the TrustBeat AI backend. Make sure FastAPI is running at http://127.0.0.1:8000.\",\n      \"ai\"\n    );\n    document.getElementById(\"status\").textContent = \"Backend connection error\";\n  }\n}\n\n\n/* ---------- Live personal-information detector ----------\n   Detection is performed locally in this page while the user types.\n   Detected values are immediately replaced with safe placeholders.\n*/\nconst piiPatterns = {\n  email: /[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}/ig,\n  phone: /(?<!\\w)(?:\\+?\\d[\\d\\s().-]{7,}\\d)(?!\\w)/g\n};\n\n// Name detection is necessarily heuristic. It targets common name phrases\n// such as \"my name is John\", \"I am John\", or \"John Smith\" after a name label.\n// It avoids replacing ordinary sentence words.\nconst namePatterns = [\n  /\\b(?:my\\s+name\\s+is|name\\s*[:\\-]|i\\s+am|i'm)\\s+([A-Z][a-z]+(?:\\s+[A-Z][a-z]+){0,3})\\b/g,\n  /\\b(?:full\\s+name\\s*[:\\-])\\s*([A-Z][a-z]+(?:\\s+[A-Z][a-z]+){0,3})\\b/g\n];\n\nfunction maskLivePII(value){\n  let masked = value;\n  let detected = [];\n\n  if(piiPatterns.email.test(masked)){\n    masked = masked.replace(piiPatterns.email, () => {\n      detected.push(\"email\");\n      return \"[EMAIL]\";\n    });\n  }\n  piiPatterns.email.lastIndex = 0;\n\n  if(piiPatterns.phone.test(masked)){\n    masked = masked.replace(piiPatterns.phone, () => {\n      detected.push(\"phone\");\n      return \"[PHONE]\";\n    });\n  }\n  piiPatterns.phone.lastIndex = 0;\n\n  for(const pattern of namePatterns){\n    masked = masked.replace(pattern, (whole, name) => {\n      detected.push(\"name\");\n      return whole.replace(name, \"[NAME]\");\n    });\n    pattern.lastIndex = 0;\n  }\n\n  return {masked, detected: [...new Set(detected)]};\n}\n\nfunction updatePIIStatus(types){\n  const box = document.getElementById(\"piiStatus\");\n  if(!types.length){\n    box.textContent = \"\";\n    box.classList.remove(\"active\");\n    return;\n  }\n  const labels = {name:\"name\", phone:\"phone number\", email:\"email address\"};\n  box.textContent = \"Protected while typing: \" +\n    types.map(t => labels[t]).join(\", \") + \" → replaced with placeholders.\";\n  box.classList.add(\"active\");\n}\n\nfunction detectPIIWhileTyping(){\n  const input = document.getElementById(\"message\");\n  const result = maskLivePII(input.value);\n\n  if(result.masked !== input.value){\n    input.value = result.masked;\n    // Put the cursor at the end after a live replacement.\n    input.selectionStart = input.selectionEnd = input.value.length;\n  }\n  updatePIIStatus(result.detected);\n}\n\ndocument.getElementById(\"message\").addEventListener(\"input\", detectPIIWhileTyping);\n\ndocument.getElementById(\"message\").addEventListener(\"keydown\", function(e){\n  if(e.key === \"Enter\" && !e.shiftKey){\n    e.preventDefault();\n    sendMessage();\n  }\n});\n\nfetch(\"http://127.0.0.1:8000/health\")\n  .then(r => {\n    if(!r.ok) throw new Error();\n    document.getElementById(\"status\").textContent = \"Backend: connected ✅\";\n  })\n  .catch(() => {\n    document.getElementById(\"status\").textContent = \"Backend: offline — start FastAPI\";\n  });\n<\/script>\n<script>(function(){function P(){try{return JSON.parse(localStorage.getItem(\"trustbeat_user_data\")||\"null\")}catch(e){return null}}\nwindow.__tbName=function(){var p=P();return p&&p.name?p.name:\"\"};\ndocument.addEventListener(\"DOMContentLoaded\",function(){var n=window.__tbName();if(!n)return;var h=document.querySelector(\"h1\");if(!h||document.getElementById(\"tbHi\"))return;\nvar s=document.createElement(\"div\");s.id=\"tbHi\";s.textContent=\"Hi, \"+n+\" 💜\";s.style.cssText=\"display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:99px;background:#251a33;color:#b1a2ce;font:700 13px Arial,sans-serif\";h.parentNode.insertBefore(s,h);});})();<\/script><script>(function(){var RX=/\\b(suicid\\w*|kill(?:ing)? myself|end(?:ing)? my (?:own )?life|take my own life|want(?:ed)? to die|wanna die|don['\\u2019]?t want to (?:live|be here)|self[- ]?harm\\w*|hurt(?:ing)? myself|cut(?:ting)? myself|hopeless\\w*|no reason to live|better off dead|end it all)\\b/i;\nfunction reg(){var z=\"\";try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||\"\"}catch(e){}var l=(navigator.language||\"\").toLowerCase();if(/Kolkata|Calcutta/.test(z)||/-in$/.test(l))return\"IN\";if(/^Australia\\//.test(z))return\"AU\";if(/^Europe\\/Lond const $=id=>document.getElementById(id);let cur='home',frames={},mood=0;
const K={sleep:'trustbeat_sleep_data',mood:'trustbeat_mood_data',act:'trustbeat_activity_data',rem:'trustbeat_reminders',dis:'trustbeat_notif_dismissed',fired:'trustbeat_fired'};
const rd=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sScore=(h,q)=>Math.round(Math.min(100,Math.max(0,100-Math.abs(h-8)*11)*.7+(q||3)*6));
const user=()=>rd('trustbeat_user_data',null);const isF=u=>!!u&&String(u.gender||'').toLowerCase()==='female';
function upd(k,top,en){const d=rd(k,{}),h=(d.history||[]).filter(x=>x.date!==en.date);h.push(en);wr(k,Object.assign({},d,top,{date:en.date,history:h.slice(-30)}))}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
/* ---------- Daily Update ---------- */
function dailyHTML(){const t=td(),s=rd(K.sleep,{}),m=rd(K.mood,{}),a=rd(K.act,{});
 const sh=s.recentHours!=null?+s.recentHours:null,sc=s.score!=null?s.score:(sh!=null?sScore(sh,s.quality):null),ms=m.recentScore!=null?+m.recentScore:null,am=a.recentMinutes!=null?+a.recentMinutes:null;
 if(sh==null&&ms==null&&am==null)return '<div class="dl">No data yet. Log a quick check-in (or use the Sleep and Mood tabs) and your single Daily Update will appear here.</div>';
 const parts=[sc,ms!=null?ms*20:null,am!=null?Math.min(100,am/30*100):null].filter(x=>x!=null),bal=Math.round(parts.reduce((x,y)=>x+y,0)/parts.length);
 const fresh=[s,m,a].filter(x=>x.date===t).length,head=bal>=75?"You're in a good rhythm":bal>=55?'A steady day':'A gentle day: go easy on yourself';
 const L=[];if(sh!=null)L.push(sh<6?'Sleep was short ('+sh+'h), so recovery may be lower today.':sh>=7?'Sleep looks solid at '+sh+'h.':'Sleep was '+sh+'h, a little under 7.');
 if(ms!=null)L.push(ms<=2?'Mood is on the lower end today.':ms>=4?'Mood is on the brighter side today.':'Mood is in the middle today.');
 if(am!=null)L.push('You logged '+am+' minutes of activity.');
 if(sh!=null&&ms!=null){if(sh<6&&ms<=2)L.push('Short sleep and low mood showed up together. That is a pattern worth watching, not a diagnosis.');else if(sh>=7&&ms>=4)L.push('Good sleep and good mood are appearing together. See if this repeats.')}
 const step=sh!=null&&sh<6?'Try an earlier wind-down tonight. The Sleep tab has a calming helper.':ms!=null&&ms<=2?'Write a few lines in your diary, or talk it through with Ask TrustBeat.':am!=null&&am<20?'A short walk could help. Check Workout for today’s recommendation.':'Keep going. Small consistent habits add up.';
 const hs=(s.history||[]).slice(-7),hm=(m.history||[]).slice(-7);
 return '<div class="dh"><span>'+bal+'</span><b>'+head+'</b><div class="sub" style="margin:2px 0 0">Wellness balance'+(fresh<3?' · based on latest logs':' · today')+'</div></div><div class="dm"><div><strong>'+(sc??'–')+'</strong>Sleep score</div><div><strong>'+(ms!=null?['','😢','😔','😐','🙂','😄'][ms]:'–')+'</strong>Mood</div><div><strong>'+(am??'–')+(am!=null?'m':'')+'</strong>Activity</div></div>'+L.map(x=>'<div class="dl">• '+esc(x)+'</div>').join('')+
 (hs.length>1?'<div class="sub" style="margin:10px 0 0">Sleep, last '+hs.length+' days</div><div class="bars">'+hs.map(x=>'<i style="height:'+Math.min(100,x.hours/10*100)+'%"></i>').join('')+'</div>':'')+
 (hm.length>1?'<div class="sub" style="margin:10px 0 0">Mood, last '+hm.length+' days</div><div class="bars m">'+hm.map(x=>'<i style="height:'+x.score*20+'%"></i>').join('')+'</div>':'')+'<div class="step">💡 '+esc(step)+'</div>';}
function saveCheckin(){const h=parseFloat($('ci_h').value),q=+$('ci_q').value,am=parseFloat($('ci_a').value),d=td();
 if(!(h>=0&&h<=16)&&!mood&&!(am>=0)){toast('Add at least one thing to log');return}
