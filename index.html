<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TrustBeat — Know. Trust. Act.</title>
<style>
:root{--bg:#2a2015;--ink:#d6d2dc;--pu:#a18fbf;--pu2:#b1a2ce;--card:#2b2b2b;--line:#312240;--mut:#b3afb9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:linear-gradient(180deg,#1b1428,#27141c);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:6}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;font:800 22px "Baloo 2",Arial,sans-serif}.lg img{height:40px}.lg b{color:#625186}.lg i{font-style:normal;color:#7c4840}
.who{margin-left:auto;font-size:13px;font-weight:700;background:linear-gradient(135deg,#251a33,#2e181e);color:var(--pu2);padding:8px 14px;border-radius:99px;white-space:nowrap}
.bell{position:relative;border:0;background:#251a33;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}.bell em{position:absolute;top:-3px;right:-3px;background:#c65669;color:#2b2b2b;font:800 11px Arial;border-radius:99px;padding:2px 6px;font-style:normal}
#np{position:absolute;right:12px;top:58px;width:330px;max-width:calc(100% - 24px);background:#2b2b2b;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(90,60,120,.3);padding:14px;display:none;z-index:9;max-height:70vh;overflow:auto}
.ni{display:flex;gap:10px;padding:10px;border-radius:14px;background:#1d1427;margin-top:8px;font-size:13px;cursor:pointer}.ni b{display:block}.ni small{color:var(--mut)}.ni .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--ink);font:700 13px inherit;font-family:inherit;padding:10px 15px;border-radius:14px;cursor:pointer}nav button:hover{background:#251a33}
nav button.on{background:linear-gradient(135deg,#61478a,#a18fbf);color:#2b2b2b;box-shadow:0 6px 16px rgba(128,97,181,.4)}nav button.lock{opacity:.4}nav button[hidden]{display:none}
main{flex:1;position:relative;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}iframe.on{display:block}
#hub{position:absolute;inset:0;overflow:auto;padding:22px 18px 50px;display:none}#hub.on{display:block}.w{max-width:1080px;margin:auto}
.hero{display:flex;align-items:center;gap:20px;background:rgba(43,43,43,.85);border:1px solid var(--line);border-radius:28px;padding:20px 26px;box-shadow:0 12px 35px rgba(90,60,120,.1)}.hero img{width:110px}.hero h1{margin:0;font:800 32px "Baloo 2",Arial;color:var(--pu2)}.hero p{margin:4px 0 0;color:var(--mut)}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}.c{background:rgba(43,43,43,.92);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px rgba(90,60,120,.08)}.c h2{margin:0 0 4px;font:800 21px "Baloo 2",Arial;color:var(--pu2)}.sub{font-size:13px;color:var(--mut);margin:0 0 14px}
.dh{padding:16px;border-radius:20px;background:linear-gradient(135deg,#271d35,#2a1815);margin-bottom:12px}.dh b{font:800 20px "Baloo 2",Arial;color:var(--pu2)}.dh span{float:right;font:800 26px "Baloo 2",Arial;color:#c65669}
.dm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.dm div{background:#1d1427;border-radius:16px;padding:12px;text-align:center;font-size:12px;color:var(--mut)}.dm strong{display:block;font-size:20px;color:var(--ink)}
.dl{font-size:14px;line-height:1.6;margin:8px 0}.bars{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:4px}.bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#523c74,#a18fbf);min-height:4px}.bars.m i{background:linear-gradient(180deg,#542b33,#c65669)}
.step{margin-top:12px;padding:12px;border-radius:14px;background:#1a2c25;color:#bdd5ce;font-size:13px;font-weight:600}
label.f{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #40364c;border-radius:12px;font:inherit;background:#2b2b2b}
.moods{display:flex;gap:6px}.moods button{flex:1;font-size:24px;padding:8px 0;border:2px solid transparent;background:#1d1427;border-radius:16px;cursor:pointer}.moods button.on{border-color:var(--pu);background:#251a33}
.pb{border:0;border-radius:14px;background:linear-gradient(135deg,#61478a,#a18fbf);color:#2b2b2b;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:14px;box-shadow:0 6px 16px rgba(128,107,171,.3)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:8px}
.th{border:0;text-align:left;cursor:pointer;border-radius:26px;padding:0;overflow:hidden;background:#2b2b2b;box-shadow:0 10px 26px rgba(90,60,120,.12);transition:.18s;font-family:inherit;color:var(--ink)}.th:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(90,60,120,.22)}
.th .a{height:86px;display:grid;place-items:center;font-size:40px}.th .t{padding:12px 14px 14px}.th b{display:block;font:800 16px "Baloo 2",Arial}.th small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.rl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#29151d;margin-top:8px;font-size:13px}.rl b{color:var(--pu2);min-width:52px}.rl button{margin-left:auto;border:0;background:none;cursor:pointer;color:#de91a8}
.rg{display:grid;grid-template-columns:1fr 90px;gap:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#d6d2dc;color:#2b2b2b;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media(max-width:760px){.g2{grid-template-columns:1fr}.who{display:none}.hero img{width:70px}.hero h1{font-size:24px}.lg span{display:none}}
</style><meta name="theme-color" content="#17141f"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet"><style>:root{color-scheme:dark}</style></head><body>

eight: 15px;\n      display: block;\n      background: #d06b44;\n      border-radius: 50% 50% 50% 8px;\n      transform: rotate(-45deg);\n    }\n\n    /* =========================\n       GENERAL LAYOUT\n    ========================= */\n\n    .layout {\n      display: grid;\n      grid-template-columns: minmax(280px, .7fr) minmax(500px, 1.2fr);\n      gap: clamp(40px, 8vw, 140px);\n      max-width: 1200px;\n      margin: clamp(60px, 9vw, 122px) auto 0;\n    }\n\n    .intro {\n      max-width: 390px;\n      padding-top: 20px;\n    }\n\n    .eyebrow {\n      margin: 0 0 18px;\n      color: #c69e8e;\n      text-transform: uppercase;\n      letter-spacing: 1.6px;\n      font-size: 11px;\n      font-weight: 600;\n    }\n\n    h1,\n    h2 {\n      margin: 0;\n      font-family: Fraunces, Georgia, serif;\n      font-weight: 500;\n      letter-spacing: -1.8px;\n    }\n\n    h1 {\n      color: #d7ede9;\n      font-size: clamp(52px, 5.5vw, 80px);\n      line-height: .98;\n    }\n\n    h1 em {\n      color: #c9826a;\n      font-style: normal;\n    }\n\n    .tagline {\n      margin: 26px 0 14px;\n      color: #d7ede9;\n      font-size: 20px;\n      font-weight: 500;\n    }\n\n    .intro-copy {\n      color: #b9c0bb;\n      font-size: 15px;\n      line-height: 1.7;\n      max-width: 300px;\n    }\n\n    .privacy {\n      display: flex;\n      gap: 10px;\n      margin-top: 78px;\n      padding-top: 16px;\n      border-top: 1px solid #434d41;\n      color: #b9c0bb;\n      font-size: 12px;\n      line-height: 1.55;\n    }\n\n    .check {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      flex: 0 0 23px;\n      height: 23px;\n      border-radius: 50%;\n      background: #364732;\n      color: #bedbd5;\n    }\n\n    /* =========================\n       CARD\n    ========================= */\n\n    .panel {\n      padding: clamp(28px, 4vw, 48px);\n      background: #2b2b2b;\n      border: 1px solid #343d30;\n      border-radius: 20px;\n display: flex;\n      gap: 8px;\n    }\n\n    /* =========================\n       OPTIONS\n    ========================= */\n\n    .goals,\n    .options {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 8px;\n    }\n\n    .goal,\n    .option {\n      padding: 10px 12px;\n      border: 1px solid #3a4539;\n      border-radius: 9px;\n      background: #1f241b;\n      color: #b9c1bd;\n      cursor: pointer;\n      font-size: 12px;\n    }\n\n    .goal:has(input:checked),\n    .option:has(input:checked) {\n      border-color: #99b3a8;\n      background: #283525;\n      color: #cce3dd;\n    }\n\n    .goal input,\n    .option input {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      opacity: 0;\n    }\n\n    fieldset {\n      grid-column: 1 / -1;\n      margin: 7px 0 0;\n      padding: 0;\n      border: 0;\n    }\n\n    legend span {\n      margin-left: 6px;\n      color: #8b958d;\n      font-size: 11px;\n      font-weight: 400;\n    }\n\n    /* =========================\n       PAGE 2 SECTIONS\n    ========================= */\n\n    .section {\n      grid-column: 1 / -1;\n    }\n\n    .section-title {\n      margin-bottom: 7px;\n      color: #cedcd8;\n      font-size: 13px;\n      font-weight: 600;\n    }\n\n    .section-subtitle {\n      margin-bottom: 15px;\n      color: #8b958d;\n      font-size: 11px;\n    }\n\n    .field {\n      margin-bottom: 15px;\n    }\n\n    .optional {\n      color: #8b958d;\n      font-size: 10px;\n      font-weight: 400;\n    }\n\n    .divider {\n      grid-column: 1 / -1;\n      height: 1px;\n      background: #2b2f28;\n      margin: 3px 0;\n    }\n\n    /* =========================\n       BUTTONS\n    ========================= */\n\n    button {\n      border: 0;\n      border-radius: 9px;\n      background: #d4ece7;\n      color: #2a2539;\n      cursor: pointer;\n      font: 600 14px 'DM Sans', sans-serif;\n      transition: .2s;\n    }\n\n    button:hover {\n      background: #c5e2dc;\n    }\n\n    .continue-btn {\n      grid-column: 1 / -1;\n      justify-self: start;\n      margin-top: 10px;\n      padding: 14px 20px;\n    }\n\n    .navigation {\n      grid-column: 1 / -1;\n      display: flex;\n      justify-content: space-between;\n      gap: 12px;\n      margin-top: 10px;\n    }\n\n    .back-btn {\n      padding: 13px 19px;\n      background: transparent;\n      color: #b9c0bb;\n      border: 1px solid #3a4539;\n    }\n\n    .back-btn:hover {\n      background: #25281e;\n    }\n\n    .navigation .continue-btn {\n      margin-top: 0;\n    }\n\n    .footnote {\n      grid-column: 1 / -1;\n      margin: -12px 0 0;\n      color: #879289;\n      font-size: 11px;\n    }\n\n    /* =========================\n       PRIVACY CARD\n    ========================= */\n\n    .privacy-card {\n      grid-column: 1 / -1;\n      display: flex;\n      gap: 10px;\n      padding: 13px;\n      border-radius: 10px;\n      background: #1f271b;\n      color: #b9c0bb;\n      font-size: 11px;\n      line-height: 1.5;\n    }\n\n    /* =========================\n       PERIOD STATUS PAGE\n    ========================= */\n\n    #periodStatusPage,\n    #dashboard {\n      display: none;\n    }\n\n    .period-status-options {\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n      margin-top: 20px;\n    }\n\n    .period-status-option {\n      padding: 16px;\n      border: 1px solid #3a4539;\n      border-radius: 12px;\n      background: #1f241b;\n      color: #cedcd8;\n      cursor: pointer;\n      transition: .2s;\n    }\n\n    .period-status-option:hover {\n      border-color: #99b3a8;\n      background: #1f2a1c;\n    }\n\n    .period-status-option:has(input:checked) {\n      border-color: #99b3a8;\n      background: #283525;\n      color: #cce3dd;\n    }\n\n    .period-status-option input {\n      position: absolute;\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    .period-status-option strong {\n      display: block;\n      font-size: 14px;\n      margin-bottom: 5px;\n    }\n\n    .period-status-option span {\n      display: block;\n      color: #a1a9a3;\n      font-size: 11px;\n      line-height: 1.5;\n      font-weight: 400;\n    }\n\n    .period-status-actions {\n      display: flex;\n      justify-content: space-between;\n      margin-top: 25px;\n    }\n\n    .period-status-actions button {\n      padding: 13px 19px;\n    }\n\n    /* =========================\n       DASHBOARD PLACEHOLDER\n    ========================= */\n\n    #dashboard {\n      max-width: 900px;\n      margin: 100px auto;\n    }\n\n    #dashboard h1 {\n      font-size: clamp(42px, 5vw, 65px);\n    }\n\n    #dashboard p {\n      color: #b9c0bb;\n      line-height: 1.7;\n    }\n\n    .dashboard-card {\n      margin-top: 30px;\n      padding: 30px;\n      background: #2a2539;\n      border: 1px solid #343d30;\n      border-radius: 20px;\n      box-shadow: 0 18px 55px rgba(34, 70, 52, .08);\n    }\n\n    /* =========================\n       RESPONSIVE\n    ========================= */\n\n    @media (max-width: 850px) {\n\n      .layout {\n        grid-template-columns: 1fr;\n        gap: 42px;\n        margin-top: 64px;\n      }\n\n      .intro {\n        max-width: 560px;\n      }\n\n      .privacy {\n        margin-top: 34px;\n      }\n    }\n\n    @media (max-width: 520px) {\n\n      form {\n        grid-template-columns: 1fr;\n      }\n\n      fieldset,\n      .section,\n      .divider,\n      .privacy-card,\n      .continue-btn,\n      .footnote,\n      .navigation {\n        grid-column: 1;\n      }\n\n      .navigation {\n        flex-direction: column-reverse;\n      }\n\n      .navigation button {\n        width: 100%;\n      }\n    }\n  \n/* =========================\n   INTEGRATED DASHBOARD STYLES\n========================= */\n\n@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');\n\n:root {\n    --bg: #20261d;\n    --card: #2b2b2b;\n    --primary: #d4ece7;\n    --primary-light: #28362a;\n    --accent: #c9826a;\n    --text: #d7e7e3;\n    --muted: #b3b9b5;\n    --border: #353e33;\n    --soft: #1c2219;\n    --shadow: 0 10px 30px rgba(31, 67, 52, 0.07);\n}\n\n* {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\nbody {\n    font-family: \"DM Sans\", sans-serif;\n    background: var(--bg);\n    color: var(--text);\n}\n\n/* =========================\n   HEADER\n========================= */\n\n.header {\n    height: 72px;\n    background: rgba(43,43,43,0.94);\n    border-bottom: 1px solid var(--border);\n\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    padding: 0 clamp(20px, 5vw, 70px);\n\n    position: sticky;\n    top: 0;\n    z-index: 100;\n}\n\n.logo {\n    display: flex;\n    align-items: center;\n    gap: 9px;\n\n    font-weight: 700;\n    font-size: 19px;\n    color: var(--primary);\n}\n\n.logo-dot {\n    width: 15px;\n    height: 15px;\n    background: var(--accent);\n    border-radius: 50% 50% 50% 8px;\n    transform: rotate(-45deg);\n}\n\n/* =========================\n   MENU BUTTON\n========================= */\n\n.menu-button {\n    width: 43px;\n    height: 43px;\n\n    border: 1px solid var(--border);\n    background: #2a2539;\n\n    border-radius: 12px;\n\n    cursor: pointer;\n\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: center;\n\n    gap: 4px;\n}\n\n.menu-button span {\n    width: 20px;\n    height: 2px;\n\n    background: var(--primary);\n\n    border-radius: 5px;\n}\n\n/* =========================\n   MENU DRAWER\n========================= */\n\n.menu-overlay {\n    position: fixed;\n    inset: 0;\n\n    background: rgba(20, 50, 43, 0.18);\n\n    opacity: 0;\n    visibility: hidden;\n\n    transition: .25s;\n\n    z-index: 200;\n}\n\n.menu-overlay.open {\n    opacity: 1;\n    visibility: visible;\n}\n\n.side-menu {\n    position: absolute;\n\n    top: 0;\n    right: 0;\n\n    width: min(360px, 88vw);\n    height: 100%;\n\n    background: #2a2539;\n\n    padding: 28px;\n\n    overflow-y: auto;\n\n    transform: translateX(100%);\n    transition: .3s;\n\n    box-shadow: -15px 0 45px rgba(30,60,48,.12);\n}\n\n.menu-overlay.open .side-menu {\n    transform: translateX(0);\n}\n\n.menu-top {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    margin-bottom: 25px;\n}\n\n.menu-top h3 {\n    font-family: Fraunces, Georgia, serif;\n    color: var(--primary);\n\n    font-size: 27px;\n    font-weight: 500;\n}\n\n.close-menu {\n    width: 36px;\n    height: 36px;\n\n    background: var(--soft);\n    color: var(--primary);\n\n    border-radius: 10px;\n}\n\n.menu-section {\n    margin-bottom: 25px;\n}\n\n.menu-section-title {\n    margin-bottom: 8px;\n\n    color: #919994;\n\n    text-transform: uppercase;\n    letter-spacing: 1px;\n\n    font-size: 10px;\n    font-weight: 700;\n}\n\n.menu-item {\n    width: 100%;\n\n    display: flex;\n    align-items: center;\n\n    gap: 12px;\n\n    padding: 13px 12px;\n\n    margin-bottom: 4px;\n\n    border-radius: 10px;\n\n    background: transparent;\n    color: var(--text);\n\n    text-align: left;\n\n    font-size: 13px;\n    font-weight: 600;\n}\n\n.menu-item:hover {\n    background: var(--soft);\n    color: var(--primary);\n}\n\n.menu-icon {\n    width: 30px;\n    height: 30px;\n\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    border-radius: 9px;\n\n    background: var(--primary-light);\n\n    font-size: 15px;\n}\n\n/* =========================\n   PROFILE\n========================= */\n\n.profile-panel {\n    max-width: 1050px;\n    margin: 40px auto;\n    padding: 0 20px 50px;\n}\n\n.profile-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    margin-bottom: 25px;\n}\n\n.profile-header h1 {\n    font-size: 42px;\n}\n\n.profile-edit {\n    padding: 11px 18px;\n}\n\n.profile-card {\n    background: #2a2539;\n    border: 1px solid var(--border);\n    border-radius: 20px;\n\n    padding: 25px;\n\n    box-shadow: var(--shadow);\n}\n\n.profile-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 15px;\n}\n\n.profile-value {\n    padding: 15px;\n\n    border-radius: 12px;\n\n    background: var(--soft);\n}\n\n.profile-value span {\n    display: block;\n\n    margin-bottom: 5px;\n\n    color: var(--muted);\n\n    font-size: 11px;\n}\n\n.profile-value strong {\n    color: var(--primary);\n    font-size: 14px;\n}\n\n@media(max-width:700px) {\n    .profile-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n/* =========================\n   DASHBOARD\n========================= */\n\n.dashboard {\n    max-width: 1200px;\n    margin: 35px auto;\n    padding: 0 24px 60px;\n}\n\n.dashboard-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n\n    margin-bottom: 25px;\n}\n\n.dashboard-header h1 {\n    font-size: clamp(35px, 5vw, 58px);\n}\n\n.dashboard-header p {\n    margin-top: 8px;\n    color: var(--muted);\n}\n\n.dashboard-grid {\n    display: grid;\n    grid-template-columns: 1.1fr .9fr;\n    gap: 20px;\n}\n\n.dashboard-card-new {\n    background: var(--card);\n    border: 1px solid var(--border);\n\n    border-radius: 20px;\n\n    padding: 25px;\n\n    box-shadow: var(--shadow);\n}\n\n.dashboard-card-new h2 {\n    font-size: 29px;\n    margin-bottom: 8px;\n}\n\n.small-muted {\n    color: var(--muted);\n    font-size: 11px;\n}\n\n.change-item {\n    display: flex;\n    align-items: center;\n    gap: 13px;\n\n    padding: 14px 0;\n\n    border-bottom: 1px solid #272d26;\n}\n\n.change-item:last-child {\n    border-bottom: 0;\n}\n\n.change-icon {\n    width: 38px;\n    height: 38px;\n\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    border-radius: 11px;\n\n    background: var(--soft);\n\n    font-size: 18px;\n}\n\n.change-content {\n    flex: 1;\n}\n\n.change-content strong {\n    display: block;\n    font-size: 13px;\n}\n\n.change-content span {\n    display: block;\n\n    margin-top: 4px;\n\n    color: var(--muted);\n\n    font-size: 11px;\n}\n\n.change-value {\n    font-weight: 600;\n    font-size: 12px;\n}\n\n/* =========================\n   FOR YOU\n========================= */\n\n.for-you-item {\n    padding: 15px;\n\n    margin-top: 11px;\n\n    border-radius: 13px;\n\n    background: var(--soft);\n}\n\n.for-you-item strong {\n    display: block;\n\n    margin-bottom: 5px;\n\n    font-size: 13px;\n}\n\n.for-you-item span {\n    color: var(--muted);\n\n    font-size: 11px;\n    line-height: 1.5;\n}\n\n/* =========================\n   GOALS\n========================= */\n\n.goals-card {\n    margin-top: 20px;\n}\n\n.goal-row {\n    margin-top: 18px;\n}\n\n.goal-row-top {\n    display: flex;\n    justify-content: space-between;\n\n    margin-bottom: 8px;\n\n    font-size: 12px;\n}\n\n.progress {\n    width: 100%;\n    height: 9px;\n\n    border-radius: 20px;\n\n    background: #2d352b;\n\n    overflow: hidden;\n}\n\n.progress-bar {\n    height: 100%;\n\n    border-radius: inherit;\n\n    background: #92b0a2;\n}\n\n/* =========================\n   STARS\n========================= */\n\n.stars-card {\n    margin-top: 20px;\n\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    gap: 20px;\n\n    padding: 25px;\n\n    background: #312a19;\n\n    border: 1px solid #55492e;\n\n    border-radius: 20px;\n}\n\n.stars-left {\n    display: flex;\n    align-items: center;\n    gap: 15px;\n}\n\n.star-big {\n    width: 48px;\n    height: 48px;\n\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    background: #98854e;\n\n    border-radius: 13px;\n\n    font-size: 27px;\n}\n\n.stars-number {\n    font-size: 25px;\n    font-weight: 700;\n}\n\n.stars-label {\n    margin-top: 3px;\n\n    color: var(--muted);\n\n    font-size: 11px;\n}\n\n.streak {\n    padding: 10px 14px;\n\n    border-radius: 11px;\n\n    background: #2a2539;\n\n    font-size: 11px;\n    font-weight: 600;\n}\n\n/* =========================\n   STAR ACTIONS\n========================= */\n\n.star-actions {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n\n    gap: 12px;\n\n    margin-top: 15px;\n}\n\n.star-action {\n    padding: 16px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 13px;\n\n    text-align: left;\n\n    cursor: pointer;\n}\n\n.star-action:hover {\n    background: var(--soft);\n}\n\n.star-action strong {\n    display: block;\n\n    color: var(--primary);\n\n    font-size: 13px;\n}\n\n.star-action span {\n    display: block;\n\n    margin-top: 4px;\n\n    color: var(--muted);\n\n    font-size: 10px;\n}\n\n.star-points {\n    margin-top: 8px;\n\n    color: #c79882;\n\n    font-size: 12px;\n    font-weight: 700;\n}\n\n/* =========================\n   HEALTH SUMMARY\n========================= */\n\n.health-card {\n    margin-top: 20px;\n}\n\n.health-grid {\n    display: grid;\n\n    grid-template-columns: repeat(4, 1fr);\n\n    gap: 12px;\n\n    margin-top: 18px;\n}\n\n.health-item {\n    padding: 16px;\n\n    background: var(--soft);\n\n    border-radius: 13px;\n}\n\n.health-item .health-icon {\n    font-size: 20px;\n}\n\n.health-item strong {\n    display: block;\n\n    margin-top: 10px;\n\n    font-size: 17px;\n}\n\n.health-item span {\n    display: block;\n\n    margin-top: 3px;\n\n    color: var(--muted);\n\n    font-size: 10px;\n}\n\n/* =========================\n   DIARY\n========================= */\n\n.feature-grid {\n    display: grid;\n\n    grid-template-columns: repeat(2, 1fr);\n\n    gap: 20px;\n\n    margin-top: 20px;\n}\n\n.feature-card {\n    padding: 25px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 20px;\n\n    box-shadow: var(--shadow);\n}\n\n.feature-card-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    margin-bottom: 15px;\n}\n\n.feature-card-header h2 {\n    font-size: 27px;\n}\n\n.feature-button {\n    padding: 10px 14px;\n\n    font-size: 11px;\n}\n\n.diary-preview {\n    min-height: 100px;\n\n    padding: 15px;\n\n    background: var(--soft);\n\n    border-radius: 12px;\n\n    color: var(--muted);\n\n    font-size: 12px;\n\n    line-height: 1.6;\n}\n\n/* =========================\n   MENSTRUAL HEALTH\n========================= */\n\n.period-card {\n    padding: 25px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 20px;\n\n    box-shadow: var(--shadow);\n}\n\n.period-status {\n    display: inline-flex;\n\n    margin-top: 10px;\n\n    padding: 7px 11px;\n\n    border-radius: 20px;\n\n    background: var(--primary-light);\n\n    color: var(--primary);\n\n    font-size: 10px;\n    font-weight: 600;\n}\n\n.period-info-grid {\n    display: grid;\n\n    grid-template-columns: repeat(3, 1fr);\n\n    gap: 12px;\n\n    margin-top: 18px;\n}\n\n.period-info {\n    padding: 15px;\n\n    background: var(--soft);\n\n    border-radius: 12px;\n}\n\n.period-info span {\n    display: block;\n\n    color: var(--muted);\n\n    font-size: 10px;\n}\n\n.period-info strong {\n    display: block;\n\n    margin-top: 5px;\n\n    font-size: 14px;\n}\n\n/* =========================\n   REMINDERS\n========================= */\n\n.reminder-card {\n    padding: 25px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 20px;\n\n    box-shadow: var(--shadow);\n}\n\n.reminder-tabs {\n    display: flex;\n\n    gap: 8px;\n\n    margin: 18px 0;\n}\n\n.reminder-tab {\n    padding: 9px 12px;\n\n    background: var(--soft);\n\n    color: var(--muted);\n\n    border: 1px solid var(--border);\n\n    border-radius: 9px;\n\n    font-size: 11px;\n}\n\n.reminder-tab.active {\n    background: var(--primary-light);\n\n    color: var(--primary);\n\n    border-color: #415542;\n}\n\n.reminder-list {\n  flex;\n\n    justify-content: flex-end;\n\n    gap: 10px;\n\n    margin-top: 20px;\n}\n\n.secondary-button {\n    padding: 11px 17px;\n\n    background: #2a2539;\n\n    color: var(--primary);\n\n    border: 1px solid var(--border);\n}\n\n.primary-button {\n    padding: 11px 17px;\n}\n\n/* =========================\n   MOBILE\n========================= */\n\n@media(max-width:900px) {\n\n    .dashboard-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .health-grid {\n        grid-template-columns: repeat(2,1fr);\n    }\n\n    .feature-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n@media(max-width:600px) {\n\n    .dashboard {\n        padding: 0 15px 40px;\n    }\n\n    .dashboard-header {\n        flex-direction: column;\n        gap: 15px;\n    }\n\n    .star-actions {\n        grid-template-columns: 1fr;\n    }\n\n    .health-grid {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .period-info-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .modal-form {\n        grid-template-columns: 1fr;\n    }\n\n    .modal-form .full {\n        grid-column: 1;\n    }\n}\n\n/* =========================\n   ADDITIONAL FEATURE STYLES\n========================= */\n\n.feature-page {\n    max-width: 1050px;\n    margin: 40px auto;\n    padding: 0 20px 50px;\n}\n\n.feature-page-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    margin-bottom: 20px;\n}\n\n.feature-page-header h1 {\n    font-size: 42px;\n}\n\n.empty-state {\n    padding: 35px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 20px;\n\n    text-align: center;\n\n    color: var(--muted);\n}\n\n.empty-state .empty-icon {\n    font-size: 40px;\n\n    margin-bottom: 12px;\n}\n\n.diary-entry {\n    padding: 18px;\n\n    background: #2a2539;\n\n    border: 1px solid var(--border);\n\n    border-radius: 14px;\n\n    margin-bottom: 10px;\n}\n\n.diary-entry-date {\n    color: var(--primary);\n\n    font-size: 11px;\n\n    font-weight: 700;\n}\n\n.diary-entry-text {\n    margin-top: 8px;\n\n    color: #bdc5c1;\n\n    font-size: 13px;\n\n    line-height: 1.6;\n}\n\n.reminder-form-grid {\n    display: grid;\n\n    grid-template-columns: 1fr 1fr;\n\n    gap: 15px;\n\n    margin-top: 15px;\n}\n\n.reminder-form-grid .full {\n    grid-column: 1 / -1;\n}\n\n.form-label {\n    display: block;\n\n    margin-bottom: 6px;\n\n    color: var(--text);\n\n    font-size: 11px;\n\n    font-weight: 600;\n}\n\n.form-control {\n    width: 100%;\n\n    height: 44px;\n\n    padding: 0 12px;\n\n    border: 1px solid var(--border);\n\n    border-radius: 9px;\n\n    background: var(--soft);\n\n    color: var(--text);\n\n    font: inherit;\n\n    font-size: 12px;\n}\n\n.form-control:focus {\n    outline: none;\n\n    border-color: #99b3a8;\n}\n\ntextarea.form-control {\n    height: auto;\n\n    min-height: 90px;\n\n    padding-top: 11px;\n\n    resize: vertical;\n}\n\n.reminder-actions {\n    display: flex;\n\n    justify-content: flex-end;\n\n    gap: 10px;\n\n    margin-top: 15px;\n}\n\n.reminder-delete {\n    padding: 8px 11px;\n\n    background: transparent;\n\n    color: #c39f94;\n\n    border: 1px solid #523c33;\n\n    font-size: 10px;\n}\n\n.reminder-delete:hover {\n    background: #281a15;\n}\n\n.toast {\n    position: fixed;\n\n    left: 50%;\n    bottom: 25px;\n\n    transform: translateX(-50%) translateY(20px);\n\n    z-index: 1000;\n\n    padding: 12px 18px;\n\n    background: var(--primary);\n\n    color: #2a2539;\n\n    border-radius: 10px;\n\n    font-size: 12px;\n\n    opacity: 0;\n\n    visibility: hidden;\n\n    transition: .25s;\n}\n\n.toast.show {\n    opacity: 1;\n\n    visibility: visible;\n\n    transform: translateX(-50%) translateY(0);\n}\n\n.hidden {\n    display: none !important;\n}\n  \n/* TrustBeat: period tracking belongs in the dedicated Periods module, not Profile. */\n#periodStatusPage,.period-card,#periodStatusDisplay,[id*=\"PeriodStatus\"],[id*=\"periodStatus\"],[id*=\"PeriodTracker\"],.period-info-grid,.period-info{display:none !important;}\nlabel[for=\"editPeriodStatus\"],#editPeriodStatus{display:none !important;}\n<\/style>\n\n<style id=\"trustbeat-logo-theme\">\n:root{\n  --tb-lavender:#806bab;\n  --tb-lavender-dark:#b0a5c4;\n  --tb-coral:#854b44;\n  --tb-coral-dark:#bf645c;\n  --tb-mint:#548e79;\n  --tb-mint-dark:#a5c2b9;\n  --tb-yellow:#98824e;\n  --tb-cream:#2b2416;\n  --tb-ink:#d6d2dc;\n}\nbody{background:var(--tb-cream)!important;color:var(--tb-ink)!important}\nheader,.header,.topbar{background:rgba(45,38,23,.96)!important}\n.logo,.brand{color:var(--tb-lavender-dark)!important}\n.badge,.header-badge{background:#271d35!important;color:var(--tb-lavender-dark)!important}\nbutton,.support-btn,.upload-btn,.analyze-btn,.save-btn{background:var(--tb-lavender)!important}\nbutton:hover,.support-btn:hover,.upload-btn:hover,.analyze-btn:hover,.save-btn:hover{background:var(--tb-lavender-dark)!important}\n.hero{background:linear-gradient(135deg,#2d2617,#21182d)!important;border-color:#362b3f!important}\n.card,.panel{background:rgba(45,38,23,.97)!important;border-color:#352a3b!important}\ninput:focus,select:focus,textarea:focus{border-color:var(--tb-lavender)!important;box-shadow:0 0 0 3px #261c34!important}\n.prediction,.baseline,.helper,.privacy-banner{background:#22192c!important}\n.period-day,.mood.selected,.chip.selected,.reason.selected{background:#31253f!important;border-color:var(--tb-lavender)!important}\n.today{border-color:var(--tb-coral)!important}\n.fill{background:var(--tb-lavender)!important}\n.action{background:linear-gradient(135deg,#271d35,#2a1815)!important}\n.reminder{background:#281915!important}\n.online{background:#1c3227!important;color:#b0cdc3!important}\n.insight{background:#1a2c25!important;border-color:var(--tb-mint-dark)!important}\n.warning{background:#2e2718!important;border-color:var(--tb-yellow)!important}\n.dot{background:var(--tb-coral)!important}\nh1 em{color:var(--tb-coral)!important}\n.privacy .check{background:#22382e!important;color:var(--tb-mint-dark)!important}\n<\/style>\n\n<style id=\"trustbeat-cute-theme\">\n@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');\nh1,h2,h3,.logo,.brand,.hero h1,.dashboard-header h1,.profile-header h1,.feature-page-header h1,.buddy-text h3{\n  font-family:'Baloo 2',sans-serif!important;\n  letter-spacing:-.3px!important;\n}\n.card,.hero,.panel,.dashboard-card-new,.period-card,.feature-card,.reminder-card,\n.goals-card,.stars-card,.profile-card,.upload-box,.summary,.result-card,.suggestion,.grocery-card,\n.diary-day,.grocery-item,.result-top,.card.calendar-card,.card.history-card,.card.phase-card,\n.card.reminder-card,.card.symptoms-card{\n  border-radius:26px!important;\n}\nbutton:not(.icon-btn):not(.close):not(.modal-close):not(.close-menu):not(.menu-button),\n.btn,.panel-action,.feature-button,.support-btn,.upload-btn,.analyze-btn,.save-btn,.continue-btn,\n.send-btn,.nav-btn,.star-action,.status-link{\n  border-radius:16px!important;\n  box-shadow:0 6px 16px rgba(128,107,171,.28)!important;\n  transition:transform .15s ease,box-shadow .15s ease!important;\n}\nbutton:not(.icon-btn):hover{ transform:translateY(-1px)!important; }\n.mood,.chip,.reason,.symptom,.goal,.option,.height-unit,.period-status-option,.grocery-item{\n  border-radius:18px!important;\n}\n.mood:hover,.chip:hover,.reason:hover{ transform:translateY(-2px)!important; }\n.day,.period-day{ border-radius:14px!important; }\n.metric-icon,.health-icon,.change-icon,.consultant-icon,.buddy-robot,.shield{ border-radius:20px!important; }\n.status-icon,.quick-icon{ filter:drop-shadow(0 3px 6px rgba(128,107,171,.35)); }\n::selection{ background:rgba(128,107,171,.25); }\n<\/style>\n\n<style id=\"trustbeat-cute-bg-v2\">\nhtml,body{\n  background:\n    radial-gradient(circle at 10% 0%, #2d2141 0%, transparent 45%),\n    radial-gradient(circle at 90% 10%, #351b22 0%, transparent 40%),\n    radial-gradient(circle at
