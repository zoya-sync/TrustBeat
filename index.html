4555 !important;\n}\n.score{\n  box-shadow:0 0 0 8px #1e152a, 0 14px 28px rgba(104,70,168,.32) !important;\n}\n\n/* ---- modals / popups ---- */\n.modal-backdrop,.modal-overlay{\n  background:rgba(60,40,90,.38) !important;\n  backdrop-filter: blur(7px) !important;\n}\n.modal{\n  border-radius:28px !important;\n  border:1px solid rgba(43,43,43,.7) !important;\n  box-shadow:0 35px 80px rgba(90,60,120,.38) !important;\n}\n.modal h2, .modal-header h2, #modalTitle, #reminderModalTitle{\n  font-family:'Baloo 2',sans-serif !important;\n  color:#b1a2ce !important;\n}\n.modal-close,.close,.close-menu{\n  border-radius:50% !important;\n  background:#21182f !important;\n  color:#b1a2ce !important;\n  box-shadow:0 4px 10px rgba(128,107,171,.35) !important;\n}\n.modal input,.modal select,.modal textarea,\n.field input,.field select,.form-control{\n  border-radius:13px !important;\n}\n.modal .choice,.choice{\n  border-radius:16px !important;\n}\n.modal .choice.active,.choice.active{\n  box-shadow:0 4px 10px rgba(128,107,171,.35) !important;\n}\n<\/style>\n<style id=\"tb-dark\">:root{color-scheme:dark}html,body{background-color:#17141f}::selection{background:#c9b6f2;color:#17141f}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3450;border-radius:9px}input,select,textarea{color-scheme:dark}<\/style><\/head>\n\n<body>\n\n<!-- =========================================================\n     ONBOARDING / PAGE 1\n========================================================= -->\n\n<div id=\"onboardingPage\">\n\n  <main>\n\n    <div class=\"brand\">\n      <span class=\"dot\"><\/span>\n      TrustBeat\n    <\/div>\n\n    <div class=\"layout\">\n\n      <section class=\"intro\">\n\n        <p class=\"eyebrow\">Your wellness companion<\/p>\n\n        <h1>\n          Your health,<br>\n          <em>decoded.<\/em>\n        <\/h1>\n\n        <p class=\"tagline\">\n          Know. Trust. Act.\n        <\/p>\n\n        <p class=\"intro-copy\">\n          TrustBeat brings your health information together,\n          helps you understand your patterns, and gives you\n          practical guidance you can actually use.\n        <\/p>\n\n        <div class=\"privacy\">\n          <span class=\"check\">✓<\/span>\n\n          <span>\n            Your information stays on this device in this\n            prototype. You remain in control of your data.\n          <\/span>\n        <\/div>\n\n      <\/section>\n\n\n      <!-- =========================\n           PROFILE SETUP\n      ========================= -->\n\n      <section class=\"panel\">\n\n        <div class=\"heading\">\n\n          <p class=\"eyebrow\">Let's get started<\/p>\n\n          <h2>Tell us about yourself<\/h2>\n\n          <p>\n            This helps TrustBeat personalize the information\n            shown on your dashboard.\n          <\/p>\n\n        <\/div>\n\n\n        <form id=\"profileForm\">\n\n          <!-- NAME -->\n\n          <div class=\"field\">\n\n            <label for=\"name\">\n              Name\n            <\/label>\n\n            <input\n              id=\"name\"\n              name=\"name\"\n              type=\"text\"\n              placeholder=\"Enter your name\"\n              required\n            >\n\n          <\/div>\n\n\n          <!-- DATE OF BIRTH -->\n\n          <div class=\"field\">\n\n            <label for=\"dob\">\n              Date of birth\n            <\/label>\n\n            <input\n              id=\"dob\"\n              name=\"dob\"\n              type=\"date\"\n              required\n            >\n\n          <\/div>\n\n\n          <!-- GENDER -->\n\n          <div class=\"field\">\n\n            <label for=\"gender\">\n              Gender\n            <\/label>\n\n            <select\n              id=\"gender\"\n              name=\"gender\"\n              required\n            >\n\n              <option value=\"\">\n                Select gender\n              <\/option>\n\n              <option value=\"Female\">\n                Female\n              <\/option>\n\n              <option value=\"Male\">\n                Male\n              <\/option>\n\n              <option value=\"Non-binary\">\n                Non-binary\n              <\/option>\n\n              <option value=\"Prefer not to say\">\n                Prefer not to say\n              <\/option>\n\n            <\/select>\n\n          <\/div>\n\n\n          <!-- REGION -->\n\n          <div class=\"field\">\n\n            <label for=\"region\">\n              Region\n            <\/label>\n\n            <select\n              id=\"region\"\n              name=\"region\"\n              required\n            >\n\n              <option value=\"\">\n                Select region\n              <\/option>\n\n              <option value=\"India\">\n                India\n              <\/option>\n\n              <option value=\"Other\">\n                Other\n              <\/option>\n\n            <\/select>\n\n          <\/div>\n\n\n          <!-- HEIGHT -->\n\n          <fieldset>\n\n            <legend>\n              Height\n            <\/legend>\n\n            <div class=\"height-options\">\n\n              <label class=\"height-unit\">\n\n                <input\n                  type=\"radio\"\n                  name=\"heightUnit\"\n                  value=\"cm\"\n                  checked\n                >\n\n                Centimetres\n\n              <\/label>\n\n              <label class=\"height-unit\">\n\n                <input\n                  type=\"radio\"\n                  name=\"heightUnit\"\n                  value=\"ft\"\n                >\n\n                Feet / inches\n\n              <\/label>\n\n            <\/div>\n\n\n            <div\n              class=\"height-inputs\"\n              id=\"cmHeight\"\n            >\n\n              <input\n                id=\"heightCm\"\n                name=\"heightCm\"\n                type=\"number\"\n                min=\"50\"\n                max=\"250\"\n                placeholder=\"Height in cm\"\n              >\n\n            <\/div>\n\n\n            <div\n              class=\"height-inputs hidden\"\n              id=\"ftHeight\"\n            >\n\n              <input\n                id=\"heightFt\"\n                name=\"heightFt\"\n                type=\"number\"\n                min=\"2\"\n                max=\"8\"\n                placeholder=\"Feet\"\n              >\n\n              <input\n                id=\"heightIn\"\n                name=\"heightIn\"\n                type=\"number\"\n                min=\"0\"\n                max=\"11\"\n                placeholder=\"Inches\"\n              >\n\n            <\/div>\n\n          <\/fieldset>\n\n\n          <!-- WEIGHT -->\n\n          <div class=\"field\">\n\n            <label for=\"weight\">\n              Weight\n              <span class=\"optional\">(optional)<\/span>\n            <\/label>\n\n            <input\n              id=\"weight\"\n              name=\"weight\"\n              type=\"number\"\n              min=\"10\"\n              max=\"300\"\n              placeholder=\"kg\"\n            >\n\n          <\/div>\n\n\n\n          <div class=\"field\">\n            <label for=\"disability\">\n              Disability / accessibility needs\n              <span class=\"optional\">(optional)<\/span>\n            <\/label>\n            <select id=\"disability\" name=\"disability\">\n              <option value=\"None\">None<\/option>\n              <option value=\"Mobility limitation\">Mobility limitation<\/option>\n              <option value=\"Visual impairment\">Visual impairment<\/option>\n              <option value=\"Hearing impairment\">Hearing impairment<\/option>\n              <option value=\"Other disability\">Other disability<\/option>\n              <option value=\"Prefer not to say\">Prefer not to say<\/option>\n            <\/select>\n          <\/div>\n\n          <div class=\"field\">\n            <label for=\"allergies\">\n              Allergies\n              <span class=\"optional\">(optional)<\/span>\n            <\/label>\n            <input id=\"allergies\" name=\"allergies\" type=\"text\"\n                   placeholder=\"e.g. peanuts, pollen, none\">\n          <\/div>\n\n          <!-- GOALS -->\n\n          <fieldset>\n\n            <legend>\n              What are your wellness goals?\n              <span>Select all that apply<\/span>\n            <\/legend>\n\n            <div class=\"goals\">\n\n              <label class=\"goal\">\n\n                <input\n                  type=\"checkbox\"\n                  name=\"goals\"\n                  value=\"Fitness\"\n                >\n\n                Fitness\n\n              <\/label>\n\n              <label class=\"goal\">\n\n                <input\n                  type=\"checkbox\"\n                  name=\"goals\"\n                  value=\"Better sleep\"\n                >\n\n                Better sleep\n\n              <\/label>\n\n              <label class=\"goal\">\n\n                <input\n                  type=\"checkbox\"\n                  name=\"goals\"\n                  value=\"Nutrition\"\n                >\n\n                Nutrition\n\n              <\/label>\n\n              <label class=\"goal\">\n\n                <input\n                  type=\"checkbox\"\n                  name=\"goals\"\n                  value=\"Stress management\"\n                >\n\n                Stress management\n\n              <\/label>\n\n              <label class=\"goal\">\n\n                <input\n                  type=\"checkbox\"\n                  name=\"goals\"\n                  value=\"General wellness\"\n                >\n\n                General wellness\n\n              <\/label>\n\n            <\/div>\n\n          <\/fieldset>\n\n\n          <div class=\"privacy-card\">\n\n            <span class=\"check\">✓<\/span>\n\n            <span>\n              TrustBeat uses the information you provide\n              to personalize your wellness experience.\n              You can edit these details later from Profile.\n            <\/span>\n\n          <\/div>\n\n\n          <button\n            type=\"submit\"\n            class=\"continue-btn\"\n          >\n            Continue →\n          <\/button>\n\n        <\/form>\n\n      <\/section>\n\n    <\/div>\n\n  <\/main>\n\n<\/div>\n\n\n<!-- =========================================================\n     PERIOD STATUS PAGE\n========================================================= -->\n\n<div id=\"periodStatusPage\">\n\n  <main>\n\n    <div class=\"brand\">\n      <span class=\"dot\"><\/span>\n      TrustBeat\n    <\/div>\n\n\n    <div class=\"layout\">\n\n      <section class=\"intro\">\n\n        <p class=\"eyebrow\">\n          One more thing\n        <\/p>\n\n        <h1>\n          Help us understand\n          <em>your cycle.<\/em>\n        <\/h1>\n\n        <p class=\"tagline\">\n          Your answers shape your experience.\n        <\/p>\n\n        <p class=\"intro-copy\">\n          This information is optional and is used to\n          show relevant menstrual-health features.\n        <\/p>\n\n        <div class=\"privacy\">\n\n          <span class=\"check\">✓<\/span>\n\n          <span>\n            You can update this information later from\n            your Profile.\n          <\/span>\n\n        <\/div>\n\n      <\/section>\n\n\n      <section class=\"panel\">\n\n        <div class=\"heading\">\n\n          <p class=\"eyebrow\">\n            Menstrual health\n          <\/p>\n\n          <h2>\n            Where are you right now?\n          <\/h2>\n\n          <p>\n            Select the option that best describes you.\n          <\/p>\n\n        <\/div>\n\n\n        <div class=\"period-status-options\">\n\n\n          <label class=\"period-status-option\">\n\n            <input\n              type=\"radio\"\n              name=\"periodStatus\"\n              value=\"not_started\"\n            >\n\n            <strong>\n              I have not started getting periods\n            <\/strong>\n\n            <span>\n              Menstrual cycles have not started yet.\n            <\/span>\n\n          <\/label>\n\n\n          <label class=\"period-status-option\">\n\n            <input\n              type=\"radio\"\n              name=\"periodStatus\"\n              value=\"currently_getting\"\n            >\n\n            <strong>\n              I am currently getting periods\n            <\/strong>\n\n            <span>\n              I currently experience menstrual cycles.\n            <\/span>\n\n          <\/label>\n\n\n          <label class=\"period-status-option\">\n\n            <input\n              type=\"radio\"\n              name=\"periodStatus\"\n              value=\"menopause\"\n            >\n\n            <strong>\n              I have reached menopause\n            <\/strong>\n\n            <span>\n              My menstrual cycles have ended.\n            <\/span>\n\n          <\/label>\n\n\n          <label class=\"period-status-option\">\n\n            <input\n              type=\"radio\"\n              name=\"periodStatus\"\n              value=\"prefer_not\"\n            >\n\n            <strong>\n              Prefer not to say\n            <\/strong>\n\n            <span>\n              You can skip menstrual-health personalization.\n            <\/span>\n\n          <\/label>\n\n        <\/div>\n\n\n        <div class=\"period-status-actions\">\n\n          <button\n            type=\"button\"\n            class=\"back-btn\"\n            onclick=\"goBackToProfile()\"\n          >\n            ← Back\n          <\/button>\n\n          <button\n            type=\"button\"\n            onclick=\"finishProfileSetup()\"\n          >\n            Go to Dashboard →\n          <\/button>\n\n        <\/div>\n\n      <\/section>\n\n    <\/div>\n\n  <\/main>\n\n<\/div>\n\n\n<!-- =========================================================\n     DASHBOARD\n========================================================= -->\n\n<div id=\"dashboard\">\n\n  <!-- HEADER -->\n\n  <header class=\"header\">\n\n    <div class=\"logo\">\n\n      <span class=\"logo-dot\"><\/span>\n\n      TrustBeat\n\n    <\/div>\n\n\n    <button\n      class=\"menu-button\"\n      onclick=\"openMenu()\"\n      aria-label=\"Open menu\"\n    >\n\n      <span><\/span>\n      <span><\/span>\n      <span><\/span>\n\n    <\/button>\n\n  <\/header>\n\n\n  <!-- MAIN DASHBOARD -->\n\n  <main class=\"dashboard\">\n\n\n    <section class=\"dashboard-header\">\n\n      <div>\n\n        <p class=\"eyebrow\">\n          Your wellness today\n        <\/p>\n\n        <h1>\n          Good morning,\n          <span id=\"dashboardName\">\n            there\n          <\/span>.\n        <\/h1>\n\n        <p>\n          Here's what your health data is telling you today.\n        <\/p>\n\n      <\/div>\n\n    <\/section>\n\n\n    <!-- =========================\n         TODAY'S HEALTH\n    ========================= -->\n\n    <section class=\"dashboard-card-new health-card\">\n\n      <h2>\n        Today's Health\n      <\/h2>\n\n      <p class=\"small-muted\">\n        Your latest wellness snapshot\n      <\/p>\n\n\n      <div class=\"health-grid\">\n\n\n        <div class=\"health-item\">\n\n          <div class=\"health-icon\">\n            🚶\n          <\/div>\n\n          <strong id=\"stepsValue\">\n            6,240\n          <\/strong>\n\n          <span>\n            Steps\n          <\/span>\n\n        <\/div>\n\n\n        <div class=\"health-item\">\n\n          <div class=\"health-icon\">\n            ❤️\n          <\/div>\n\n          <strong id=\"heartValue\">\n            76\n          <\/strong>\n\n          <span>\n            Heart rate\n          <\/span>\n\n        <\/div>\n\n\n        <div class=\"health-item\">\n\n          <div class=\"health-icon\">\n            😌\n          <\/div>\n\n          <strong id=\"stressValue\">\n            Low\n          <\/strong>\n\n          <span>\n            Stress\n          <\/span>\n\n        <\/div>\n\n\n        <div class=\"health-item\">\n\n          <div class=\"health-icon\">\n            🌙\n          <\/div>\n\n          <strong id=\"sleepValue\">\n            7h 42m\n          <\/strong>\n\n          <span>\n            Sleep\n          <\/span>\n\n        <\/div>\n\n\n      <\/div>\n\n    <\/section>\n\n\n    <!-- =========================\n         DASHBOARD GRID\n    ========================= -->\n\n    <div class=\"dashboard-grid\"\n         style=\"margin-top:20px;\">\n\n\n      <!-- WHAT'S CHANGED -->\n\n      <section class=\"dashboard-card-new\">\n\n        <h2>\n          What's Changed?\n        <\/h2>\n\n        <p class=\"small-muted\">\n          Compared with your recent pattern\n        <\/p>\n\n\n        <div class=\"change-item\">\n\n          <div class=\"change-icon\">\n            🚶\n          <\/div>\n\n          <div class=\"change-content\">\n\n            <strong>\n              Activity\n            <\/strong>\n\n            <span>\n              You're moving more than usual.\n            <\/span>\n\n          <\/div>\n\n          <div class=\"change-value\">\n            +12%\n          <\/div>\n\n        <\/div>\n\n\n        <div class=\"change-item\">\n\n          <div class=\"change-icon\">\n            🌙\n          <\/div>\n\n          <div class=\"change-content\">\n\n            <strong>\n              Sleep\n            <\/strong>\n\n            <span>\n              Your sleep duration improved.\n            <\/span>\n\n          <\/div>\n\n          <div class=\"change-value\">\n            +34m\n          <\/div>\n\n        <\/div>\n\n\n        <div class=\"change-item\">\n\n          <div class=\"change-icon\">\n            💧\n          <\/div>\n\n          <div class=\"change-content\">\n\n            <strong>\n              Hydration\n            <\/strong>\n\n            <span>\n              You're close to your daily target.\n            <\/span>\n\n          <\/div>\n\n          <div class=\"change-value\">\n            82%\n          <\/div>\n\n        <\/div>\n\n\n      <\/section>\n\n\n      <!-- FOR YOU -->\n\n      <section class=\"dashboard-card-new\">\n\n        <h2>\n          For You\n        <\/h2>\n\n        <p class=\"small-muted\">\n          Small suggestions based on your data\n        <\/p>\n\n\n        <div class=\"for-you-item\">\n\n          <strong>\n            🥗 Add a balanced snack\n          <\/strong>\n\n          <span>\n            A protein-rich snack can help keep\n            your energy steady through the day.\n          <\/span>\n\n        <\/div>\n\n\n        <div class=\"for-you-item\">\n\n          <strong>\n            🌙 Protect your sleep tonight\n          <\/strong>\n\n          <span>\n            Your recent sleep pattern suggests\n            keeping a consistent bedtime may help.\n          <\/span>\n\n        <\/div>\n\n\n        <div class=\"for-you-item\">\n\n          <strong>\n            🚶 Take a short movement break\n          <\/strong>\n\n          <span>\n            A few minutes of movement can break\n            up long periods of sitting.\n          <\/span>\n\n        <\/div>\n\n\n      <\/section>\n\n\n    <\/div>\n\n\n    <!-- =========================\n         GOALS\n    ========================= -->\n\n    <section class=\"dashboard-card-new goals-card\">\n\n      <h2>\n        Your Goals\n      <\/h2>\n\n      <p class=\"small-muted\">\n        Keep building your wellness habits.\n      <\/p>\n\n\n      <div class=\"goal-row\">\n\n        <div class=\"goal-row-top\">\n\n          <strong>\n            Daily movement\n          <\/strong>\n\n          <span>\n            62%\n          <\/span>\n\n        <\/div>\n\n        <div class=\"progress\">\n\n          <div\n            class=\"progress-bar\"\n            style=\"width:62%\"\n          ><\/div>\n\n        <\/div>\n\n      <\/div>\n\n\n      <div class=\"goal-row\">\n\n        <div class=\"goal-row-top\">\n\n          <strong>\n            Sleep consistency\n          <\/strong>\n\n          <span>\n            78%\n          <\/span>\n\n        <\/div>\n\n        <div class=\"progress\">\n\n          <div\n            class=\"progress-bar\"\n            style=\"width:78%\"\n          ><\/div>\n\n        <\/div>\n\n      <\/div>\n\n\n      <div class=\"goal-row\">\n\n        <div class=\"goal-row-top\">\n\n          <strong>\n            Hydration\n          <\/strong>\n\n          <span>\n            82%\n          <\/span>\n\n        <\/div>\n\n        <div class=\"progress\">\n\n          <div\n            class=\"progress-bar\"\n            style=\"width:82%\"\n          ><\/div>\n\n        <\/div>\n\n      <\/div>\n\n\n    <\/section>\n\n\n    <!-- =========================\n         STARS\n    ========================= -->\n\n    <section class=\"stars-card\">\n\n      <div class=\"stars-left\">\n\n        <div class=\"star-big\">\n          ⭐\n        <\/div>\n\n        <div>\n\n          <div class=\"stars-number\">\n\n            <span id=\"starCount\">\n              245\n            <\/span>\n\n            Stars\n\n          <\/div>\n\n          <div class=\"stars-label\">\n            Keep showing up for yourself.\n          <\/div>\n\n        <\/div>\n\n      <\/div>\n\n\n      <div class=\"streak\">\n\n        🔥\n        <span id=\"streakCount\">\n          7\n        <\/span>\n        day streak\n\n      <\/div>\n\n    <\/section>\n\n\n    <!-- STAR ACTIONS -->\n\n    <div class=\"star-actions\">\n\n\n      <button\n        class=\"star-action\"\n        id=\"checkInButton\"\n        onclick=\"completeStarAction('checkin')\"\n      >\n\n        <strong>\n          ✓ Daily Check-in\n        <\/strong>\n\n        <span>\n          Complete today's check-in\n        <\/span>\n\n        <div class=\"star-points\">\n          +10 ⭐\n        <\/div>\n\n      <\/button>\n\n\n      <button\n        class=\"star-action\"\n        onclick=\"completeStarAction('goal')\"\n      >\n\n        <strong>\n          🎯 Complete a Goal\n        <\/strong>\n\n        <span>\n          Finish one of today's goals\n        <\/span>\n\n        <div class=\"star-points\">\n          +15 ⭐\n        <\/div>\n\n      <\/button>\n\n\n      <button\n        class=\"star-action\"\n        onclick=\"completeStarAction('weekly')\"\n      >\n\n        <strong>\n          🏆 Weekly Milestone\n        <\/strong>\n\n        <span>\n          Reach your weekly milestone\n        <\/span>\n\n        <div class=\"star-points\">\n          +50 ⭐\n        <\/div>\n\n      <\/button>\n\n\n    <\/div>\n\n\n    <!-- =========================\n         FEATURE GRID\n    ========================= -->\n\n    <div class=\"feature-grid\">\n\n\n      <!-- MENSTRUAL HEALTH -->\n\n      <section\n        class=\"period-card\"\n        id=\"menstrualDashboardCard\"\n      >\n\n        <div class=\"feature-card-header\">\n\n          <div>\n\n            <h2>\n              Menstrual Health\n            <\/h2>\n\n            <p class=\"small-muted\">\n              Your cycle information\n            <\/p>\n\n          <\/div>\n\n          <button\n            class=\"feature-button\"\n            onclick=\"openPeriodTracker()\"\n          >\n            Open\n          <\/button>\n\n        <\/div>\n\n\n        <div\n          class=\"period-status\"\n          id=\"periodStatusDisplay\"\n        >\n          Not provided\n        <\/div>\n\n\n        <div class=\"period-info-grid\">\n\n          <div class=\"period-info\">\n\n            <span>\n              Cycle status\n            <\/span>\n\n            <strong id=\"cycleStatusText\">\n              —\n            <\/strong>\n\n          <\/div>\n\n\n          <div class=\"period-info\">\n\n            <span>\n              Last period\n            <\/span>\n\n            <strong id=\"lastPeriodText\">\n              —\n            <\/strong>\n\n          <\/div>\n\n\n          <div class=\"period-info\">\n\n            <span>\n              Next expected\n            <\/span>\n\n            <strong id=\"nextPeriodText\">\n              —\n            <\/strong>\n\n          <\/div>\n\n        <\/div>\n\n      <\/section>\n\n\n    <\/div>\n\n\n    <!-- =========================\n         REMINDERS\n    ========================= -->\n\n    <section\n      class=\"reminder-card\"\n      style=\"margin-top:20px;\"\n    >\n\n      <div class=\"feature-card-header\">\n\n        <div>\n\n          <h2>\n            Reminders\n          <\/h2>\n\n          <p class=\"small-muted\">\n            Stay on top of medications and appointments.\n          <\/p>\n\n        <\/div>\n\n        <button\n          class=\"feature-button\"\n          onclick=\"openReminderModal('medication')\"\n        >\n          + Add reminder\n        <\/button>\n\n      <\/div>\n\n\n      <div class=\"reminder-tabs\">\n\n        <button\n          class=\"reminder-tab active\"\n          id=\"medicationTab\"\n          onclick=\"switchReminderTab('medication')\"\n        >\n          💊 Medication\n        <\/button>\n\n        <button\n          class=\"reminder-tab\"\n          id=\"appointmentTab\"\n          onclick=\"switchReminderTab('appointment')\"\n        >\n          📅 Appointment / Checkup\n        <\/button>\n\n      <\/div>\n\n\n      <div\n        class=\"reminder-list\"\n        id=\"reminderList\"\n      >\n\n        <div class=\"empty-state\">\n\n          <div class=\"empty-icon\">\n            ⏰\n          <\/div>\n\n          <p>\n            No reminders added yet.\n          <\/p>\n\n        <\/div>\n\n      <\/div>\n\n    <\/section>\n\n\n  <\/main>\n\n<\/div>\n\n\n<!-- =========================================================\n     HAMBURGER MENU\n========================================================= -->\n\n<div\n  class=\"menu-overlay\"\n  id=\"menuOverlay\"\n  onclick=\"closeMenuOutside(event)\"\n>\n\n  <aside class=\"side-menu\">\n\n    <div class=\"menu-top\">\n\n      <h3>\n        TrustBeat\n      <\/h3>\n\n      <button\n        class=\"close-menu\"\n        onclick=\"closeMenu()\"\n      >\n        ×\n      <\/button>\n\n    <\/div>\n\n\n    <!-- PROFILE -->\n\n    <div class=\"menu-section\">\n\n      <div class=\"menu-section-title\">\n        My Account\n      <\/div>\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openProfile()\"\n      >\n\n        <span class=\"menu-icon\">\n          👤\n        <\/span>\n\n        Profile\n\n      <\/button>\n\n    <\/div>\n\n\n    <!-- HEALTH -->\n\n    <div class=\"menu-section\">\n\n      <div class=\"menu-section-title\">\n        Health\n      <\/div>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openHealthPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          ❤️\n        <\/span>\n\n        Health\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openActivityPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          🚶\n        <\/span>\n\n        Activity\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openSleepPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          🌙\n        <\/span>\n\n        Sleep\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openNutritionPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          🥗\n        <\/span>\n\n        Nutrition\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openPeriodTracker()\"\n      >\n\n        <span class=\"menu-icon\">\n          🩸\n        <\/span>\n\n        Period Tracker\n\n      <\/button>\n\n    <\/div>\n\n\n    <!-- WELLNESS -->\n\n    <div class=\"menu-section\">\n\n      <div class=\"menu-section-title\">\n        Wellness\n      <\/div>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openReminderPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          ⏰\n        <\/span>\n\n        Reminders\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openGoalsPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          🎯\n        <\/span>\n\n        Goals\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openRewardsPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          ⭐\n        <\/span>\n\n        Rewards\n\n      <\/button>\n\n\n    <\/div>\n\n\n    <!-- SETTINGS -->\n\n    <div class=\"menu-section\">\n\n      <div class=\"menu-section-title\">\n        More\n      <\/div>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openSettingsPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          ⚙️\n        <\/span>\n\n        Settings\n\n      <\/button>\n\n\n      <button\n        class=\"menu-item\"\n        onclick=\"openPrivacyPage()\"\n      >\n\n        <span class=\"menu-icon\">\n          🔒\n        <\/span>\n\n        Privacy\n\n      <\/button>\n\n    <\/div>\n\n  <\/aside>\n\n<\/div>\n\n\n<!-- =========================================================\n     PROFILE PAGE\n========================================================= -->\n\n<div\n  id=\"profilePage\"\n  class=\"profile-panel \"\n>\n\n  <div class=\"profile-header\">\n\n    <div>\n\n      <p class=\"eyebrow\">\n        My account\n      <\/p>\n\n      <h1>\n        Profile\n      <\/h1>\n\n    <\/div>\n\n    <div style=\"display:flex; gap:10px;\">\n\n      <button\n        class=\"back-btn\"\n        onclick=\"showDashboard()\"\n      >\n        ← Back to Dashboard\n      <\/button>\n\n      <button\n        class=\"profile-edit\"\n        onclick=\"openEditProfile()\"\n      >\n        Edit profile\n      <\/button>\n\n    <\/div>\n\n  <\/div>\n\n\n  <div class=\"profile-card\">\n\n    <div class=\"profile-grid\">\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Name\n        <\/span>\n\n        <strong id=\"profileName\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Date of birth\n        <\/span>\n\n        <strong id=\"profileDob\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Gender\n        <\/span>\n\n        <strong id=\"profileGender\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Region\n        <\/span>\n\n        <strong id=\"profileRegion\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Height\n        <\/span>\n\n        <strong id=\"profileHeight\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Weight\n        <\/span>\n\n        <strong id=\"profileWeight\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Wellness goals\n        <\/span>\n\n        <strong id=\"profileGoals\">\n          —\n        <\/strong>\n\n      <\/div>\n\n\n      <div class=\"profile-value\">\n\n        <span>\n          Period status\n        <\/span>\n\n        <strong id=\"profilePeriodStatus\">\n          —\n        <\/strong>\n\n      <\/div>\n\n      <div class=\"profile-value\">\n        <span>Disability / accessibility<\/span>\n        <strong id=\"profileDisability\">—<\/strong>\n      <\/div>\n\n      <div class=\"profile-value\">\n        <span>Allergies<\/span>\n        <strong id=\"profileAllergies\">—<\/strong>\n      <\/div>\n\n\n    <\/div>\n\n  <\/div>\n\n<\/div>\n\n\n<!-- =========================================================\n     DIARY MODAL\n========================================================= -->\n\n<div\n  class=\"modal-overlay\"\n  id=\"diaryModal\"\n>\n\n  <div class=\"modal\">\n\n    <div class=\"modal-header\">\n\n      <h2>\n        Personal Diary\n      <\/h2>\n\n      <button\n        class=\"modal-close\"\n        onclick=\"closeDiary()\"\n      >\n        ×\n      <\/button>\n\n    <\/div>\n\n\n    <label class=\"form-label\">\n      How are you feeling today?\n    <\/label>\n\n    <textarea\n      id=\"diaryText\"\n      class=\"form-control\"\n      placeholder=\"Write anything you'd like to remember...\"\n    ><\/textarea>\n\n\n    <div class=\"modal-actions\">\n\n      <button\n        class=\"secondary-button\"\n        onclick=\"closeDiary()\"\n      >\n        Cancel\n      <\/button>\n\n      <button\n        class=\"primary-button\"\n        onclick=\"saveDiaryEntry()\"\n      >\n        Save entry\n      <\/button>\n\n    <\/div>\n\n  <\/div>\n\n<\/div>\n\n\n<!-- =========================================================\n     REMINDER MODAL\n========================================================= -->\n\n<div\n  class=\"modal-overlay\"\n  id=\"reminderModal\"\n>\n\n  <div class=\"modal\">\n\n    <div class=\"modal-header\">\n\n      <h2 id=\"reminderModalTitle\">\n        Add medication reminder\n      <\/h2>\n\n      <button\n        class=\"modal-close\"\n        onclick=\"closeReminderModal()\"\n      >\n        ×\n      <\/button>\n\n    <\/div>\n\n\n    <div class=\"reminder-form-grid\">\n\n\n      <div class=\"full\">\n\n        <label class=\"form-label\">\n          Reminder type\n        <\/label>\n\n        <select\n          id=\"reminderType\"\n          class=\"form-control\"\n          onchange=\"updateReminderForm()\"\n        >\n\n          <option value=\"medication\">\n            Medication reminder\n          <\/option>\n\n          <option value=\"appointment\">\n            Appointment / Checkup reminder\n          <\/option>\n\n        <\/select>\n\n      <\/div>\n\n\n      <div>\n\n        <label\n          class=\"form-label\"\n          id=\"reminderNameLabel\"\n        >\n          Medication name\n        <\/label>\n\n        <input\n          id=\"reminderName\"\n          class=\"form-control\"\n          type=\"text\"\n          placeholder=\"e.g. Vitamin D\"\n        >\n\n      <\/div>\n\n\n      <div id=\"reminderTimeField\">\n\n        <label class=\"form-label\">\n          Reminder time\n        <\/label>\n\n        <input\n          id=\"reminderTime\"\n          class=\"form-control\"\n          type=\"time\"\n        >\n\n      <\/div>\n\n\n      <div id=\"reminderDateField\">\n\n        <label class=\"form-label\">\n          Date\n        <\/label>\n\n        <input\n          id=\"reminderDate\"\n          class=\"form-control\"\n          type=\"date\"\n        >\n\n      <\/div>\n\n\n      <div id=\"repeatField\">\n\n        <label class=\"form-label\">\n          Repeat\n        <\/label>\n\n        <select\n          id=\"reminderRepeat\"\n          class=\"form-control\"\n        >\n\n          <option value=\"once\">\n            Once\n          <\/option>\n\n          <option value=\"daily\">\n            Every day\n          <\/option>\n\n          <option value=\"weekly\">\n            Every week\n          <\/option>\n\n          <option value=\"1week\">\n            Daily for 1 week\n          <\/option>\n\n          <option value=\"2weeks\">\n            Daily for 2 weeks\n          <\/option>\n\n          <option value=\"monthly\">\n            Every month\n          <\/option>\n\n        <\/select>\n\n      <\/div>\n\n\n      <div\n        class=\"full\"\n        id=\"reminderNotesField\"\n      >\n\n        <label class=\"form-label\">\n          Notes\n          <span class=\"optional\">\n            (optional)\n          <\/span>\n        <\/label>\n\n        <textarea\n          id=\"reminderNotes\"\n          class=\"form-control\"\n          placeholder=\"Any instructions provided by your healthcare professional...\"\n        ><\/textarea>\n\n      <\/div>\n\n\n    <\/div>\n\n\n    <div class=\"modal-actions\">\n\n      <button\n        class=\"secondary-button\"\n        onclick=\"closeReminderModal()\"\n      >\n        Cancel\n      <\/button>\n\n      <button\n        class=\"primary-button\"\n        onclick=\"saveReminder()\"\n      >\n        Save reminder\n      <\/button>\n\n    <\/div>\n\n  <\/div>\n\n<\/div>\n\n\n<!-- =========================================================\n     EDIT PROFILE MODAL\n========================================================= -->\n\n<div\n  class=\"modal-overlay\"\n  id=\"editProfileModal\"\n>\n\n  <div class=\"modal\">\n\n    <div class=\"modal-header\">\n\n      <h2>\n        Edit Profile\n      <\/h2>\n\n      <button\n        class=\"modal-close\"\n        onclick=\"closeEditProfile()\"\n      >\n        ×\n      <\/button>\n\n    <\/div>\n\n\n    <div class=\"modal-form\">\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Name\n        <\/label>\n\n        <input\n          id=\"editName\"\n          class=\"form-control\"\n          type=\"text\"\n        >\n\n      <\/div>\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Date of birth\n        <\/label>\n\n        <input\n          id=\"editDob\"\n          class=\"form-control\"\n          type=\"date\"\n        >\n\n      <\/div>\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Gender\n        <\/label>\n\n        <select\n          id=\"editGender\"\n          class=\"form-control\"\n        >\n\n          <option value=\"\">\n            Select gender\n          <\/option>\n\n          <option value=\"Female\">\n            Female\n          <\/option>\n\n          <option value=\"Male\">\n            Male\n          <\/option>\n\n          <option value=\"Non-binary\">\n            Non-binary\n          <\/option>\n\n          <option value=\"Prefer not to say\">\n            Prefer not to say\n          <\/option>\n\n        <\/select>\n\n      <\/div>\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Region\n        <\/label>\n\n        <select\n          id=\"editRegion\"\n          class=\"form-control\"\n        >\n\n          <option value=\"India\">\n            India\n          <\/option>\n\n          <option value=\"Other\">\n            Other\n          <\/option>\n\n        <\/select>\n\n      <\/div>\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Height (cm)\n        <\/label>\n\n        <input\n          id=\"editHeight\"\n          class=\"form-control\"\n          type=\"number\"\n        >\n\n      <\/div>\n\n\n      <div>\n\n        <label class=\"form-label\">\n          Weight (kg)\n        <\/label>\n\n        <input\n          id=\"editWeight\"\n          class=\"form-control\"\n          type=\"number\"\n        >\n\n      <\/div>\n\n      <div>\n        <label class=\"form-label\">Disability / accessibility needs<\/label>\n        <select id=\"editDisability\" class=\"form-control\">\n          <option value=\"None\">None<\/option>\n          <option value=\"Mobility limitation\">Mobility limitation<\/option>\n          <option value=\"Visual impairment\">Visual impairment<\/option>\n          <option value=\"Hearing impairment\">Hearing impairment<\/option>\n          <option value=\"Other disability\">Other disability<\/option>\n          <option value=\"Prefer not to say\">Prefer not to say<\/option>\n        <\/select>\n      <\/div>\n\n      <div>\n        <label class=\"form-label\">Allergies<\/label>\n        <input id=\"editAllergies\" class=\"form-control\" type=\"text\"\n               placeholder=\"e.g. peanuts, pollen, none\">\n      <\/div>\n\n\n\n      <div class=\"full\">\n\n        <label class=\"form-label\">\n          Wellness goals\n        <\/label>\n\n        <input\n          id=\"editGoals\"\n          class=\"form-control\"\n          type=\"text\"\n          placeholder=\"Separate goals with commas\"\n        >\n\n      <\/div>\n\n\n      <div class=\"full\">\n\n        <label class=\"form-label\">\n          Period status\n        <\/label>\n\n        <select\n          id=\"editPeriodStatus\"\n          class=\"form-control\"\n        >\n\n          <option value=\"not_started\">\n            Not started\n          <\/option>\n\n          <option value=\"currently_getting\">\n            Currently getting periods\n          <\/option>\n\n          <option value=\"menopause\">\n            Reached menopause\n          <\/option>\n\n          <option value=\"prefer_not\">\n            Prefer not to say\n          <\/option>\n\n        <\/select>\n\n      <\/div>\n\n\n    <\/div>\n\n\n    <div class=\"modal-actions\">\n\n      <button\n        class=\"secondary-button\"\n        onclick=\"closeEditProfile()\"\n      >\n        Cancel\n      <\/button>\n\n      <button\n        class=\"primary-button\"\n        onclick=\"saveEditedProfile()\"\n      >\n        Save changes\n      <\/button>\n\n    <\/div>\n\n  <\/div>\n\n<\/div>\n\n\n<!-- TOAST -->\n\n<div\n  class=\"toast\"\n  id=\"toast\"\n><\/div>\n<script>\n\n/* =========================================================\n   TRUSTBEAT STORAGE\n========================================================= */\n\nconst STORAGE_KEY = \"trustbeat_user_data\";\nconst REMINDER_KEY = \"trustbeat_reminders\";\nconst DIARY_KEY = \"trustbeat_diary\";\nconst STAR_KEY = \"trustbeat_stars\";\nconst CHECKIN_KEY = \"trustbeat_last_checkin\";\n\nlet userData =\n  JSON.parse(localStorage.getItem(STORAGE_KEY) || \"null\");\n\nlet reminders =\n  JSON.parse(localStorage.getItem(REMINDER_KEY) || \"[]\");\n\nlet diaryEntries =\n  JSON.parse(localStorage.getItem(DIARY_KEY) || \"[]\");\n\nlet stars =\n  Number(localStorage.getItem(STAR_KEY) || \"0\");\n\n\n/* =========================================================\n   SAVE FUNCTIONS\n========================================================= */\n\nfunction saveUserData() {\n\n  localStorage.setItem(\n    STORAGE_KEY,\n    JSON.stringify(userData)\n  );\n\n  // Tell the unified TrustBeat shell that profile settings changed.\n  try {\n    window.parent.postMessage({\n      type: \"trustbeat-profile-updated\"\n    }, \"*\");\n  } catch (e) {}\n\n}\n\n\nfunction saveReminders() {\n\n  localStorage.setItem(\n    REMINDER_KEY,\n    JSON.stringify(reminders)\n  );\n\n}\n\n\nfunction saveDiary() {\n\n  localStorage.setItem(\n    DIARY_KEY,\n    JSON.stringify(diaryEntries)\n  );\n\n}\n\n\nfunction saveStars() {\n\n  localStorage.setItem(\n    STAR_KEY,\n    String(stars)\n  );\n\n}\n\n\n/* =========================================================\n   PAGE CONTROL\n========================================================= */\n\nfunction hideAllMainPages() {\n\n  const pages = [\n    \"onboardingPage\",\n    \"periodStatusPage\",\n    \"dashboard\",\n    \"profilePage\"\n  ];\n\n  pages.forEach(function(id) {\n\n    const page =\n      document.getElementById(id);\n\n    if (page) {\n      page.style.display = \"none\";\n    }\n\n  });\n\n}\n\n\nfunction showOnboarding() {\n\n  hideAllMainPages();\n\n  const page =\n    document.getElementById(\n      \"onboardingPage\"\n    );\n\n  if (page) {\n    page.style.display = \"block\";\n  }\n\n}\n\n\nfunction showPeriodStatusPage() {\n\n  hideAllMainPages();\n\n  const page =\n    document.getElementById(\n      \"periodStatusPage\"\n    );\n\n  if (page) {\n\n    page.style.display = \"block\";\n\n    page.classList.remove(\"hidden\");\n\n  }\n\n}\n\n\nfunction showDashboard() {\n\n  hideAllMainPages();\n\n  const page =\n    document.getElementById(\n      \"dashboard\"\n    );\n\n  if (page) {\n    page.style.display = \"block\";\n  }\n\n  updateDashboard();\n\n}\n\n\nfunction showProfilePage() {\n\n  hideAllMainPages();\n\n  const page =\n    document.getElementById(\n      \"profilePage\"\n    );\n\n  if (page) {\n\n    page.classList.remove(\"hidden\");\n\n    page.style.display = \"block\";\n\n  }\n\n  updateProfileDisplay();\n\n}\n\n\n/* =========================================================\n   SECOND LOGIN / APP START\n========================================================= */\n\nfunction initializeApp() {\n\n  /*\n     THIS is what makes the second opening\n     go directly to the dashboard.\n\n     The browser stores userData in localStorage.\n  */\n\n  const savedUser =\n    localStorage.getItem(\n      STORAGE_KEY\n    );\n\n\n  if (savedUser) {\n\n    try {\n\n      userData =\n        JSON.parse(savedUser);\n\n    } catch(error) {\n\n      userData = null;\n\n    }\n\n  }\n\n\n  hideAllMainPages();\n\n\n  if (\n    userData &&\n    userData.profileComplete === true\n  ) {\n\n    /*\n      Existing user\n      → directly to dashboard\n    */\n\n    showDashboard();\n\n  } else {\n\n    /*\n      New user\n      → start onboarding\n    */\n\n    showOnboarding();\n\n  }\n\n}\n\n\n/* =========================================================\n   PROFILE FORM — PAGE 1\n========================================================= */\n\nconst profileForm =\n  document.getElementById(\n    \"profileForm\"\n  );\n\n\nif (profileForm) {\n\n  profileForm.addEventListener(\n    \"submit\",\n    function(event) {\n\n      event.preventDefault();\n\n\n      const selectedGoals =\n        Array.from(\n          document.querySelectorAll(\n            'input[name=\"goals\"]:checked'\n          )\n        ).map(\n          checkbox => checkbox.value\n        );\n\n\n      userData = {\n\n        name:\n          document.getElementById(\n            \"name\"\n          ).value.trim(),\n\n        dob:\n          document.getElementById(\n            \"dob\"\n          ).value,\n\n        gender:\n          document.getElementById(\n            \"gender\"\n          ).value,\n\n        region:\n          document.getElementById(\n            \"region\"\n          ).value,\n\n        heightUnit:\n          document.querySelector(\n            'input[name=\"heightUnit\"]:checked'\n          )?.value || \"cm\",\n\n        heightCm:\n          document.getElementById(\n            \"heightCm\"\n          ).value,\n\n        heightFt:\n          document.getElementById(\n            \"heightFt\"\n          ).value,\n\n        heightIn:\n          document.getElementById(\n            \"heightIn\"\n          ).value,\n\n        weight:\n          document.getElementById(\n            \"weight\"\n          ).value,\n\n        disability:\n          document.getElementById(\n            \"disability\"\n          ).value || \"None\",\n\n        allergies:\n          document.getElementById(\n            \"allergies\"\n          ).value.trim(),\n\n        goals:\n          selectedGoals,\n\n        profileComplete:\n          false\n\n      };\n\n\n      /*\n        Save immediately so Page 2\n        doesn't lose Page 1 information.\n      */\n\n      saveUserData();\n\n\n      /*\n        IMPORTANT:\n        Page 1 ALWAYS goes to Page 2.\n      */\n\n      showPeriodStatusPage();\n\n    }\n  );\n\n}\n\n\n/* =========================================================\n   PAGE 2 — PERIOD STATUS\n========================================================= */\n\nfunction finishProfileSetup() {\n\n  const selected =\n    document.querySelector(\n      'input[name=\"periodStatus\"]:checked'\n    );\n\n\n  if (!selected) {\n\n    showToast(\n      \"Please select a period status.\"\n    );\n\n    return;\n\n  }\n\n\n  /*\n     Save Page 2 information.\n  */\n\n  userData.periodStatus =\n    selected.value;\n\n\n  userData.lastPeriod =\n    \"\";\n\n  userData.nextPeriod =\n    \"\";\n\n\n  /*\n     THIS is the important flag.\n\n     Once true, the next time the app opens,\n     it skips Page 1 and Page 2.\n  */\n\n  userData.profileComplete =\n    true;\n\n\n  saveUserData();\n\n\n  /*\n     Make sure stars begin at ZERO\n     for a new profile.\n  */\n\n  if (\n    localStorage.getItem(STAR_KEY) === null\n  ) {\n\n    stars = 0;\n\n    saveStars();\n\n  }\n\n\n  showDashboard();\n\n\n  showToast(\n    \"Profile setup complete!\"\n  );\n\n}\n\n\nfunction goBackToProfile() {\n\n  /*\n     Going back should not erase the data.\n  */\n\n  showOnboarding();\n\n}\n\n\n/* =========================================================\n   DASHBOARD\n========================================================= */\n\nfunction updateDashboard() {\n\n  if (!userData) return;\n\n\n  const name =\n    userData.name || \"there\";\n\n\n  const dashboardName =\n    document.getElementById(\n      \"dashboardName\"\n    );\n\n\n  if (dashboardName) {\n\n    dashboardName.textContent =\n      name;\n\n  }\n\n\n  const starCount =\n    document.getElementById(\n      \"starCount\"\n    );\n\n\n  if (starCount) {\n\n    starCount.textContent =\n      stars;\n\n  }\n\n\n  updatePeriodCard();\n\n  renderDiaryPreview();\n\n  renderReminders();\n\n  updateCheckInButton();\n\n}\n\n\n/* =========================================================\n   PROFILE DISPLAY\n========================================================= */\n\nfunction updateProfileDisplay() {\n\n  if (!userData) return;\n\n\n  const fields = {\n\n    profileName:\n      userData.name || \"—\",\n\n    profileDob:\n      formatDate(userData.dob),\n\n    profileGender:\n      userData.gender || \"—\",\n\n    profileRegion:\n      userData.region || \"—\",\n\n    profileHeight:\n      getHeightText(),\n\n    profileWeight:\n      userData.weight\n        ? userData.weight + \" kg\"\n        : \"Not provided\",\n\n    profileGoals:\n      userData.goals &&\n      userData.goals.length\n        ? userData.goals.join(\", \")\n        : \"None selected\",\n\n    profilePeriodStatus:\n      getPeriodStatusText(\n        userData.periodStatus\n      )\n\n  };\n\n\n\n  Object.keys(fields).forEach(\n    function(id) {\n\n      const element =\n        document.getElementById(id);\n\n      if (element) {\n\n        element.textContent =\n          fields[id];\n\n      }\n\n    }\n  );\n\n}\n\n\n/* =========================================================\n   PROFILE MENU\n========================================================= */\n\nfunction openProfile() {\n\n  closeMenu();\n\n  showProfilePage();\n\n}\n\n\n/* =========================================================\n   EDIT PROFILE\n========================================================= */\n\nfunction openEditProfile() {\n\n  if (!userData) return;\n\n\n  document.getElementById(\n    \"editName\"\n  ).value =\n    userData.name || \"\";\n\n\n  document.getElementById(\n    \"editDob\"\n  ).value =\n    userData.dob || \"\";\n\n\n  document.getElementById(\n    \"editGender\"\n  ).value =\n    userData.gender || \"\";\n\n\n  document.getElementById(\n    \"editRegion\"\n  ).value =\n    userData.region || \"India\";\n\n\n  document.getElementById(\n    \"editHeight\"\n  ).value =\n    getHeightInCm();\n\n\n  document.getElementById(\n    \"editWeight\"\n  ).value =\n    userData.weight || \"\";\n\n\n  document.getElementById(\n    \"editGoals\"\n  ).value =\n    userData.goals\n      ? userData.goals.join(\", \")\n      : \"\";\n\n\n  document.getElementById(\n    \"editPeriodStatus\"\n  ).value =\n    userData.periodStatus ||\n    \"prefer_not\";\n\n\n  document.getElementById(\n    \"editProfileModal\"\n  ).classList.add(\"open\");\n\n}\n\n\nfunction closeEditProfile() {\n\n  document.getElementById(\n    \"editProfileModal\"\n  ).classList.remove(\"open\");\n\n}\n\n\nfunction saveEditedProfile() {\n\n  const goalsText =\n    document.getElementById(\n      \"editGoals\"\n    ).value;\n\n\n  userData.name =\n    document.getElementById(\n      \"editName\"\n    ).value.trim();\n\n\n  userData.dob =\n    document.getElementById(\n      \"editDob\"\n    ).value;\n\n\n  userData.gender =\n    document.getElementById(\n      \"editGender\"\n    ).value;\n\n\n  userData.region =\n    document.getElementById(\n      \"editRegion\"\n    ).value;\n\n\n  userData.heightUnit =\n    \"cm\";\n\n\n  userData.heightCm =\n    document.getElementById(\n      \"editHeight\"\n    ).value;\n\n\n  userData.heightFt = \"\";\n\n  userData.heightIn = \"\";\n\n\n  userData.weight =\n    document.getElementById(\n      \"editWeight\"\n    ).value;\n\n\n  userData.goals =\n    goalsText\n      .split(\",\")\n      .map(\n        goal => goal.trim()\n      )\n      .filter(Boolean);\n\n\n  userData.periodStatus =\n    document.getElementById(\n      \"editPeriodStatus\"\n    ).value;\n\n\n  /*\n     DO NOT change profileComplete.\n     It remains TRUE.\n  */\n\n  userData.profileComplete =\n    true;\n\n\n  saveUserData();\n\n\n  closeEditProfile();\n\n\n  updateProfileDisplay();\n\n  updateDashboard();\n\n\n  showToast(\n    \"Profile updated successfully.\"\n  );\n\n}\n\n\n/* =========================================================\n   STARS\n========================================================= */\n\n/*\n   IMPORTANT:\n\n   Stars start at 0.\n\n   They are NOT increased by clicking\n   arbitrary reward buttons.\n\n   Only a valid daily check-in gives +1.\n*/\n\n\nfunction getTodayKey() {\n\n  const today =\n    new Date();\n\n  return (\n    today.getFullYear() +\n    \"-\" +\n    String(\n      today.getMonth() + 1\n    ).padStart(2, \"0\") +\n    \"-\" +\n    String(\n      today.getDate()\n    ).padStart(2, \"0\")\n  );\n\n}\n\n\nfunction hasCheckedInToday() {\n\n  const lastCheckIn =\n    localStorage.getItem(\n      CHECKIN_KEY\n    );\n\n\n  return (\n    lastCheckIn ===\n    getTodayKey()\n  );\n\n}\n\n\nfunction dailyCheckIn() {\n\n  /*\n     Prevent multiple stars\n     on the same day.\n  */\n\n  if (hasCheckedInToday()) {\n\n    showToast(\n      \"You've already checked in today.\"\n    );\n\n    updateCheckInButton();\n\n    return;\n\n  }\n\n\n  /*\n     Record today's check-in.\n  */\n\n  localStorage.setItem(\n    CHECKIN_KEY,\n    getTodayKey()\n  );\n\n\n  /*\n     EXACTLY +1 star.\n  */\n\n  stars += 1;\n\n  saveStars();\n\n\n  /*\n     Update dashboard.\n  */\n\n  const starCount =\n    document.getElementById(\n      \"starCount\"\n    );\n\n\n  if (starCount) {\n\n    starCount.textContent =\n      stars;\n\n  }\n\n\n  updateCheckInButton();\n\n\n  /*\n     Let the user know\n     they earned a star.\n  */\n\n  showToast(\n    \"Daily check-in completed! +1 ⭐\"\n  );\n\n}\n\n\nfunction updateCheckInButton() {\n\n  const button =\n    document.getElementById(\n      \"checkInButton\"\n    );\n\n\n  if (!button) return;\n\n\n  if (hasCheckedInToday()) {\n\n    button.classList.add(\n      \"completed\"\n    );\n\n\n    button.innerHTML = `\n\n      <strong>\n        ✓ Daily Check-in Completed\n      <\/strong>\n\n      <span>\n        You've already checked in today.\n      <\/span>\n\n      <div class=\"star-points\">\n        +1 ⭐ earned\n      <\/div>\n\n    `;\n\n  } else {\n\n    button.classList.remove(\n      \"completed\"\n    );\n\n\n    button.innerHTML = `\n\n      <strong>\n        ✓ Daily Check-in\n      <\/strong>\n\n      <span>\n        Complete today's check-in\n      <\/span>\n\n      <div class=\"star-points\">\n        +1 ⭐\n      <\/div>\n\n    `;\n\n  }\n\n}\n\n\n/* =========================================================\n   IMPORTANT:\n   OLD REWARD BUTTON FUNCTION\n========================================================= */\n\n/*\n   We deliberately DO NOT add stars here.\n\n   Goal completion will be connected later\n   when you give me your goal-completion code.\n*/\n\nfunction completeStarAction(type) {\n\n  if (type === \"checkin\") {\n\n    dailyCheckIn();\n\n    return;\n\n  }\n\n\n  if (type === \"goal\") {\n\n    showToast(\n      \"Goal completion will be connected next.\"\n    );\n\n    return;\n\n  }\n\n\n  if (type === \"weekly\") {\n\n    showToast(\n      \"Weekly milestone tracking will be connected next.\"\n    );\n\n    return;\n\n  }\n\n}\n\n\n/* =========================================================\n   PERIOD CARD\n========================================================= */\n\nfunction updatePeriodCard() {\n\n  if (!userData) return;\n\n\n  const status =\n    userData.periodStatus;\n\n\n  const statusDisplay =\n    document.getElementById(\n      \"periodStatusDisplay\"\n    );\n\n\n  const cycleStatus =\n    document.getElementById(\n      \"cycleStatusText\"\n    );\n\n\n  const lastPeriod =\n    document.getElementById(\n      \"lastPeriodText\"\n    );\n\n\n  const nextPeriod =\n    document.getElementById(\n      \"nextPeriodText\"\n    );\n\n\n  if (!status) {\n\n    if (statusDisplay)\n      statusDisplay.textContent =\n        \"Not provided\";\n\n    return;\n\n  }\n\n\n  if (statusDisplay) {\n\n    statusDisplay.textContent =\n      getPeriodStatusText(status);\n\n  }\n\n\n  if (\n    status ===\n    \"currently_getting\"\n  ) {\n\n    if (cycleStatus)\n      cycleStatus.textContent =\n        \"Currently tracking\";\n\n\n    if (lastPeriod)\n      lastPeriod.textContent =\n        userData.lastPeriod\n          ? formatDate(\n              userData.lastPeriod\n            )\n          : \"Not added\";\n\n\n    if (nextPeriod)\n      nextPeriod.textContent =\n        userData.nextPeriod\n          ? formatDate(\n              userData.nextPeriod\n            )\n          : \"Not added\";\n\n  }\n\n\n  if (\n    status ===\n    \"not_started\"\n  ) {\n\n    if (cycleStatus)\n      cycleStatus.textContent =\n        \"Not started\";\n\n\n    if (lastPeriod)\n      lastPeriod.textContent =\n        \"—\";\n\n\n    if (nextPeriod)\n      nextPeriod.textContent =\n        \"—\";\n\n  }\n\n\n  if (\n    status ===\n    \"menopause\"\n  ) {\n\n    if (cycleStatus)\n      cycleStatus.textContent =\n        \"Menopause\";\n\n\n    if (lastPeriod)\n      lastPeriod.textContent =\n        \"—\";\n\n\n    if (nextPeriod)\n      nextPeriod.textContent =\n        \"—\";\n\n  }\n\n}\n\n\n/* =========================================================\n   HEIGHT\n========================================================= */\n\nfunction getHeightInCm() {\n\n  if (!userData) return \"\";\n\n\n  if (\n    userData.heightUnit === \"ft\"\n  ) {\n\n    const feet =\n      Number(\n        userData.heightFt || 0\n      );\n\n    const inches =\n      Number(\n        userData.heightIn || 0\n      );\n\n\n    if (\n      feet === 0 &&\n      inches === 0\n    ) {\n\n      return \"\";\n\n    }\n\n\n    return Math.round(\n      feet * 30.48 +\n      inches * 2.54\n    );\n\n  }\n\n\n  return userData.heightCm || \"\";\n\n}\n\n\nfunction getHeightText() {\n\n  const cm =\n    getHeightInCm();\n\n\n  return cm\n    ? cm + \" cm\"\n    : \"Not provided\";\n\n}\n\n\n/* =========================================================\n   PERIOD STATUS TEXT\n========================================================= */\n\nfunction getPeriodStatusText(\n  status\n) {\n\n  const values = {\n\n    not_started:\n      \"Not started\",\n\n    currently_getting:\n      \"Currently getting periods\",\n\n    menopause:\n      \"Reached menopause\",\n\n    prefer_not:\n      \"Prefer not to say\"\n\n  };\n\n\n  return (\n    values[status] ||\n    \"Not provided\"\n  );\n\n}\n\n\n/* =========================================================\n   DATE\n========================================================= */\n\nfunction formatDate(\n  dateString\n) {\n\n  if (!dateString)\n    return \"—\";\n\n\n  const date =\n    new Date(dateString);\n\n\n  if (\n    isNaN(\n      date.getTime()\n    )\n  ) {\n\n    return dateString;\n\n  }\n\n\n  return date.toLocaleDateString(\n    \"en-IN\",\n    {\n      day: \"numeric\",\n      month: \"short\",\n      year: \"numeric\"\n    }\n  );\n\n}\n\n\n/* =========================================================\n   MENU\n========================================================= */\n\nfunction openMenu() {\n\n  document\n    .getElementById(\n      \"menuOverlay\"\n    )\n    .classList.add(\"open\");\n\n}\n\n\nfunction closeMenu() {\n\n  document\n    .getElementById(\n      \"menuOverlay\"\n    )\n    .classList.remove(\"open\");\n\n}\n\n\nfunction closeMenuOutside(\n  event\n) {\n\n  if (\n    event.target.id ===\n    \"menuOverlay\"\n  ) {\n\n    closeMenu();\n\n  }\n\n}\n\n\n/* =========================================================\n   DIARY\n========================================================= */\n\nfunction openDiary() {\n\n  document\n    .getElementById(\n      \"diaryModal\"\n    )\n    .classList.add(\"open\");\n\n}\n\n\nfunction closeDiary() {\n\n  document\n    .getElementById(\n      \"diaryModal\"\n    )\n    .classList.remove(\"open\");\n\n}\n\n\nfunction saveDiaryEntry() {\n\n  const text =\n    document.getElementById(\n      \"diaryText\"\n    ).value.trim();\n\n\n  if (!text) {\n\n    showToast(\n      \"Write something before saving.\"\n    );\n\n    return;\n\n  }\n\n\n  diaryEntries.unshift({\n\n    text: text,\n\n    date:\n      new Date().toISOString()\n\n  });\n\n\n  saveDiary();\n\n\n  document.getElementById(\n    \"diaryText\"\n  ).value = \"\";\n\n\n  closeDiary();\n\n  renderDiaryPreview();\n\n\n  showToast(\n    \"Diary entry saved.\"\n  );\n\n}\n\n\nfunction renderDiaryPreview() {\n\n  const preview =\n    document.getElementById(\n      \"diaryPreview\"\n    );\n\n\n  if (!preview) return;\n\n\n  if (\n    !diaryEntries.length\n  ) {\n\n    preview.textContent =\n      \"Your diary is empty for now. Add a note about how you're feeling, your day, or anything you'd like to remember.\";\n\n    return;\n\n  }\n\n\n  const latest =\n    diaryEntries[0];\n\n\n  preview.innerHTML = `\n\n    <div class=\"diary-latest\">\n\n      <span>\n        ${formatDate(\n          latest.date\n        )}\n      <\/span>\n\n      <p>\n        ${escapeHtml(\n          latest.text\n        )}\n      <\/p>\n\n    <\/div>\n\n  `;\n\n}\n\n\n/* =========================================================\n   REMINDERS\n========================================================= */\n\nlet currentReminderTab =\n  \"medication\";\n\n\nfunction openReminderModal(\n  type = \"medication\"\n) {\n\n  document.getElementById(\n    \"reminderType\"\n  ).value = type;\n\n\n  updateReminderForm();\n\n\n  document\n    .getElementById(\n      \"reminderModal\"\n    )\n    .classList.add(\"open\");\n\n}\n\n\nfunction closeReminderModal() {\n\n  document\n    .getElementById(\n      \"reminderModal\"\n    )\n    .classList.remove(\"open\");\n\n}\n\n\nfunction updateReminderForm() {\n\n  const type =\n    document.getElementById(\n      \"reminderType\"\n    ).value;\n\n\n  const title =\n    document.getElementById(\n      \"reminderModalTitle\"\n    );\n\n\n  const label =\n    document.getElementById(\n      \"reminderNameLabel\"\n    );\n\n\n  const repeat =\n    document.getElementById(\n      \"repeatField\"\n    );\n\n\n  if (\n    type ===\n    \"medication\"\n  ) {\n\n    title.textContent =\n      \"Add medication reminder\";\n\n    label.textContent =\n      \"Medication name\";\n\n    repeat.style.display =\n      \"block\";\n\n  } else {\n\n    title.textContent =\n      \"Add appointment / checkup\";\n\n    label.textContent =\n      \"Appointment / checkup\";\n\n    repeat.style.display =\n      \"none\";\n\n  }\n\n}\n\n\nfunction saveReminder() {\n\n  const type =\n    document.getElementById(\n      \"reminderType\"\n    ).value;\n\n\n  const name =\n    document.getElementById(\n      \"reminderName\"\n    ).value.trim();\n\n\n  const time =\n    document.getElementById(\n      \"reminderTime\"\n    ).value;\n\n\n  const date =\n    document.getElementById(\n      \"reminderDate\"\n    ).value;\n\n\n  const repeat =\n    document.getElementById(\n      \"reminderRepeat\"\n    ).value;\n\n\n  const notes =\n    document.getElementById(\n      \"reminderNotes\"\n    ).value.trim();\n\n\n  if (!name) {\n\n    showToast(\n      \"Please enter the name.\"\n    );\n\n    return;\n\n  }\n\n\n  if (!date) {\n\n    showToast(\n      \"Please select a date.\"\n    );\n\n    return;\n\n  }\n\n\n  if (!time) {\n\n    showToast(\n      \"Please select a reminder time.\"\n    );\n\n    return;\n\n  }\n\n\n  reminders.push({\n\n    id: Date.now(),\n\n    type: type,\n\n    name: name,\n\n    date: date,\n\n    time: time,\n\n    repeat:\n      type === \"medication\"\n        ? repeat\n        : \"once\",\n\n    notes: notes\n\n  });\n\n\n  saveReminders();\n\n  closeReminderModal();\n\n  renderReminders();\n\n  showToast(\n    \"Reminder added successfully.\"\n  );\n\n}\n\n\nfunction renderReminders() {\n\n  const list =\n    document.getElementById(\n      \"reminderList\"\n    );\n\n\n  if (!list) return;\n\n\n  const filtered =\n    reminders.filter(\n      reminder =>\n        reminder.type ===\n        currentReminderTab\n    );\n\n\n  if (!filtered.length) {\n\n    list.innerHTML = `\n\n      <div class=\"empty-state\">\n\n        <div class=\"empty-icon\">\n          ⏰\n        <\/div>\n\n        <p>\n          No reminders added yet.\n        <\/p>\n\n      <\/div>\n\n    `;\n\n    return;\n\n  }\n\n\n  list.innerHTML =\n    filtered.map(\n      reminder => `\n\n        <div\n          class=\"reminder-item\"\n        >\n\n          <div\n            class=\"reminder-item-icon\"\n          >\n            ${\n              reminder.type ===\n              \"medication\"\n                ? \"💊\"\n                : \"📅\"\n            }\n          <\/div>\n\n\n          <div\n            class=\"reminder-item-content\"\n          >\n\n            <strong>\n              ${escapeHtml(\n                reminder.name\n              )}\n            <\/strong>\n\n            <span>\n              ${formatDate(\n                reminder.date\n              )}\n              ·\n              ${formatTime(\n                reminder.time\n              )}\n            <\/span>\n\n            ${\n              reminder.type ===\n              \"medication\"\n                ? `\n                  <small>\n                    ${getRepeatText(\n                      reminder.repeat\n                    )}\n                  <\/small>\n                `\n                : \"\"\n            }\n\n          <\/div>\n\n\n          <button\n            class=\"delete-reminder\"\n            onclick=\"deleteReminder(${reminder.id})\"\n          >\n            ×\n          <\/button>\n\n        <\/div>\n\n      `\n    ).join(\"\");\n\n}\n\n\nfunction deleteReminder(id) {\n\n  reminders =\n    reminders.filter(\n      reminder =>\n        reminder.id !== id\n    );\n\n\n  saveReminders();\n\n  renderReminders();\n\n}\n\n\nfunction switchReminderTab(\n  type\n) {\n\n  currentReminderTab =\n    type;\n\n\n  document\n    .getElementById(\n      \"medicationTab\"\n    )\n    .classList.toggle(\n      \"active\",\n      type === \"medication\"\n    );\n\n\n  document\n    .getElementById(\n      \"appointmentTab\"\n    )\n    .classList.toggle(\n      \"active\",\n      type === \"appointment\"\n    );\n\n\n  renderReminders();\n\n}\n\n\nfunction getRepeatText(\n  repeat\n) {\n\n  const values = {\n\n    once: \"One time\",\n\n    daily: \"Every day\",\n\n    weekly: \"Every week\",\n\n    \"1week\":\n      \"Daily for 1 week\",\n\n    \"2weeks\":\n      \"Daily for 2 weeks\",\n\n    monthly:\n      \"Every month\"\n\n  };\n\n\n  return (\n    values[repeat] ||\n    \"One time\"\n  );\n\n}\n\n\nfunction formatTime(time) {\n\n  if (!time)\n    return \"—\";\n\n\n  const parts =\n    time.split(\":\");\n\n\n  const date =\n    new Date();\n\n\n  date.setHours(\n    Number(parts[0])\n  );\n\n\n  date.setMinutes(\n    Number(parts[1])\n  );\n\n\n  return date.toLocaleTimeString(\n    \"en-IN\",\n    {\n      hour: \"numeric\",\n      minute: \"2-digit\"\n    }\n  );\n\n}\n\n\n/* =========================================================\n   OTHER MENU FUNCTIONS\n========================================================= */\n\nfunction openHealthPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n}\n\n\nfunction openActivityPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n}\n\n\nfunction openSleepPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n}\n\n\nfunction openNutritionPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n}\n\n\nfunction openPeriodTracker() {\n\n  closeMenu();\n\n  showDashboard();\n\n\n  setTimeout(\n    function() {\n\n      const card =\n        document.getElementById(\n          \"menstrualDashboardCard\"\n        );\n\n\n      if (card) {\n\n        card.scrollIntoView({\n          behavior: \"smooth\",\n          block: \"center\"\n        });\n\n      }\n\n    },\n    100\n  );\n\n}\n\n\nfunction openReminderPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n\n  setTimeout(\n    function() {\n\n      const reminder =\n        document.querySelector(\n          \".reminder-card\"\n        );\n\n\n      if (reminder) {\n\n        reminder.scrollIntoView({\n          behavior: \"smooth\",\n          block: \"center\"\n        });\n\n      }\n\n    },\n    100\n  );\n\n}\n\n\nfunction openGoalsPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n\n  setTimeout(\n    function() {\n\n      const goals =\n        document.querySelector(\n          \".goals-card\"\n        );\n\n\n      if (goals) {\n\n        goals.scrollIntoView({\n          behavior: \"smooth\",\n          block: \"center\"\n        });\n\n      }\n\n    },\n    100\n  );\n\n}\n\n\nfunction openRewardsPage() {\n\n  closeMenu();\n\n  showDashboard();\n\n\n  setTimeout(\n    function() {\n\n      const starsCard =\n        document.querySelector(\n          \".stars-card\"\n        );\n\n\n      if (starsCard) {\n\n        starsCard.scrollIntoView({\n          behavior: \"smooth\",\n          block: \"center\"\n        });\n\n      }\n\n    },\n    100\n  );\n\n}\n\n\nfunction openSettingsPage() {\n\n  closeMenu();\n\n  showToast(\n    \"Settings coming soon.\"\n  );\n\n}\n\n\nfunction openPrivacyPage() {\n\n  closeMenu();\n\n  showToast(\n    \"Your prototype data is stored locally on this device.\"\n  );\n\n}\n\n\n/* =========================================================\n   TOAST\n========================================================= */\n\nlet toastTimer;\n\n\nfunction showToast(message) {\n\n  const toast =\n    document.getElementById(\n      \"toast\"\n    );\n\n\n  if (!toast) return;\n\n\n  toast.textContent =\n    message;\n\n\n  toast.classList.add(\n    \"show\"\n  );\n\n\n  clearTimeout(\n    toastTimer\n  );\n\n\n  toastTimer =\n    setTimeout(\n      function() {\n\n        toast.classList.remove(\n          \"show\"\n        );\n\n      },\n      3000\n    );\n\n}\n\n\n/* =========================================================\n   ESCAPE HTML\n========================================================= */\n\nfunction escapeHtml(text) {\n\n  const div =\n    document.createElement(\n      \"div\"\n    );\n\n\n  div.textContent =\n    text;\n\n\n  return div.innerHTML;\n\n}\n\n\n/* =========================================================\n   START APP\n========================================================= */\n\ninitializeApp();\n\n<\/script><script>window.addEventListener(\"load\",function(){var m={openHealthPage:\"mood\",openActivityPage:\"workout\",openSleepPage:\"sleep\",openNutritionPage:\"food\",openPeriodTracker:\"period\"};\nObject.keys(m).forEach(function(k){window[k]=function(){try{closeMenu()}catch(e){}parent.switchTab(m[k])}});\n[\"showDashboard\"].forEach(function(){});});<\/script><script>window.addEventListener(\"load\",function(){var i='<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAABhCAYAAABWFbZsAAAlF0lEQVR42u19fXRd1XXnb+9z7n2f+rIl29jmwxDbgE0gmK9AIVJo0iTkq6RySdpmOm2HTJt2NSFpMzNdU0lJm3S6ks7qajst9GO1TZuuSklWJySUBBIpkBgIBoyxwJgPY4xtZEm2pPd97zlnzx/33ffue5JtIMRyOnkLLeSnp6d7fnefffb+7d/ej/Bj9BARAsYYE30ETADoB/qnBRh0RCT4yeOHBXiIRUbVSV8zPqRFhvhMXQOd+SCPKqLttm7ROUzdfw3M0d5KYUF5Xb01rdfMoO/Kh4ioCgAyOqpoe/T6nwD9SkEeGmIaGXGVqZ0X6NoLH3VB4ec9krXkE2AtoDy4moEFP0+Z3q8YtemvMms2P38mgk1nphULYXiYaOTTLjh87yepdmRYq0ouKJYRhNYRKScQgliIgDNpn3Q+C2PT8zXX+7H8hp/5exkf0jQwYn4C9CndxS22fODOv8lk5n+1PDUFARsRKKLENYvUV0DiRKynoNMd3SiHHbflLvjA/z6
