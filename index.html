lex;\n    align-items: center;\n    gap: 25px;\n}\n\n.score {\n    width: 120px;\n    height: 120px;\n    border-radius: 50%;\n    background: #211930;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: center;\n    color: #b1a2ce;\n}\n\n.score strong {\n    font-size: 38px;\n}\n\n.score span {\n    font-size: 12px;\n}\n\n.explanation {\n    flex: 1;\n    color: #bebbc3;\n    line-height: 1.5;\n}\n\n.metric {\n    margin: 15px 0;\n}\n\n.metric-top {\n    display: flex;\n    justify-content: space-between;\n    margin-bottom: 6px;\n    font-size: 14px;\n}\n\n.bar {\n    height: 9px;\n    background: #2b2530;\n    border-radius: 10px;\n    overflow: hidden;\n}\n\n.fill {\n    height: 100%;\n    background: #a18fbf;\n    border-radius: 10px;\n}\n\n.timeline {\n    display: flex;\n    height: 50px;\n    margin-top: 15px;\n    border-radius: 12px;\n    overflow: hidden;\n}\n\n.stage {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    font-size: 12px;\n}\n\n.deep {\n    width: 22%;\n    background: #c5bbd4;\n    color: #2a2539;\n}\n\n.light {\n    width: 43%;\n    background: #635181;\n}\n\n.rem {\n    width: 25%;\n    background: #423059;\n}\n\n.awake {\n    width: 10%;\n    background: #2a2a2a;\n}\n\n.legend {\n    display: flex;\n    gap: 15px;\n    margin-top: 12px;\n    font-size: 12px;\n    color: #b8b8b8;\n}\n\n.baseline {\n    background: #1a1426;\n    border-radius: 15px;\n    padding: 17px;\n    margin-top: 15px;\n}\n\n.insight {\n    background: #141e28;\n    border-left: 5px solid #7d98bf;\n    padding: 18px;\n    border-radius: 12px;\n    line-height: 1.5;\n}\n\n.warning {\n    background: #362e1c;\n    border-left: 5px solid #d5b782;\n    padding: 18px;\n    border-radius: 12px;\n    margin-top: 15px;\n    line-height: 1.5;\n    display: none;\n}\n\n.reason-grid {\n    display: grid;\n    grid-template-columns: repeat(2,1fr);\n    gap: 10px;\n}\n\n.reason {\n    border: 1px solid #37313f;\n    padding: 14px;\n    border-radius: 12px;\n    cursor: pointer;\n    transition: 0.2s;\n}\n\n.reason:hover {\n    background: #1a1326;\n}\n\n.reason.selected {\n    background: #1f182f;\n    border-color: #a18fbf;\n}\n\n.reason input {\n    margin-right: 8px;\n}\n\nselect {\n    width: 100%;\n    padding: 12px;\n    border-radius: 10px;\n    border: 1px solid #424242;\n    margin: 10px 0 15px;\n}\n\nbutton {\n    border: none;\n    padding: 13px 20px;\n    border-radius: 12px;\n    background: #b1a2ce;\n    color: #2a2539;\n    cursor: pointer;\n    font-size: 15px;\n    margin-top: 15px;\n}\n\nbutton:hover {\n    opacity: 0.9;\n}\n\n.helper-button {\n    width: 100%;\n    font-size: 17px;\n    padding: 16px;\n    background: #b1a2ce;\n}\n\n.helper {\n    display: none;\n    margin-top: 18px;\n    background: #1b1528;\n    border-radius: 18px;\n    padding: 22px;\n    text-align: center;\n}\n\n.breath-circle {\n    width: 110px;\n    height: 110px;\n    margin: 20px auto;\n    border-radius: 50%;\n    background: #473663;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    color: #cbc1da;\n    animation: breathe 8s infinite ease-in-out;\n}\n\n@keyframes breathe {\n    0%,100% {\n        transform: scale(0.8);\n    }\n    50% {\n        transform: scale(1.15);\n    }\n}\n\n.helper-tip {\n    color: #bebbc3;\n    line-height: 1.6;\n}\n\n.energy-buttons {\n    display: flex;\n    gap: 10px;\n}\n\n.energy {\n    flex: 1;\n    border: 1px solid #424242;\n    background: #2a2539;\n    color: #e0e0e0;\n    padding: 12px 5px;\n    border-radius: 12px;\n    cursor: pointer;\n}\n\n.energy:hover {\n    background: #1e172c;\n}\n\n.body-story {\n    display: grid;\n    grid-template-columns: repeat(4,1fr);\n    gap: 10px;\n    margin-top: 15px;\n}\n\n.story-item {\n    text-align: center;\n    padding: 15px 8px;\n    background: #1c1724;\n    border-radius: 13px;\n}\n\n.story-item .emoji {\n    font-size: 25px;\n}\n\n.story-item small {\n    display: block;\n    color: #b8b8b8;\n    margin-top: 5px;\n}\n\n.privacy {\n    text-align: center;\n    font-size: 12px;\n    color: #b8b8b8;\n    padding: 25px;\n}\n\n@media(max-width: 750px) {\n\n    .grid {\n        grid-template-columns: 1fr;\n    }\n\n    .body-story {\n        grid-template-columns: repeat(2,1fr);\n    }\n\n    .score-section {\n        flex-direction: column;\n        text-align: center;\n    }\n\n    .reason-grid {\n        grid-template-columns: 1fr;\n    }\n\n}\n\n<\/style>\n\n<style id=\"trustbeat-logo-theme\">\n:root{\n  --tb-lavender:#806bab;\n  --tb-lavender-dark:#b0a5c4;\n  --tb-coral:#854b44;\n  --tb-coral-dark:#bf645c;\n  --tb-mint:#548e79;\n  --tb-mint-dark:#a5c2b9;\n  --tb-yellow:#98824e;\n  --tb-cream:#2b2416;\n  --tb-ink:#d6d2dc;\n}\nbody{background:var(--tb-cream)!important;color:var(--tb-ink)!important}\nheader,.header,.topbar{background:rgba(45,38,23,.96)!important}\n.logo,.brand{color:var(--tb-lavender-dark)!important}\n.badge,.header-badge{background:#271d35!important;color:var(--tb-lavender-dark)!important}\nbutton,.support-btn,.upload-btn,.analyze-btn,.save-btn{background:var(--tb-lavender)!important}\nbutton:hover,.support-btn:hover,.upload-btn:hover,.analyze-btn:hover,.save-btn:hover{background:var(--tb-lavender-dark)!important}\n.hero{background:linear-gradient(135deg,#2d2617,#21182d)!important;border-color:#362b3f!important}\n.card,.panel{background:rgba(45,38,23,.97)!important;border-color:#352a3b!important}\ninput:focus,select:focus,textarea:focus{border-color:var(--tb-lavender)!important;box-shadow:0 0 0 3px #261c34!important}\n.prediction,.baseline,.helper,.privacy-banner{background:#22192c!important}\n.period-day,.mood.selected,.chip.selected,.reason.selected{background:#31253f!important;border-color:var(--tb-lavender)!important}\n.today{border-color:var(--tb-coral)!important}\n.fill{background:var(--tb-lavender)!important}\n.action{background:linear-gradient(135deg,#271d35,#2a1815)!important}\n.reminder{background:#281915!important}\n.online{background:#1c3227!important;color:#b0cdc3!important}\n.insight{background:#1a2c25!important;border-color:var(--tb-mint-dark)!important}\n.warning{background:#2e2718!important;border-color:var(--tb-yellow)!important}\n.dot{background:var(--tb-coral)!important}\nh1 em{color:var(--tb-coral)!important}\n.privacy .check{background:#22382e!important;color:var(--tb-mint-dark)!important}\n<\/style>\n\n<style id=\"trustbeat-cute-theme\">\n@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');\nh1,h2,h3,.logo,.brand,.hero h1,.dashboard-header h1,.profile-header h1,.feature-page-header h1,.buddy-text h3{\n  font-family:'Baloo 2',sans-serif!important;\n  letter-spacing:-.3px!important;\n}\n.card,.hero,.panel,.dashboard-card-new,.period-card,.buddy-card,.feature-card,.reminder-card,\n.goals-card,.stars-card,.profile-card,.upload-box,.summary,.result-card,.suggestion,.grocery-card,\n.diary-day,.grocery-item,.result-top,.card.calendar-card,.card.history-card,.card.phase-card,\n.card.reminder-card,.card.symptoms-card{\n  border-radius:26px!important;\n}\nbutton:not(.icon-btn):not(.close):not(.modal-close):not(.close-menu):not(.menu-button),\n.btn,.panel-action,.feature-button,.support-btn,.upload-btn,.analyze-btn,.save-btn,.continue-btn,\n.send-btn,.nav-btn,.star-action,.status-link{\n  border-radius:16px!important;\n  box-shadow:0 6px 16px rgba(128,107,171,.28)!important;\n  transition:transform .15s ease,box-shadow .15s ease!important;\n}\nbutton:not(.icon-btn):hover{ transform:translateY(-1px)!important; }\n.mood,.chip,.reason,.symptom,.goal,.option,.height-unit,.period-status-option,.grocery-item{\n  border-radius:18px!important;\n}\n.mood:hover,.chip:hover,.reason:hover{ transform:translateY(-2px)!important; }\n.day,.period-day{ border-radius:14px!important; }\n.metric-icon,.health-icon,.change-icon,.consultant-icon,.buddy-robot,.shield{ border-radius:20px!important; }\n.status-icon,.quick-icon{ filter:drop-shadow(0 3px 6px rgba(128,107,171,.35)); }\n::selection{ background:rgba(128,107,171,.25); }\n<\/style>\n\n<style id=\"trustbeat-cute-score-ring\">\n.score{\n  background:radial-gradient(circle at 32% 28%, #2b2b2b, #231931 55%, #3e2d57 100%)!important;\n  box-shadow:0 0 0 8px #1e152a, 0 10px 24px rgba(104,70,168,.28)!important;\n}\n<\/style>\n\n<style id=\"trustbeat-cute-bg-v2\">\nhtml,body{\n  background:\n    radial-gradient(circle at 10% 0%, #2d2141 0%, transparent 45%),\n    radial-gradient(circle at 90% 10%, #351b22 0%, transparent 40%),\n    radial-gradient(circle at 50% 100%, #274c3b 0%, transparent 45%),\n    linear-gradient(180deg, #1b1428 0%, #27141c 100%) !important;\n  background-attachment: fixed !important;\n}\n.container,.wrap,.app,main,.dashboard,.profile-panel,.feature-page,#dashboard main{\n  background: transparent !important;\n}\n.card,.hero,.panel,.dashboard-card-new,.period-card,.buddy-card,.feature-card,.reminder-card,\n.goals-card,.stars-card,.profile-card,.upload-box,.summary,.result-card,.suggestion,.grocery-card,\n.diary-day,.result-top,.quick-card,.status-card,.panel-heading,.home-reminder,.diet-day{\n  background: #2b2b2bcc !important;\n  backdrop-filter: blur(6px) !important;\n}\n<\/style>\n\n<style id=\"trustbeat-graphs-modals-v3\">\n/* ---- charts / progress / bars ---- */\n.chart svg polyline{ filter: drop-shadow(0 4px 8px rgba(131,105,201,.35)) !important; }\n.chart svg circle{ filter: drop-shadow(0 2px 4px rgba(131,105,201,.4)) !important; }\n.bar,.progress{\n  border-radius:20px !important;\n  height:11px !important;\n  background:#261c32 !important;\n  box-shadow:inset 0 1px 2px rgba(90,60,120,.12) !important;\n}\n.fill,.progress-bar,.progress i{\n  border-radius:20px !important;\n  background:linear-gradient(90deg,#523c74,#a18fbf) !important;\n  box-shadow:0 0 10px rgba(128,97,181,.55) !important;\n}\n.timeline{\n  border-radius:20px !important;\n  box-shadow: inset 0 0 0 2px rgba(43,43,43,.65), 0 8px 20px rgba(90,60,120,.15) !important;\n}\n.deep{ background:linear-gradient(135deg,#b2a5ca,#cac0db) !important; }\n.light{ background:linear-gradient(135deg,#5a4577,#7a619e) !important; }\n.rem{ background:linear-gradient(135deg,#352242,#49315f) !important; }\n.awake{ background:linear-gradient(135deg,#221728,#32263b) !important; }\n.calendar .day.recorded,.day.period-day{\n  background:linear-gradient(135deg,#7b3f53,#c05d71) !important;\n  box-shadow:0 4px 10px rgba(192,93,113,.4) !important;\n}\n.day.predicted{\n  background:linear-gradient(135deg,#281519,#341b20) !important;\n  box-shadow:inset 0 0 0 1.5px #834555 !important;\n}\n.score{\n  box-shadow:0 0 0 8px #1e152a, 0 14px 28px rgba(104,70,168,.32) !important;\n}\n\n/* ---- modals / popups ---- */\n.modal-backdrop,.modal-overlay{\n  background:rgba(60,40,90,.38) !important;\n  backdrop-filter: blur(7px) !important;\n}\n.modal{\n  border-radius:28px !important;\n  border:1px solid rgba(43,43,43,.7) !important;\n  box-shadow:0 35px 80px rgba(90,60,120,.38) !important;\n}\n.modal h2, .modal-header h2, #modalTitle, #reminderModalTitle{\n  font-family:'Baloo 2',sans-serif !important;\n  color:#b1a2ce !important;\n}\n.modal-close,.close,.close-menu{\n  border-radius:50% !important;\n  background:#21182f !important;\n  color:#b1a2ce !important;\n  box-shadow:0 4px 10px rgba(128,107,171,.35) !important;\n}\n.modal input,.modal select,.modal textarea,\n.field input,.field select,.form-control{\n  border-radius:13px !important;\n}\n.modal .choice,.choice{\n  border-radius:16px !important;\n}\n.modal .choice.active,.choice.active{\n  box-shadow:0 4px 10px rgba(128,107,171,.35) !important;\n}\n<\/style>\n\n<style id=\"trustbeat-sleep-neat-layout\">\n/* ===== Clean, consistent Sleep tab layout ===== */\nhtml, body {\n    margin: 0;\n    padding: 0;\n}\n\nbody {\n    overflow-x: hidden;\n}\n\nheader {\n    min-height: 72px;\n    padding: 16px clamp(20px, 5vw, 72px);\n}\n\n.container {\n    width: min(1120px, calc(100% - 40px));\n    max-width: 1120px;\n    margin: 28px auto 0;\n    padding: 0;\n}\n\n.hero {\n    margin-bottom: 20px;\n    padding: 28px 30px;\n}\n\n.hero h1 {\n    margin: 0 0 8px;\n    line-height: 1.15;\n}\n\n.grid {\n    display: grid;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 20px;\n    align-items: stretch;\n}\n\n.card {\n    width: 100%;\n    min-width: 0;\n    padding: 24px;\n    display: flex;\n    flex-direction: column;\n    justify-content: flex-start;\n}\n\n.card h2 {\n    margin: 0 0 16px;\n    line-height: 1.25;\n}\n\n.card > p {\n    line-height: 1.55;\n}\n\n/* Keep the main cards visually balanced. */\n.score-section {\n    min-height: 126px;\n    align-items: center;\n}\n\n.explanation {\n    min-width: 0;\n}\n\n.metric {\n    width: 100%;\n    margin: 14px 0 0;\n}\n\n.metric-top {\n    gap: 16px;\n    align-items: center;\n    line-height: 1.35;\n}\n\n.metric-top span {\n    min-width: 0;\n}\n\n.metric-top strong {\n    white-space: nowrap;\n}\n\n.baseline,\n.insight,\n.warning {\n    width: 100%;\n}\n\n.timeline {\n    width: 100%;\n    margin-top: 16px;\n}\n\n.legend {\n    width: 100%;\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 8px;\n    align-items: center;\n}\n\n.legend span {\n    white-space: nowrap;\n}\n\n.reason-grid {\n    width: 100%;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 10px;\n}\n\n.reason {\n    min-height: 50px;\n    display: flex;\n    align-items: center;\n    line-height: 1.35;\n}\n\n.reason input {\n    flex: 0 0 auto;\n}\n\n.card > button:not(.energy):not(.helper-button) {\n    align-self: flex-start;\n}\n\n.energy-buttons {\n    width: 100%;\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 10px;\n}\n\n.energy {\n    width: 100%;\n    min-height: 66px;\n    margin: 0;\n}\n\n.sleep-card {\n    width: 100%;\n}\n\n/* Make the longer interactive sections use the full content width,\n   rather than creating an uneven-looking half-width card. */\n.grid > .card:nth-child(5),\n.grid > .card:nth-child(7) {\n    grid-column: 1 / -1;\n}\n\n.helper-button {\n    margin-top: 18px;\n}\n\n.sleep-helper {\n    width: 100%;\n}\n\n.sleep-controls {\n    align-items: center;\n}\n\n.sleep-tip {\n    width: min(680px, 100%);\n    margin-left: auto;\n    margin-right: auto;\n}\n\n.privacy {\n    width: min(1120px, calc(100% - 40px));\n    margin: 0 auto;\n}\n\n/* Consistent focus/hover behaviour without shifting the layout. */\n.reason,\n.energy,\nbutton {\n    transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;\n}\n\n.reason:hover,\n.energy:hover {\n    transform: none;\n}\n\n/* Tablet */\n@media (max-width: 820px) {\n    .container {\n        width: min(100% - 28px, 720px);\n        margin-top: 20px;\n    }\n\n    .grid {\n        grid-template-columns: 1fr;\n        gap: 16px;\n    }\n\n    .grid > .card:nth-child(5),\n    .grid > .card:nth-child(7) {\n        grid-column: auto;\n    }\n\n    .energy-buttons {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n    }\n\n    .legend {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n    }\n}\n\n/* Mobile */\n@media (max-width: 520px) {\n    header {\n        padding: 14px 18px;\n    }\n\n    .logo {\n        font-size: 21px;\n    }\n\n    .badge {\n        font-size: 11px;\n        padding: 7px 10px;\n    }\n\n    .container {\n        width: calc(100% - 24px);\n        margin-top: 14px;\n    }\n\n    .hero,\n    .card {\n        padding: 20px;\n        border-radius: 20px;\n    }\n\n    .hero h1 {\n        font-size: 27px;\n    }\n\n    .score-section {\n        min-height: 0;\n        gap: 16px;\n    }\n\n    .score {\n        width: 108px;\n        height: 108px;\n        flex: 0 0 108px;\n    }\n\n    .score strong {\n        font-size: 34px;\n    }\n\n    .reason-grid,\n    .energy-buttons {\n        grid-template-columns: 1fr;\n    }\n\n    .legend {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .timeline {\n        height: 44px;\n    }\n\n    .stage {\n        font-size: 10px;\n    }\n\n    .sleep-helper {\n        padding: 24px 14px;\n    }\n}\n<\/style>\n\n<style id=\"tb-dark\">:root{color-scheme:dark}html,body{background-color:#17141f}::selection{background:#c9b6f2;color:#17141f}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3450;border-radius:9px}input,select,textarea{color-scheme:dark}<\/style><\/head>\n\n\n<body>\n\n<header>\n\n    <div class=\"logo\">💜 TrustBeat<\/div>\n\n    <div class=\"badge\">\n        Smart Health Companion\n    <\/div>\n\n<\/header>\n\n\n<div class=\"container\">\n\n\n<!-- HERO -->\n\n<section class=\"hero\">\n\n    <h1>🌙 Understand Your Sleep<\/h1>\n\n    <p>\n        TrustBeat turns your sleep data into simple insights\n        about what changed, what may have affected your sleep,\n        and how you feel today.\n    <\/p>\n\n<\/section>\n\n\n\n<div class=\"grid\">\n\n\n<!-- SLEEP SCORE -->\n\n<div class=\"card\">\n\n    <h2>🌙 Last Night<\/h2>\n\n    <div class=\"score-section\">\n\n        <div class=\"score\">\n\n            <strong>78<\/strong>\n\n            <span>Sleep Score<\/span>\n\n        <\/div>\n\n\n        <div class=\"explanation\">\n\n            <strong>Your sleep was okay.<\/strong>\n\n            <p>\n                Your sleep duration was close to your usual pattern,\n                but you had more interruptions than normal.\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"metric\">\n\n        <div class=\"metric-top\">\n            <span>Sleep duration<\/span>\n            <strong>7h 12m<\/strong>\n        <\/div>\n\n        <div class=\"bar\">\n            <div class=\"fill\" style=\"width:82%\"><\/div>\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"metric\">\n\n        <div class=\"metric-top\">\n            <span>Sleep consistency<\/span>\n            <strong>72%<\/strong>\n        <\/div>\n\n        <div class=\"bar\">\n            <div class=\"fill\" style=\"width:72%\"><\/div>\n        <\/div>\n\n    <\/div>\n\n\n<\/div>\n\n\n\n<!-- PERSONAL BASELINE -->\n\n<div class=\"card\">\n\n    <h2>📊 Your Personal Baseline<\/h2>\n\n    <div class=\"baseline\">\n\n        <strong>You're comparing against YOUR normal.<\/strong>\n\n        <p style=\"margin-top:8px;color:#b8b5bd\">\n\n            Average sleep: <strong>7h 48m<\/strong><br>\n\n            Last night: <strong>7h 12m<\/strong><br>\n\n            Difference: <strong>36 minutes less<\/strong>\n\n        <\/p>\n\n    <\/div>\n\n\n    <div class=\"insight\" style=\"margin-top:15px\">\n\n        💡 <strong>What changed?<\/strong>\n\n        <p>\n            Your bedtime was around 45 minutes later than\n            your usual bedtime and you had more awakenings.\n        <\/p>\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- SLEEP STAGES -->\n\n<div class=\"card\">\n\n    <h2>🧠 Your Night in One View<\/h2>\n\n    <p style=\"color:#b8b8b8\">\n        Your estimated sleep stages:\n    <\/p>\n\n\n    <div class=\"timeline\">\n\n        <div class=\"stage deep\">\n            Deep\n        <\/div>\n\n        <div class=\"stage light\">\n            Light\n        <\/div>\n\n        <div class=\"stage rem\">\n            REM\n        <\/div>\n\n        <div class=\"stage awake\">\n            Awake\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"legend\">\n\n        <span>● Deep<\/span>\n        <span>● Light<\/span>\n        <span>● REM<\/span>\n        <span>● Awake<\/span>\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- 7 DAY SUMMARY -->\n\n<div class=\"card\">\n\n    <h2>📈 7-Day Sleep Summary<\/h2>\n\n    <div class=\"metric\">\n\n        <div class=\"metric-top\">\n            <span>Average sleep<\/span>\n            <strong>7h 34m<\/strong>\n        <\/div>\n\n        <div class=\"bar\">\n            <div class=\"fill\" style=\"width:78%\"><\/div>\n        <\/div>\n\n    <\/div>\n\n    <div class=\"metric\">\n\n        <div class=\"metric-top\">\n            <span>Bedtime consistency<\/span>\n            <strong>68%<\/strong>\n        <\/div>\n\n        <div class=\"bar\">\n            <div class=\"fill\" style=\"width:68%\"><\/div>\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- REASONS FOR DISTURBED SLEEP -->\n\n<div class=\"card\">\n\n    <h2>🔎 What disturbed your sleep?<\/h2>\n\n    <p style=\"color:#b8b8b8;margin-bottom:15px\">\n\n        Select anything that may have affected your sleep.\n        You can select more than one.\n\n    <\/p>\n\n\n    <div class=\"reason-grid\">\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"screen\">\n            📱 Screen time\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"stress\">\n            😰 Stress\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"illness\">\n            🤒 Illness\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"caffeine\">\n            ☕\n\n            Caffeine\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"meal\">\n            🍔 Late meal\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"noise\">\n            🔊 Noise\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"environment\">\n            🌡️ Room temperature\n\n        <\/label>\n\n\n        <label class=\"reason\">\n\n            <input type=\"checkbox\" value=\"other\">\n            ✏️ Other\n\n        <\/label>\n\n    <\/div>\n\n\n    <button onclick=\"analyzeReasons()\">\n        Analyze My Sleep\n    <\/button>\n\n\n    <div class=\"warning\" id=\"reasonResult\"><\/div>\n\n<\/div>\n\n\n\n<!-- MORNING CHECK -->\n\n<div class=\"card\">\n\n    <h2>☀️ Morning Check-In<\/h2>\n\n    <p style=\"color:#b8b8b8;margin-bottom:15px\">\n\n        How do you feel after waking up?\n\n    <\/p>\n\n\n    <div class=\"energy-buttons\">\n\n        <button class=\"energy\" onclick=\"energy('Great')\">\n            😄<br>Great\n        <\/button>\n\n        <button class=\"energy\" onclick=\"energy('Okay')\">\n            🙂<br>Okay\n        <\/button>\n\n        <button class=\"energy\" onclick=\"energy('Tired')\">\n            😐<br>Tired\n        <\/button>\n\n        <button class=\"energy\" onclick=\"energy('Exhausted')\">\n            😵<br>Exhausted\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"insight\" id=\"energyResult\"\n         style=\"margin-top:15px;display:none\">\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- ================= SLEEP HELPER ================= -->\n\n<div class=\"card sleep-card\">\n\n    <h2>🌙 Can't Fall Asleep?<\/h2>\n\n    <p style=\"color:#b8b8b8; line-height:1.6;\">\n        Let TrustBeat guide you through a calm breathing\n        session with gentle ambient sounds.\n    <\/p>\n\n    <button class=\"helper-button\" onclick=\"openSleepHelper()\">\n        🌙 Help Me Sleep\n    <\/button>\n\n    <div class=\"sleep-helper\" id=\"sleepHelper\">\n\n        <h2>🌌 Sleep Sanctuary<\/h2>\n\n        <p class=\"sleep-subtitle\">\n            Get comfortable. Put your phone down when you're ready.\n        <\/p>\n\n        <!-- Breathing circle -->\n\n        <div class=\"breathing-area\">\n\n            <div class=\"breathing-circle\" id=\"breathingCircle\">\n\n                <span id=\"breathText\">\n                    Ready\n                <\/span>\n\n            <\/div>\n\n        <\/div>\n\n\n        <!-- Timer -->\n\n        <div class=\"sleep-timer\" id=\"sleepTimer\">\n            05:00\n        <\/div>\n\n\n        <p class=\"breathing-instruction\" id=\"breathingInstruction\">\n            When you're ready, begin slowly.\n        <\/p>\n\n\n        <!-- Controls -->\n\n        <div class=\"sleep-controls\">\n\n            <button onclick=\"startSleepSession()\">\n                ▶ Start\n            <\/button>\n\n            <button onclick=\"toggleSound()\" id=\"soundButton\">\n                🔊 Sound On\n            <\/button>\n\n            <button onclick=\"stopSleepSession()\">\n                ✕ End\n            <\/button>\n\n        <\/div>\n\n\n        <div class=\"sleep-tip\">\n\n            💜 <strong>Tonight's reminder<\/strong>\n\n            <p>\n                You don't need to force yourself to sleep.\n                Let your breathing become slow and comfortable\n                and allow yourself to rest.\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<style>\n\n/* ================= SLEEP HELPER UI ================= */\n\n.sleep-card {\n    background:\n        linear-gradient(\n            145deg,\n            #2b2b2b,\n            #1b1427\n        );\n}\n\n.helper-button {\n    width: 100%;\n    margin-top: 18px;\n    padding: 17px;\n    border-radius: 15px;\n    border: none;\n    background: #b1a2ce;\n    color: #2a2539;\n    font-size: 17px;\n    cursor: pointer;\n}\n\n.helper-button:hover {\n    opacity: 0.9;\n}\n\n\n.sleep-helper {\n\n    display: none;\n\n    margin-top: 20px;\n\n    padding: 30px 20px;\n\n    border-radius: 22px;\n\n    text-align: center;\n\n    background:\n        radial-gradient(\n            circle at center,\n            #211930,\n            #2c2141,\n            #392c50\n        );\n\n    overflow: hidden;\n}\n\n\n.sleep-helper h2 {\n    color: #cbc1da;\n    margin-bottom: 8px;\n}\n\n\n.sleep-subtitle {\n    color: #bab6bf;\n    font-size: 14px;\n}\n\n\n/* ================= BREATHING ================= */\n\n.breathing-area {\n\n    height: 220px;\n\n    display: flex;\n\n    justify-content: center;\n\n    align-items: center;\n\n}\n\n\n.breathing-circle {\n\n    width: 125px;\n\n    height: 125px;\n\n    border-radius: 50%;\n\n    background:\n        radial-gradient(\n            circle,\n            #2b2b2b,\n            #402e59\n        );\n\n    box-shadow:\n        0 0 35px rgba(104,70,168,0.25);\n\n    display: flex;\n\n    justify-content: center;\n\n    align-items: center;\n\n    color: #c8bdd4;\n\n    font-weight: bold;\n\n    transition:\n        transform 4s ease-in-out,\n        box-shadow 4s ease-in-out;\n\n}\n\n\n.breathing-circle.inhale {\n\n    transform: scale(1.45);\n\n    box-shadow:\n        0 0 70px rgba(104,70,168,0.4);\n\n}\n\n\n.breathing-circle.exhale {\n\n    transform: scale(0.85);\n\n    box-shadow:\n        0 0 25px rgba(104,70,168,0.2);\n\n}\n\n\n/* ================= TIMER ================= */\n\n.sleep-timer {\n\n    font-size: 32px;\n\n    font-weight: bold;\n\n    color: #cbc1da;\n\n    margin-top: 5px;\n\n}\n\n\n.breathing-instruction {\n\n    margin-top: 10px;\n\n    color: #c1bcc8;\n\n    min-height: 22px;\n\n}\n\n\n/* ================= BUTTONS ================= */\n\n.sleep-controls {\n\n    display: flex;\n\n    justify-content: center;\n\n    gap: 10px;\n\n    flex-wrap: wrap;\n\n    margin-top: 20px;\n\n}\n\n\n.sleep-controls button {\n\n    margin-top: 0;\n\n    border: none;\n\n    padding: 11px 16px;\n\n    border-radius: 11px;\n\n    background: #b1a2ce;\n\n    color: #2a2539;\n\n    cursor: pointer;\n\n}\n\n\n.sleep-controls button:hover {\n\n    opacity: 0.9;\n\n}\n\n\n/* ================= TIP ================= */\n\n.sleep-tip {\n\n    margin-top: 25px;\n\n    padding: 15px;\n\n    border-radius: 14px;\n\n    background: rgba(43,43,43,0.65);\n\n    color: #c1bcc8;\n\n    line-height: 1.5;\n\n    font-size: 13px;\n\n}\n\n<\/style>\n\n\n<script>\n\n/* ==================================================\n   TRUSTBEAT SLEEP HELPER\n   ================================================== */\n\n\n/* ---------- VARIABLES ---------- */\n\nlet sleepTimerInterval = null;\n\nlet sleepBreathingInterval = null;\n\nlet sleepSeconds = 300;\n\nlet soundEnabled = true;\n\nlet audioContext = null;\n\nlet masterGain = null;\n\nlet oscillators = [];\n\n\n/* ---------- OPEN HELPER ---------- */\n\nfunction openSleepHelper() {\n\n    const helper =\n        document.getElementById(\"sleepHelper\");\n\n    helper.style.display = \"block\";\n\n}\n\n\n/* ---------- START SESSION ---------- */\n\nfunction startSleepSession() {\n\n    stopSleepSession();\n\n    sleepSeconds = 300;\n\n    updateSleepTimer();\n\n    startBreathing();\n\n    if (soundEnabled) {\n\n        startCalmingSound();\n\n    }\n\n    sleepTimerInterval =\n        setInterval(() => {\n\n            sleepSeconds--;\n\n            updateSleepTimer();\n\n            if (sleepSeconds <= 0) {\n\n                finishSleepSession();\n\n            }\n\n        }, 1000);\n\n}\n\n\n/* ---------- TIMER ---------- */\n\nfunction updateSleepTimer() {\n\n    const minutes =\n        Math.floor(sleepSeconds / 60);\n\n    const seconds =\n        sleepSeconds % 60;\n\n    document.getElementById(\"sleepTimer\")\n        .innerText =\n        String(minutes).padStart(2,\"0\")\n        + \":\" +\n        String(seconds).padStart(2,\"0\");\n\n}\n\n\n/* ---------- BREATHING ---------- */\n\nfunction startBreathing() {\n\n    const circle =\n        document.getElementById(\n            \"breathingCircle\"\n        );\n\n    const text =\n        document.getElementById(\n            \"breathText\"\n        );\n\n    const instruction =\n        document.getElementById(\n            \"breathingInstruction\"\n        );\n\n\n    let phase = 0;\n\n\n    function breathe() {\n\n        if (phase % 2 === 0) {\n\n            circle.classList.remove(\"exhale\");\n\n            circle.classList.add(\"inhale\");\n\n            text.innerText =\n                \"Breathe in\";\n\n            instruction.innerText =\n                \"Slowly breathe in...\";\n\n        }\n\n        else {\n\n            circle.classList.remove(\"inhale\");\n\n            circle.classList.add(\"exhale\");\n\n            text.innerText =\n                \"Breathe out\";\n\n            instruction.innerText =\n                \"Slowly breathe out...\";\n\n        }\n\n        phase++;\n\n    }\n\n\n    breathe();\n\n    sleepBreathingInterval =\n        setInterval(breathe, 4000);\n\n}\n\n\n/* ---------- CALMING SOUND ---------- */\n\n/*\n   Creates a very soft ambient sound using\n   the browser's Web Audio API.\n\n   No external audio file is required.\n*/\n\nfunction startCalmingSound() {\n\n    try {\n\n        audioContext =\n            new (\n                window.AudioContext ||\n                window.webkitAudioContext\n            )();\n\n\n        masterGain =\n            audioContext.createGain();\n\n        masterGain.gain.value = 0.035;\n\n        masterGain.connect(\n            audioContext.destination\n        );\n\n\n        const frequencies = [\n            174,\n            220,\n            261.63\n        ];\n\n\n        frequencies.forEach(\n            frequency => {\n\n                const oscillator =\n                    audioContext.createOscillator();\n\n                const gain =\n                    audioContext.createGain();\n\n\n                oscillator.type =\n                    \"sine\";\n\n                oscillator.frequency.value =\n                    frequency;\n\n\n                gain.gain.value =\n                    0.15;\n\n\n                oscillator.connect(gain);\n\n                gain.connect(masterGain);\n\n                oscillator.start();\n\n\n                oscillators.push(\n                    oscillator\n                );\n\n            }\n        );\n\n    }\n\n    catch(error) {\n\n        console.log(\n            \"Audio could not start.\"\n        );\n\n    }\n\n}\n\n\n/* ---------- SOUND TOGGLE ---------- */\n\nfunction toggleSound() {\n\n    soundEnabled =\n        !soundEnabled;\n\n\n    const button =\n        document.getElementById(\n            \"soundButton\"\n        );\n\n\n    if (soundEnabled) {\n\n        button.innerText =\n            \"🔊 Sound On\";\n\n\n        if (!audioContext) {\n\n            startCalmingSound();\n\n        }\n\n        else if (masterGain) {\n\n            masterGain.gain.value =\n                0.035;\n\n        }\n\n    }\n\n    else {\n\n        button.innerText =\n            \"🔇 Sound Off\";\n\n\n        if (masterGain) {\n\n            masterGain.gain.value =\n                0;\n\n        }\n\n    }\n\n}\n\n\n/* ---------- STOP SESSION ---------- */\n\nfunction stopSleepSession() {\n\n    clearInterval(\n        sleepTimerInterval\n    );\n\n    clearInterval(\n        sleepBreathingInterval\n    );\n\n\n    sleepTimerInterval = null;\n\n    sleepBreathingInterval = null;\n\n\n    stopCalmingSound();\n\n\n    const circle =\n        document.getElementById(\n            \"breathingCircle\"\n        );\n\n    circle.classList.remove(\n        \"inhale\",\n        \"exhale\"\n    );\n\n\n    document.getElementById(\n        \"breathText\"\n    ).innerText =\n        \"Ready\";\n\n\n    document.getElementById(\n        \"breathingInstruction\"\n    ).innerText =\n        \"When you're ready, begin slowly.\";\n\n}\n\n\n/* ---------- STOP AUDIO ---------- */\n\nfunction stopCalmingSound() {\n\n    oscillators.forEach(\n        oscillator => {\n\n            try {\n\n                oscillator.stop();\n\n            }\n\n            catch(error) {}\n\n        }\n    );\n\n\n    oscillators = [];\n\n\n    if (audioContext) {\n\n        try {\n\n            audioContext.close();\n\n        }\n\n        catch(error) {}\n\n        audioContext = null;\n\n    }\n\n}\n\n\n/* ---------- FINISH ---------- */\n\nfunction finishSleepSession() {\n\n    clearInterval(\n        sleepTimerInterval\n    );\n\n    clearInterval(\n        sleepBreathingInterval\n    );\n\n\n    stopCalmingSound();\n\n\n    document.getElementById(\n        \"sleepTimer\"\n    ).innerText =\n        \"Rest complete 🌙\";\n\n\n    document.getElementById(\n        \"breathText\"\n    ).innerText =\n        \"Good night\";\n\n\n    document.getElementById(\n        \"breathingInstruction\"\n    ).innerText =\n        \"You can put your phone down and rest now.\";\n\n}\n\n<\/script>\n\n\n<div class=\"privacy\">\n\n    🔒 Your health information is private in this demo.\n    TrustBeat is designed to help you understand your data,\n    not diagnose medical conditions.\n\n<\/div>\n\n\n<\/div>\n\n\n\n<script>\n\n/* REASON ANALYSIS */\n\nfunction analyzeReasons() {\n\n    const checked =\n        document.querySelectorAll(\n            '.reason input:checked'\n        );\n\n    const result =\n        document.getElementById(\"reasonResult\");\n\n    if (checked.length === 0) {\n\n        result.style.display = \"block\";\n\n        result.innerHTML =\n            \"💡 No possible reasons selected. \" +\n            \"You can add factors to help TrustBeat identify patterns.\";\n\n        return;\n    }\n\n    let reasons = [];\n\n    checked.forEach(item => {\n\n        if(item.value === \"screen\")\n            reasons.push(\"screen use\");\n\n        if(item.value === \"stress\")\n            reasons.push(\"stress\");\n\n        if(item.value === \"illness\")\n            reasons.push(\"feeling unwell\");\n\n        if(item.value === \"caffeine\")\n            reasons.push(\"caffeine\");\n\n        if(item.value === \"meal\")\n            reasons.push(\"a late meal\");\n\n        if(item.value === \"noise\")\n            reasons.push(\"noise\");\n\n        if(item.value === \"environment\")\n            reasons.push(\"room environment\");\n\n        if(item.value === \"other\")\n            reasons.push(\"another factor\");\n\n    });\n\n\n    result.style.display = \"block\";\n\n    result.innerHTML =\n\n        \"🔎 <strong>Possible factors you recorded:<\/strong><br>\" +\n\n        reasons.join(\", \") +\n\n        \"<br><br>\" +\n\n        \"TrustBeat will compare these factors with your \" +\n        \"sleep patterns over time. This shows associations, \" +\n        \"not proof that a factor caused the disturbance.\";\n\n}\n\n\n\n/* MORNING ENERGY */\n\nfunction energy(level) {\n\n    const result =\n        document.getElementById(\"energyResult\");\n\n    result.style.display = \"block\";\n\n\n    if(level === \"Great\") {\n\n        result.innerHTML =\n            \"😄 You woke up feeling great. \" +\n            \"TrustBeat will use this check-in alongside \" +\n            \"your sleep data to understand your patterns.\";\n\n    }\n\n\n    if(level === \"Okay\") {\n\n        result.innerHTML =\n            \"🙂 Your energy feels okay today. \" +\n            \"Keep tracking to see which sleep patterns \" +\n            \"match your better mornings.\";\n\n    }\n\n\n    if(level === \"Tired\") {\n\n        result.innerHTML =\n            \"😐 You slept 7h 12m but still feel tired. \" +\n            \"That difference is useful data — TrustBeat \" +\n            \"will compare your subjective energy with your \" +\n            \"sleep patterns.\";\n\n    }\n\n\n    if(level === \"Exhausted\") {\n\n        result.innerHTML =\n            \"😵 You feel exhausted today. \" +\n            \"Consider prioritizing rest. If this happens \" +\n            \"frequently or concerns you, consider discussing \" +\n            \"it with a healthcare professional.\";\n\n    }\n\n}\n\n\n\n/* SLEEP HELPER */\n\nlet helperInterval;\n\nlet seconds = 240;\n\n\nfunction openHelper() {\n\n    document.getElementById(\n        \"sleepHelper\"\n    ).style.display = \"block\";\n\n\n    seconds = 240;\n\n\n    helperInterval =\n        setInterval(updateTimer, 1000);\n\n}\n\n\nfunction updateTimer() {\n\n    if(seconds <= 0) {\n\n        clearInterval(helperInterval);\n\n        document.getElementById(\n            \"timer\"\n        ).innerText = \"Done 🌙\";\n\n        return;\n\n    }\n\n\n    seconds--;\n\n\n    const minutes =\n        Math.floor(seconds / 60);\n\n    const secs =\n        seconds % 60;\n\n\n    document.getElementById(\n        \"timer\"\n    ).innerText =\n\n        minutes + \" : \" +\n\n        String(secs).padStart(2,\"0\");\n\n\n    const breath =\n        document.getElementById(\n            \"breathText\"\n        );\n\n\n    const cycle =\n        seconds % 8;\n\n\n    if(cycle >= 4) {\n\n        breath.innerText =\n            \"Breathe in\";\n\n    }\n\n    else {\n\n        breath.innerText =\n            \"Breathe out\";\n\n    }\n\n}\n\n\nfunction stopHelper() {\n\n    clearInterval(helperInterval);\n\n    document.getElementById(\n        \"sleepHelper\"\n    ).style.display = \"none\";\n\n}\n\n\n<\/script>\n\n\n<script>(function(){function P(){try{return JSON.parse(localStorage.getItem(\"trustbeat_user_data\")||\"null\")}catch(e){return null}}\nwindow.__tbName=function(){var p=P();return p&&p.name?p.name:\"\"};\ndocument.addEventListener(\"DOMContentLoaded\",function(){var n=window.__tbName();if(!n)return;var h=document.querySelector(\"h1\");if(!h||document.getElementById(\"tbHi\"))return;\nvar s=document.createElement(\"div\");s.id=\"tbHi\";s.textContent=\"Hi, \"+n+\" 💜\";s.style.cssText=\"display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:99px;background:#251a33;color:#b1a2ce;font:700 13px Arial,sans-serif\";h.parentNode.insertBefore(s,h);});})();<\/script><script>(function(){var RX=/\\b(suicid\\w*|kill(?:ing)? myself|end(?:ing)? my (?:own )?life|take my own life|want(?:ed)? to die|wanna die|don['\\u2019]?t want to (?:live|be here)|self[- ]?harm\\w*|hurt(?:ing)? myself|cut(?:ting)? myself|hopeless\\w*|no reason to live|better off dead|end it all)\\b/i;\nfunction reg(){var z=\"\";try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||\"\"}catch(e){}var l=(navigator.language||\"\").toLowerCase();if(/Kolkata|Calcutta/.test(z)||/-in$/.test(l))return\"IN\";if(/^Australia\\//.test(z))return\"AU\";if(/^Europe\\/London/.test(z)||l===\"en-gb\")return\"UK\";if(/^America\\//.test(z)||/-(us|ca)$/.test(l))return\"US\";return\"ANY\"}\nvar H={IN:[\"Tele-MANAS (India, 24/7, free)\",\"14416\",\"14416\",\"Also 1-800-891-4416\ le>\n*{\n  box-sizing:border-box;\n  margin:0;\n  padding:0;\n}\n\nbody{\n  font-family:Inter,Segoe UI,Arial,sans-serif;\n  background:\n    radial-gradient(circle at 10% 5%,#1e182e 0,transparent 28%),\n    radial-gradient(circle at 90% 10%,#2d1722 0,transparent 28%),\n    #181524;\n  color:#dedde6;\n}\n\n.container{\n  width:min(1100px,92%);\n  margin:auto;\n  padding:32px 0 70px;\n}\n\n.header{\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  margin-bottom:24px;\n}\n\n.logo{\n  font-size:26px;\n  font-weight:800;\n  color:#8b73ce;\n}\n\n.header-badge{\n  padding:8px 14px;\n  background:#1d172d;\n  color:#9b8cce;\n  border-radius:30px;\n  font-size:12px;\n  font-weight:700;\n}\n\n.hero{\n  padding:32px;\n  border-radius:30px;\n  background:linear-gradient(135deg,#2b2b2b,#1b1529);\n  border:1px solid #2b223b;\n  box-shadow:0 15px 40px rgba(75,55,120,.07);\n  margin-bottom:20px;\n}\n\n.hero h1{\n  font-size:35px;\n  margin-bottom:9px;\n}\n\n.hero p{\n  color:#b8b5bd;\n  line-height:1.6;\n  max-width:760px;\n}\n\n.card{\n  background:rgba(43,43,43,.94);\n  border:1px solid #302939;\n  border-radius:25px;\n  padding:25px;\n  margin-bottom:20px;\n  box-shadow:0 10px 30px rgba(70,50,100,.055);\n}\n\n.card h2{\n  font-size:19px;\n  margin-bottom:6px;\n}\n\n.subtitle{\n  color:#ada9b4;\n  font-size:13px;\n  margin-bottom:19px;\n  line-height:1.5;\n}\n\n/* MOODS */\n\n.moods{\n  display:grid;\n  grid-template-columns:repeat(5,1fr);\n  gap:12px;\n}\n\n.mood{\n  border:2px solid #262031;\n  background:#1b1629;\n  border-radius:20px;\n  padding:17px 8px;\n  text-align:center;\n  cursor:pointer;\n  transition:.2s;\n}\n\n.mood:hover{\n  transform:translateY(-3px);\n  border-color:#54427f;\n}\n\n.mood.selected{\n  border-color:#846ac9;\n  background:#1d172c;\n  box-shadow:0 7px 20px rgba(105,75,190,.12);\n}\n\n.mood .emoji{\n  font-size:31px;\n  display:block;\n  margin-bottom:8px;\n}\n\n.mood-name{\n  font-size:13px;\n  font-weight:600;\n}\n\n/* CHIPS */\n\n.chips{\n  display:flex;\n  flex-wrap:wrap;\n  gap:9px;\n}\n\n.chip{\n  padding:9px 14px;\n  border:1px solid #3a3249;\n  border-radius:20px;\n  background:#1b1629;\n  font-size:13px;\n  cursor:pointer;\n  transition:.2s;\n}\n\n.chip:hover{\n  transform:translateY(-1px);\n}\n\n.chip.selected{\n  background:#1d172d;\n  border-color:#6948c0;\n  color:#9e8fcf;\n}\n\n/* BASELINE */\n\n.chart{\n  height:230px;\n  border-radius:18px;\n  overflow:hidden;\n  background:\n    linear-gradient(to bottom,#272131 1px,transparent 1px);\n  background-size:100% 46px;\n}\n\n.chart svg{\n  width:100%;\n  height:100%;\n}\n\n.baseline-note{\n  margin-top:13px;\n  font-size:13px;\n  color:#b9b5be;\n}\n\n/* INSIGHTS */\n\n.insight-grid{\n  display:grid;\n  grid-template-columns:repeat(3,1fr);\n  gap:13px;\n}\n\n.insight{\n  padding:18px;\n  border-radius:18px;\n  background:#1b1629;\n}\n\n.insight strong{\n  display:block;\n  margin-bottom:8px;\n}\n\n.insight p{\n  font-size:13px;\n  line-height:1.55;\n  color:#b7b3bb;\n}\n\n/* ACTION */\n\n.action{\n  padding:22px;\n  border-radius:22px;\n  background:linear-gradient(135deg,#1d172c,#28151e);\n}\n\n.action h3{\n  margin-bottom:8px;\n}\n\n.action p{\n  color:#bbb8c0;\n  line-height:1.65;\n  font-size:14px;\n}\n\n/* STORY */\n\n.story{\n  color:#bbb8bf;\n  line-height:1.7;\n  font-size:14px;\n}\n\n/* SUPPORT */\n\n.support{\n  background:linear-gradient(135deg,#2f182f,#1d1428);\n}\n\n.support p{\n  color:#bab7bf;\n  line-height:1.6;\n  font-size:14px;\n}\n\n.support-btn{\n  border:none;\n  padding:11px 17px;\n  border-radius:13px;\n  margin-top:14px;\n  background:#8971cc;\n  color:#2a2539;\n  font-weight:700;\n  cursor:pointer;\n}\n\n\n/* WELLNESS TAB */\n.tabs{display:flex;gap:10px;margin:0 0 20px;padding:6px;background:#231c31;border-radius:18px;position:sticky;top:12px;z-index:5}\n.tab-btn{flex:1;border:0;background:transparent;padding:12px 16px;border-radius:13px;font-weight:800;color:#b9b5be;cursor:pointer}\n.tab-btn.active{background:#2b2b2b;color:#9887cc;box-shadow:0 4px 12px rgba(70,50,100,.08)}\n.tab-panel{display:none}.tab-panel.active{display:block}\n.wellness-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.wellness-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}\n.field label{font-size:12px;font-weight:800;color:#bab7bf}.field input,.field textarea,.field select{width:100%;border:1px solid #3c354a;background:#1d182f;border-radius:13px;padding:11px 12px;font:inherit;color:#dfdce4;outline:none}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#6a4bbd;box-shadow:0 0 0 3px #1d172d}\n.primary-btn{border:0;background:#8971cc;color:#2b2b2b;padding:11px 16px;border-radius:13px;font-weight:800;cursor:pointer}.secondary-btn{border:1px solid #3a314a;background:#2b2b2b;color:#9b8cce;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}\n.log-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.record-list{margin-top:15px;display:grid;gap:8px}.record{padding:12px 14px;border-radius:14px;background:#1b1629;border:1px solid #2e2538;font-size:13px}.record strong{display:block;margin-bottom:4px}.muted{color:#afacb4;font-size:12px}\n.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:15px;border-radius:17px;background:#1b1629}.metric .value{font-size:23px;font-weight:800;color:#9b8cce}.metric .label{font-size:11px;color:#afacb4;margin-top:4px}\n.reason{padding:15px;border-radius:17px;background:linear-gradient(135deg,#1b162a,#26131a);margin-top:10px}.reason strong{display:block;margin-bottom:6px}.reason p{font-size:13px;line-height:1.55;color:#bab7bf}.confidence{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;padding:4px 7px;border-radius:10px;background:#2b2b2b;border:1px solid #362c45;color:#9d8fc4}\n.vocab-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.vocab{padding:8px 11px;border-radius:20px;background:#1d172d;color:#9b8cce;font-size:12px;font-weight:700;cursor:pointer}.vocab small{opacity:.7;margin-left:4px}.empty{color:#aeaab2;font-size:13px;padding:12px 0}\n.pattern-table{width:100%;border-collapse:collapse;font-size:12px}.pattern-table th,.pattern-table td{text-align:left;padding:9px;border-bottom:1px solid #2b2332}.pattern-table th{color:#b7b4bc;font-size:11px}.notice{padding:12px 14px;border-radius:14px;background:#191325;color:#b8b4bf;font-size:12px;line-height:1.5}\n@media(max-width:750px){.wellness-grid{grid-template-columns:1fr}.wellness-form{grid-template-columns:1fr}.field.full{grid-column:auto}.metric-row{grid-template-columns:1fr 1fr}.tabs{top:6px}}\n\n/* RESPONSIVE */\n\n@media(max-width:750px){\n\n  .moods{\n    grid-template-columns:repeat(2,1fr);\n  }\n\n  .insight-grid{\n    grid-template-columns:1fr;\n  }\n\n  .hero h1{\n    font-size:28px;\n  }\n\n  .safe-header{\n    align-items:flex-start;\n  }\n}\n\n<\/style>\n<style id=\"tb-dark\">:root{color-scheme:dark}html,body{background-color:#17141f}::selection{background:#c9b6f2;color:#17141f}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3450;border-radius:9px}input,select,textarea{color-scheme:dark}<\/style><\/head>\n\n\n<body>\n\n<div class=\"container\">\n\n  <!-- HEADER -->\n\n  <div class=\"header\">\n    <div class=\"logo\">✦ TrustBeat<\/div>\n    <div class=\"header-badge\">MOOD & WELLBEING<\/div>\n  <\/div>\n\n  <div class=\"tabs\" role=\"tablist\" aria-label=\"TrustBeat sections\">\n    <button class=\"tab-btn\" data-tab=\"mood\" role=\"tab\">💜 Mood<\/button>\n    <button class=\"tab-btn active\" data-tab=\"wellness\" role=\"tab\">🌿 Wellness<\/button>\n  <\/div>\n\n\n\n\n  <div id=\"moodPanel\" class=\"tab-panel\">\n  <!-- HERO -->\n\n  <section class=\"hero\">\n\n    <h1>Your mood has a story. ✨<\/h1>\n\n    <p>\n      TrustBeat helps you understand changes in your mood by connecting\n      your feelings with your own recent patterns in sleep, activity and\n      heart-rate context — without pretending to diagnose you.\n    <\/p>\n\n  <\/section>\n\n\n  <!-- DAILY MOOD -->\n\n  <section class=\"card\">\n\n    <h2>How are you feeling today?<\/h2>\n\n    <p class=\"subtitle\">\n      Your mood is compared with your own pattern, not somebody else's.\n    <\/p>\n\n    <div class=\"moods\">\n\n      <div class=\"mood\" data-mood=\"5\">\n        <span class=\"emoji\">🤩<\/span>\n        <span class=\"mood-name\">Amazing<\/span>\n      <\/div>\n\n      <div class=\"mood\" data-mood=\"4\">\n        <span class=\"emoji\">😊<\/span>\n        <span class=\"mood-name\">Good<\/span>\n      <\/div>\n\n      <div class=\"mood\" data-mood=\"3\">\n        <span class=\"emoji\">😐<\/span>\n        <span class=\"mood-name\">Okay<\/span>\n      <\/div>\n\n      <div class=\"mood\" data-mood=\"2\">\n        <span class=\"emoji\">😔<\/span>\n        <span class=\"mood-name\">Low<\/span>\n      <\/div>\n\n      <div class=\"mood\" data-mood=\"1\">\n        <span class=\"emoji\">🥺<\/span>\n        <span class=\"mood-name\">Very low<\/span>\n      <\/div>\n\n    <\/div>\n\n  <\/section>\n\n\n  <!-- CONTEXT -->\n\n  <section class=\"card\">\n\n    <h2>What might be influencing it?<\/h2>\n\n    <p class=\"subtitle\">\n      Optional — choose anything that feels relevant.\n    <\/p>\n\n    <div class=\"chips\">\n\n      <div class=\"chip\">🎓 College<\/div>\n      <div class=\"chip\">📚 Studies<\/div>\n      <div class=\"chip\">👥 Friends<\/div>\n      <div class=\"chip\">🏠 Family<\/div>\n      <div class=\"chip\">😴 Sleep<\/div>\n      <div class=\"chip\">💻 Work<\/div>\n      <div class=\"chip\">❤️ Health<\/div>\n      <div class=\"chip\">✨ Other<\/div>\n\n    <\/div>\n\n  <\/section>\n\n\n  <!-- MOOD GRAPH -->\n\n  <section class=\"card\">\n\n    <h2>Your mood pattern<\/h2>\n\n    <p class=\"subtitle\">\n      TrustBeat looks for changes against your personal baseline.\n    <\/p>\n\n    <div class=\"chart\">\n\n      <svg viewBox=\"0 0 1000 230\" preserveAspectRatio=\"none\">\n\n        <polyline\n          points=\"0,140 130,110 260,125 390,80 520,105 650,70 780,125 900,100 1000,82\"\n          fill=\"none\"\n          stroke=\"#8369c9\"\n          stroke-width=\"5\"\n          stroke-linecap=\"round\"\n          stroke-linejoin=\"round\"\n        />\n\n        <circle cx=\"0\" cy=\"140\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"130\" cy=\"110\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"260\" cy=\"125\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"390\" cy=\"80\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"520\" cy=\"105\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"650\" cy=\"70\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"780\" cy=\"125\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"900\" cy=\"100\" r=\"7\" fill=\"#8369c9\"/>\n        <circle cx=\"1000\" cy=\"82\" r=\"7\" fill=\"#8369c9\"/>\n\n      <\/svg>\n\n    <\/div>\n\n    <div class=\"baseline-note\">\n      ✦ Today looks slightly different from your recent pattern.\n      TrustBeat helps you notice the change rather than assuming its cause.\n    <\/div>\n\n  <\/section>\n\n\n  <!-- BODY CONTEXT -->\n\n  <section class=\"card\">\n\n    <h2>What might have influenced today?<\/h2>\n\n    <p class=\"subtitle\">\n      Patterns, not diagnoses.\n    <\/p>\n\n    <div class=\"insight-grid\">\n\n      <div class=\"insight\">\n\n        <strong>😴 Sleep<\/strong>\n\n        <p>\n          Your lower-mood days have sometimes followed shorter sleep.\n        <\/p>\n\n      <\/div>\n\n      <div class=\"insight\">\n\n        <strong>🚶 Activity<\/strong>\n\n        <p>\n          Your activity pattern is different today compared with your\n          recent routine.\n        <\/p>\n\n      <\/div>\n\n      <div class=\"insight\">\n\n        <strong>❤️ Heart rate<\/strong>\n\n        <p>\n          Your heart rate changed today, but TrustBeat doesn't assume\n          why.\n        <\/p>\n\n      <\/div>\n\n    <\/div>\n\n  <\/section>\n\n\n  <!-- HEART RATE CONTEXT -->\n\n  <section class=\"card\">\n\n    <h2>Your heart rate changed — what was happening?<\/h2>\n\n    <p class=\"subtitle\">\n      A higher heart rate can have many explanations.\n    <\/p>\n\n    <div class=\"chips\">\n\n      <div class=\"chip\">🏃 Exercising<\/div>\n      <div class=\"chip\">😣 Stressed<\/div>\n      <div class=\"chip\">🤩 Excited<\/div>\n      <div class=\"chip\">🤒 Unwell<\/div>\n      <div class=\"chip\">🤷 Not sure<\/div>\n\n    <\/div>\n\n  <\/section>\n\n\n  <!-- ACTION -->\n\n  <section class=\"card\">\n\n    <div class=\"action\">\n\n      <h3>🌱 A small action for today<\/h3>\n\n      <p>\n        Your recent pattern looks a little different today.\n        Instead of trying to fix everything at once, consider taking\n        a short break, getting some movement, resting, or talking to\n        someone you trust.\n      <\/p>\n\n    <\/div>\n\n  <\/section>\n\n\n  <!-- WEEKLY STORY -->\n\n  <section class=\"card\">\n\n    <h2>✨ Your weekly Body Story<\/h2>\n\n    <p class=\"subtitle\">\n      A simple explanation of your recent pattern.\n    <\/p>\n\n    <p class=\"story\">\n      Your mood was mostly stable this week, with a few lower days.\n      Those days also showed changes in sleep and activity.\n      TrustBeat doesn't claim that one caused the other — it simply\n      highlights patterns you may want to notice.\n    <\/p>\n\n  <\/section>\n\n\n  <!-- SUPPORT -->\n\n  <section class=\"card support\">\n\n    <h2>💜 Support Check<\/h2>\n\n    <p class=\"subtitle\">\n      Several low check-ins? TrustBeat gently checks in instead of\n      making assumptions.\n    <\/p>\n\n    <p>\n      You can review your patterns, talk to someone you trust,\n      or tell TrustBeat that you're feeling okay now.\n    <\/p>\n\n    <button class=\"support-btn\" onclick=\"showSupport()\">\n      View support options\n    <\/button>\n\n  <\/section>\n\n\n  <\/div>\n\n  <div id=\"wellnessPanel\" class=\"tab-panel active\">\n    <section class=\"hero\">\n      <h1>Understand your body. 🌿<\/h1>\n      <p>Wellness connects your daily experiences with your own sleep and screen-time patterns. Record what you feel, build your personal body vocabulary, and see possible reasons without treating correlations as diagnoses.<\/p>\n    <\/section>\n\n    <div class=\"wellness-grid\">\n      <section class=\"card\">\n        <h2>📝 Record a body signal<\/h2>\n        <p class=\"subtitle\">Capture headaches, fatigue, or any sensation in your own words.<\/p>\n        <div class=\"wellness-form\">\n          <div class=\"field\"><label>Date<\/label><input id=\"wDate\" type=\"date\"><\/div>\n          <div class=\"field\"><label>Time<\/label><input id=\"wTime\" type=\"time\"><\/div>\n          <div class=\"field\"><label>What are you noticing?<\/label><select id=\"wSymptom\"><option>Headache<\/option><option>Fatigue<\/option><option>Low energy<\/option><option>Brain fog<\/option><option>Body tension<\/option><option>Other<\/option><\/select><\/div>\n          <div class=\"field\"><label>Intensity · 1–10<\/label><input id=\"wIntensity\" type=\"number\" min=\"1\" max=\"10\" value=\"5\"><\/div>\n          <div class=\"field full\"><label>Personal vocabulary<\/label><input id=\"wVocabulary\" placeholder=\"e.g. heavy eyes, wired, foggy, tight shoulders\"><\/div>\n          <div class=\"field full\"><label>What was happening around you?<\/label><textarea id=\"wNotes\" placeholder=\"e.g. long screen session, skipped lunch, stressful meeting...\"><\/textarea><\/div>\n        <\/div>\n        <div class=\"log-row\"><button class=\"primary-btn\" id=\"saveWellness\">Save body signal<\/button><button class=\"secondary-btn\" id=\"clearWellness\">Clear<\/button><\/div>\n        <div id=\"signalList\" class=\"record-list\"><\/div>\n      <\/section>\n\n      <section class=\"card\">\n        <h2>🌙 Your daily inputs<\/h2>\n        <p class=\"subtitle\">These inputs power your personal pattern comparison.<\/p>\n        <div class=\"wellness-form\">\n          <div class=\"field\"><label>Date<\/label><input id=\"dDate\" type=\"date\"><\/div>\n          <div class=\"field\"><label>Sleep · hours<\/label><input id=\"dSleep\" type=\"number\" min=\"0\" max=\"24\" step=\"0.1\" placeholder=\"7.5\"><\/div>\n          <div class=\"field\"><label>Screen time · hours<\/label><input id=\"dScreen\" type=\"number\" min=\"0\" max=\"24\" step=\"0.1\" placeholder=\"5.0\"><\/div>\n          <div class=\"field\"><label>Sleep quality<\/label><select id=\"dQuality\"><option>Good<\/option><option>Okay<\/option><option>Poor<\/option><\/select><\/div>\n        <\/div>\n        <div class=\"log-row\"><button class=\"primary-btn\" id=\"saveDaily\">Save daily data<\/button><\/div>\n        <div id=\"dailyList\" class=\"record-list\"><\/div>\n      <\/section>\n    <\/div>\n\n    <section class=\"card\">\n      <h2>🔎 Body Pattern Detective<\/h2>\n      <p class=\"subtitle\">TrustBeat compares your recent records with your own baseline and looks for repeated relationships.<\/p>\n      <div class=\"metric-row\">\n        <div class=\"metric\"><div class=\"value\" id=\"avgSleep\">—<\/div><div class=\"label\">Average sleep<\/div><\/div>\n        <div class=\"metric\"><div class=\"value\" id=\"avgScreen\">—<\/div><div class=\"label\">Average screen time<\/div><\/div>\n        <div class=\"metric\"><div class=\"value\" id=\"signalCount\">0<\/div><div class=\"label\">Body signals logged<\/div><\/div>\n      <\/div>\n      <div id=\"reasons\" style=\"margin-top:14px\"><\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>🗺️ Trigger → body response map<\/h2>\n      <p class=\"subtitle\">Repeated combinations become visible here. A pattern is not proof of cause.<\/p>\n      <div id=\"patternMap\" class=\"record-list\"><\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>📖 Personal body vocabulary<\/h2>\n      <p class=\"subtitle\">Your own words become searchable signals over time.<\/p>\n      <div id=\"vocabulary\" class=\"vocab-wrap\"><\/div>\n      <div class=\"notice\" style=\"margin-top:14px\">Tip: use words that describe the sensation itself — for example “heavy eyes,” “wired,” “tight chest,” “foggy,” or “hollow stomach.”<\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>⏪ Body Replay<\/h2>\n      <p class=\"subtitle\">Review a recent day as a sequence instead of isolated numbers.<\/p>\n      <div id=\"replay\" class=\"record-list\"><\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\nconst TB_STORE='trustbeatWellnessV1';\nconst state=JSON.parse(localStorage.getItem(TB_STORE)||'{\"daily\":[],\"signals\":[]}');\nconst $=id=>document.getElementById(id);\nfunction save(){localStorage.setItem(TB_STORE,JSON.stringify(state));}\nfunction today(){return new Date().toISOString().slice(0,10)}\nfunction esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[c]));}\nfunction avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}\nfunction setDefaults(){ $('wDate').value=today(); $('dDate').value=today(); $('wTime').value=new Date().toTimeString().slice(0,5); }\nfunction renderSignals(){\n  $('signalCount').textContent=state.signals.length;\n  $('signalList').innerHTML=state.signals.length?state.signals.slice().reverse().slice(0,6).map((x,i)=>`<div class=\"record\"><strong>${esc(x.symptom)} · ${x.intensity}/10<\/strong><span class=\"muted\">${esc(x.date)} ${esc(x.time||'')} · ${esc(x.vocab||'No personal vocabulary added')}<\/span>${x.notes?`<div style=\"margin-top:5px\">${esc(x.notes)}<\/div>`:''}<\/div>`).join(''):'<div class=\"empty\">No body signals yet. Your first few entries create the baseline.<\/div>';\n}\nfunction renderDaily(){\n  const sleep=state.daily.map(x=>x.sleep).filter(Number.isFinite), screen=state.daily.map(x=>x.screen).filter(Number.isFinite);\n  $('avgSleep').textContent=sleep.length?avg(sleep).toFixed(1)+'h':'—'; $('avgScreen').textContent=screen.length?avg(screen).toFixed(1)+'h':'—';\n  $('dailyList').innerHTML=state.daily.length?state.daily.slice().reverse().slice(0,6).map(x=>`<div class=\"record\"><strong>${esc(x.date)} · ${x.sleep}h sleep · ${x.screen}h screen<\/strong><span class=\"muted\">Sleep quality: ${esc(x.quality)}<\/span><\/div>`).join(''):'<div class=\"empty\">No daily data yet.<\/div>';\n}\nfunction generateReasons(){\n  const out=[]; const daily=state.daily.slice().sort((a,b)=>a.date.localeCompare(b.date));\n  const signals=state.signals;\n  if(daily.length>=3){\n    const lowSleep=avg(daily.map(x=>x.sleep))<7;\n    const highScreen=avg(daily.map(x=>x.screen))>6;\n    if(lowSleep) out.push(['Shorter sleep may be part of the pattern','Your logged sleep average is below 7 hours. Check whether headache or fatigue entries cluster after shorter nights.','Moderate']);\n    if(highScreen) out.push(['Higher screen-time exposure may be worth watching','Your logged screen-time average is above 6 hours. This is a pattern to compare with your own headache/fatigue records, not a diagnosis.','Moderate']);\n  }\n  ['Headache','Fatigue','Low energy'].forEach(type=>{\n    const matches=signals.filter(s=>s.symptom===type);\n    if(matches.length>=2){\n      const dates=new Set(matches.map(s=>s.date)); const related=daily.filter(d=>dates.has(d.date));\n      if(related.length){\n        const sl=avg(related.map(d=>d.sleep)), ss=avg(related.map(d=>d.screen));\n        const base=avg(daily.map(d=>d.sleep)), bscreen=avg(daily.map(d=>d.screen));\n        if(sl<base-0.5) out.push([`${type} often appears after less sleep`,`On days with this signal, your recorded sleep averages ${sl.toFixed(1)}h versus ${base.toFixed(1)}h across your logged days.`,'Moderate']);\n        if(ss>bscreen+1) out.push([`${type} often appears on higher-screen days`,`On days with this signal, your recorded screen time averages ${ss.toFixed(1)}h versus ${bscreen.toFixed(1)}h across your logged days.`,'Moderate']);\n      }\n    }\n  });\n  if(!out.length) out.push(['Not enough history yet','Keep recording sleep, screen time, and body signals for a few days. TrustBeat will only surface a reason when your own records show a repeatable difference.','Early']);\n  $('reasons').innerHTML=out.map(r=>`<div class=\"reason\"><strong>💡 ${esc(r[0])}<\/strong><p>${esc(r[1])}<\/p><span class=\"confidence\">${esc(r[2])} confidence<\/span><\/div>`).join('');\n}\nfunction renderVocabulary(){\n  const counts={}; state.signals.forEach(s=>(s.vocab||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(v=>counts[v]=(counts[v]||0)+1));\n  const items=Object.entries(counts).sort((a,b)=>b[1]-a[1]);\n  $('vocabulary').innerHTML=items.length?items.map(([v,c])=>`<span class=\"vocab\">${esc(v)} <small>${c}×<\/small><\/span>`).join(''):'<div class=\"empty\">Your personal words will appear here as you log them.<\/div>';\n}\nfunction renderPatterns(){\n  const rows=[]; const daily=state.daily;\n  ['Headache','Fatigue','Low energy'].forEach(type=>{\n    const ss=state.signals.filter(s=>s.symptom===type); if(!ss.length||!daily.length)return;\n    const dates=new Set(ss.map(s=>s.date)), rel=daily.filter(d=>dates.has(d.date)); if(!rel.length)return;\n    const allSleep=avg(daily.map(d=>d.sleep)), relSleep=avg(rel.map(d=>d.sleep)); const allScreen=avg(daily.map(d=>d.screen)), relScreen=avg(rel.map(d=>d.screen));\n    rows.push(`<div class=\"record\"><strong>${esc(type)}<\/strong><table class=\"pattern-table\"><tr><th>Metric<\/th><th>Signal days<\/th><th>All logged days<\/th><\/tr><tr><td>Sleep<\/td><td>${relSleep.toFixed(1)}h<\/td><td>${allSleep.toFixed(1)}h<\/td><\/tr><tr><td>Screen time<\/td><td>${relScreen.toFixed(1)}h<\/td><td>${allScreen.toFixed(1)}h<\/td><\/tr><\/table><\/div>`);\n  });\n  $('patternMap').innerHTML=rows.length?rows.join(''):'<div class=\"empty\">Record at least two similar body signals and a few daily inputs to build a trigger → response map.<\/div>';\n}\nfunction renderReplay(){\n  const dates=[...new Set([...state.daily.map(x=>x.date),...state.signals.map(x=>x.date)])].sort().reverse().slice(0,5);\n  $('replay').innerHTML=dates.length?dates.map(date=>{const d=state.daily.find(x=>x.date===date), ss=state.signals.filter(x=>x.date===date);return `<div class=\"record\"><strong>${esc(date)}<\/strong><div class=\"muted\">${d?`🌙 ${d.sleep}h sleep · 📱 ${d.screen}h screen · ${esc(d.quality)} sleep`: 'No sleep/screen entry'}<\/div>${ss.length?`<div style=\"margin-top:6px\">${ss.map(x=>`• ${esc(x.symptom)} ${x.intensity}/10${x.vocab?` · “${esc(x.vocab)}”`:''}`).join('<br>')}<\/div>`:'<div class=\"muted\" style=\"margin-top:6px\">No body signal logged.<\/div>'}<\/div>`}).join(''):'<div class=\"empty\">Your replay will appear after you record your first day.<\/div>';\n}\nfunction render(){renderSignals();renderDaily();generateReasons();renderVocabulary();renderPatterns();renderReplay();}\n$('saveWellness').onclick=()=>{state.signals.push({date:$('wDate').value||today(),time:$('wTime').value,symptom:$('wSymptom').value,intensity:Math.min(10,Math.max(1,Number($('wIntensity').value)||5)),vocab:$('wVocabulary').value,notes:$('wNotes').value});save();render();$('wVocabulary').value='';$('wNotes').value='';};\n$('clearWellness').onclick=()=>{['wVocabulary','wNotes'].forEach(id=>$(id).value='');$('wIntensity').value=5;};\n$('saveDaily').onclick=()=>{const date=$('dDate').value||today(), sleep=Number($('dSleep').value), screen=Number($('dScreen').value); if(!Number.isFinite(sleep)||!Number.isFinite(screen)){alert('Please enter sleep and screen time.');return;} state.daily=state.daily.filter(x=>x.date!==date);state.daily.push({date,sleep,screen,quality:$('dQuality').value});save();render();};\ndocument.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');$(btn.dataset.tab==='mood'?'moodPanel':'wellnessPanel').classList.add('active');}));\n// Existing mood interactions\ndocument.querySelectorAll('.mood').forEach(card=>card.addEventListener('click',()=>{document.querySelectorAll('.mood').forEach(item=>item.classList.remove('selected'));card.classList.add('selected');}));\ndocument.querySelectorAll('#moodPanel .chip').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('selected')));\nfunction showSupport(){alert('Support options:\\n\\n• Talk to someone you trust\\n• Review your recent mood pattern\\n• Check in again later\\n\\nTrustBeat does not make assumptions about how you feel.');}\nsetDefaults();render();\n<\/script><\/html><script>(function(){function P(){try{return JSON.parse(localStorage.getItem(\"trustbeat_user_data\")||\"null\")}catch(e){return null}}\nwindow.__tbName=function(){var p=P();return p&&p.name?p.name:\"\"};\ndocument.addEventListener(\"DOMContentLoaded\",function(){var n=window.__tbName();if(!n)return;var h=document.querySelector(\"h1\");if(!h||document.getElementById(\"tbHi\"))return;\nvar s=document.createElement(\"div\");s.id=\"tbHi\";s.textContent=\"Hi, \"+n+\" 💜\";s.style.cssText=\"display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:99px;background:#251a33;color:#b1a2ce;font:700 13px Arial,sans-serif\";h.parentNode.insertBefore(s,h);});})();<\/script><script>(function(){var RX=/\\b(suicid\\w*|kill(?:ing)? myself|end(?:ing)? my (?:own )?life|take my own life|want(?:ed)? to die|wanna die|don['\\u2019]?t want to (?:live|be here)|self[- ]?harm\\w*|hurt(?:ing)? myself|cut(?:ting)? myself|hopeless\\w*|no reason to live|better off dead|end it all)\\b/i;\nfunction reg(){var z=\"\";try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||\"\"}catch(e){}var l=(navigator.language||\"\").toLowerCase();if(/Kolkata|Calcutta/.test(z)||/-in$/.test(l))return\"IN\";if(/^Australia\\//.test(z))return\"AU\";if(/^Europe\\/London/.test(z)||l===\"en-gb\" al-scale=1.0\">\n<title>TrustBeat — Diet Plan & Grocery Checklist<\/title>\n<style>\n  :root{--bg:#171c24;--card:#2b2b2b;--text:#dde2ec;--muted:#b2b7c0;--line:#2a313c;--accent:#7596df;--accent2:#c0eeeb;--danger:#e29c9c}\n  *{box-sizing:border-box}\n  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}\n  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 50px}\n  h1,h2,h3,p{margin-top:0}\n  h1{font-size:32px;margin-bottom:8px}.sub{color:var(--muted);margin-bottom:24px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(20,30,50,.04)}\n  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:end}\n  label{display:block;font-size:14px;font-weight:650}\n  input,select{width:100%;margin-top:7px;padding:11px 12px;border:1px solid #3c4552;border-radius:10px;background:#2b2b2b;font:inherit}\n  button,.shop-btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}\n  .primary{background:var(--accent);color:#2b2b2b}.secondary{background:#1c232b;color:#d7dde6}\n  .note{font-size:13px;color:var(--muted);margin-top:12px}\n  .warning{display:none;color:var(--danger);background:#281416;border:1px solid #4a262b;padding:10px 12px;border-radius:10px;margin-top:12px}\n  .diet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}\n  .day{border:1px solid var(--line);border-radius:14px;padding:15px;background:#2b2b2b}\n  .meal{padding:10px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0}\n  .meal-label{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--accent2);letter-spacing:.05em}\n  .meal-name{font-weight:750;margin-top:3px}.ingredients{font-size:13px;color:var(--muted);margin-top:3px re excluded from this list.<\/div>\n      <\/div>\n      <button class=\"secondary\" id=\"clearBtn\" type=\"button\">Clear checks<\/button>\n    <\/div>\n    <div id=\"groceryList\" class=\"grocery-list\"><\/div>\n\n    <h3 style=\"margin-top:24px;margin-bottom:8px\">Shop online<\/h3>\n    <div class=\"shop-buttons\">\n      <a class=\"shop-btn blinkit\" href=\"https://blinkit.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Shop on Blinkit<\/a>\n      <a class=\"shop-btn bigbasket\" href=\"https://www.bigbasket.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Shop on BigBasket<\/a>\n      <a class=\"shop-btn zepto\" href=\"https://www.zeptonow.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Shop on Zepto<\/a>\n    <\/div>\n    <div class=\"small\" style=\"margin-top:9px\">The buttons open the shopping services. They do not automatically transfer your checked items into their carts.<\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst GROCERY_KEY = \"trustbeat_standalone_grocery_checks\";\n\nconst baseItems = [\n  \"rice\",\"whole-wheat flour/roti\",\"poha\",\"oats\",\"semolina\",\"idli/dosa batter\",\n  \"moong dal\",\"toor dal\",\"rajma\",\"chickpeas\",\"besan\",\"sprouts\",\"curd\",\n  \"paneer or tofu\",\"eggs\",\"peanuts\",\"makhana\",\"almonds or seeds\",\n  \"seasonal fruit\",\"banana or apple\",\"carrot\",\"beans\",\"peas\",\"spinach\",\n  \"cucumber\",\"tomato\",\"onion\",\"capsicum\",\"coriander\",\"lemon\",\"jaggery\",\n  \"mild spices\",\"cooking oil\"\n];\n\nconst days = [\n  {day:\"Day 1\",b:[\"Poha with vegetables\",\"poha, onion, carrot, peas\"],l:[\"Rajma rice + salad\",\"rajma, rice, cucumber, tomato\"],s:[\"Seasonal fruit\",\"fruit\"],d:[\"Paneer/tofu with roti\",\"paneer or tofu, roti, vegetables\"]},\n  {day:\"Day 2\",b:[\"Oats with banana\",\"oats, banana, seeds\"],l:[\"Moong dal + roti + vegetables\",\"moong dal, roti, spinach\"],s:[\"Makhana\",\"makhana\"],d:[\"Idli with sambar-style dal\",\"idli, dal, vegetables\"]},\n  {day:\"Day 3\",b:[\"Idli/dosa with vegetables\",\"idli/dosa batter, vegetables\"],l:[\"Chickpea rice bowl\",\"chickpeas, rice, cucumber, tomato\"],s:[\"Fruit + seeds\",\"fruit, seeds\"],d:[\"Paneer/tofu roti roll\",\"paneer or tofu, roti, capsicum\"]},\n  {day:\"Day 4\",b:[\"Upma with vegetables\",\"semolina, carrot, peas\"],l:[\"Toor dal rice + salad\",\"toor dal, rice, cucumber\"],s:[\"Makhana or fruit\",\"makhana, fruit\"],d:[\"Moong dal khichdi\",\"moong dal, rice, vegetables\"]},\n  {day:\"Day 5\",b:[\"Poha + fruit\",\"poha, vegetables, fruit\"],l:[\"Rajma roti + salad\",\"rajma, roti, cucumber, tomato\"],s:[\"Sprouts\",\"sprouts, lemon\"],d:[\"Paneer/tofu + vegetables\",\"paneer or tofu, spinach, roti\"]},\n  {day:\"Day 6\",b:[\"Oats + seasonal fruit\",\"oats, fruit, seeds\"],l:[\"Chickpea rice + vegetables\",\"chickpeas, rice, vegetables\"],s:[\"Makhana\",\"makhana\"],d:[\"Dal + roti + salad\",\"dal, roti, cucumber, tomato\"]},\n  {day:\"Day 7\",b:[\"Dosa/idli + vegetables\",\"idli/dosa batter, vegetables\"],l:[\"Toor/moong dal rice\",\"dal, rice, spinach\"],s:[\"Banana or apple\",\"fruit\"],d:[\"Paneer/tofu roti + vegetables\",\"paneer or tofu, roti, vegetables\"]}\n];\n\n/*\n  Dashboard integration:\n  The standalone version does not create duplicate age/allergy/profile fields.\n  When integrated into the full TrustBeat app, readDashboardProfile() should\n  receive the existing dashboard/profile object.\n\n  This reader also looks through common localStorage structures so the standalone\n  file can demonstrate the intended behaviour without changing the dashboard.\n*/\nfunction readDashboardProfile(){\n  const profile = {\n    age: \"\",\n    allergies: [],\n    preference: \"vegetarian\",\n    goal: \"balanced\"\n  };\n\n  const possibleKeys = [\n    \"trustbeat_user_data\",\"trustbeat_profile\",\n    \"trustbeat_user\",\n    \"trustbeat_user_profile\",\n    \"trustbeat_dashboard\",\n    \"userProfile\",\n    \"profile\"\n  ];\n\n  for(const key of possibleKeys){\n    try{\n      const raw = localStorage.getItem(key);\n      if(!raw) continue;\n      const data = JSON.parse(raw);\n      if(!data || typeof data !== \"object\") continue;\n\n      const a = data.allergies ?? data.allergy ?? data.userAllergies;\n      const age = data.age ?? data.userAge;\n      const pref = data.preference ?? data.foodPreference ?? data.dietPreference;\n      const goal = data.goal ?? data.healthGoal ?? data.dietGoal;\n\n      if(age !== undefined && age !== null && age !== \"\") profile.age = age;\n      if(pref) profile.preference = String(pref).toLowerCase();\n      if(goal) profile.goal = String(goal).toLowerCase();\n\n      if(Array.isArray(a)) profile.allergies.push(...a);\n      else if(typeof a === \"string\") profile.allergies.push(...a.split(\",\"));\n    }catch(e){}\n  }\n\n  profile.allergies = [...new Set(\n    profile.allergies\n      .flatMap(x => String(x).split(\",\"))\n      .map(x => x.trim().toLowerCase())\n      .filter(Boolean)\n  )];\n\n  return profile;\n}\n\nfunction allergyTokens(profile){\n  return profile.allergies || [];\n}\n\nfunction isBlocked(text, tokens){\n  const s = text.toLowerCase();\n  return tokens.some(a => {\n    const allergy = a.trim().toLowerCase();\n    return allergy && (s.includes(allergy) || allergy.includes(s));\n  });\n}\n\nfunction renderPlan(tokens){\n  document.getElementById(\"dietPlan\").innerHTML = days.map(d => {\n    const meals = [[\"Breakfast\",d.b],[\"Lunch\",d.l],[\"Snack\",d.s],[\"Dinner\",d.d]];\n    return `<article class=\"day\"><h3>${d.day}<\/h3>${\n      meals.map(([label,m]) => {\n        const blocked = isBlocked(m.join(\" \"), tokens);\n        return `<div class=\"meal\">\n          <div class=\"meal-label\">${label}<\/div>\n          <div class=\"meal-name\">${blocked ? \"Choose an allergy-safe equivalent\" : escapeHtml(m[0])}<\/div>\n          <div class=\"ingredients\">${blocked ? \"Use a trusted substitute that fits your allergy guidance\" : escapeHtml(m[1])}<\/div>\n
